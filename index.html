<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monmon's Life</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monmon's Life">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fff2f6">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@500;600&family=Lalezar&family=Cairo:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: one phone column; six colour-coded sections (Today rose, Food coral, Money mint, Plans lilac, Grow sky, Me berry).
   Each section: segmented sub-menu, then stacked soft cards with a 1.5px tinted border. Tab bar pinned to the bottom. */
:root{
  --bg:#fff4f8; --bg2:#ffe6ef; --surface:#ffffff; --ink:#4b1f33; --muted:#9a6a7e; --line:#f5d6e1;
  --rose:#ff5c8f; --coral:#ff7f5c; --mint:#22b07d; --lilac:#8f6bff; --sky:#3b9cf5; --berry:#d9479a; --gold:#e8a317; --warn:#ff6a3d; --danger:#ef3b5d;
  --rose-soft:#ffd6e3; --coral-soft:#ffe1d6; --mint-soft:#d6f5e8; --lilac-soft:#e8e0ff; --sky-soft:#dcedff; --berry-soft:#fbdcee; --gold-soft:#fff0c9;
  --acc:var(--rose); --acc-soft:var(--rose-soft);
  --shadow:0 12px 28px -18px rgba(150,40,90,.45);
  --r:22px;
  --f-display:"Shrikhand","Lalezar","Georgia",serif;
  --f-body:"Nunito","Cairo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Fredoka","Nunito","Cairo",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}

:root[data-theme="dark"]{
  --bg:#211019; --bg2:#311827; --surface:#2f1a26; --ink:#ffe8f0; --muted:#d2a5b9; --line:#4a2a3b;
  --rose:#ff7aa5; --coral:#ff9a7c; --mint:#4fd8a4; --lilac:#ae94ff; --sky:#6db7ff; --berry:#f06db4; --gold:#ffc542; --warn:#ff8f66; --danger:#ff6380;
  --rose-soft:#55233d; --coral-soft:#55302a; --mint-soft:#1f4637; --lilac-soft:#3a2f5c; --sky-soft:#22394f; --berry-soft:#522540; --gold-soft:#4d3d16;
  --shadow:0 12px 28px -18px rgba(0,0,0,.7); color-scheme:dark}
body[data-tab="today"]{--acc:var(--rose);--acc-soft:var(--rose-soft)}
body[data-tab="food"]{--acc:var(--coral);--acc-soft:var(--coral-soft)}
body[data-tab="money"]{--acc:var(--mint);--acc-soft:var(--mint-soft)}
body[data-tab="plans"]{--acc:var(--lilac);--acc-soft:var(--lilac-soft)}
body[data-tab="grow"]{--acc:var(--sky);--acc-soft:var(--sky-soft)}
body[data-tab="me"]{--acc:var(--berry);--acc-soft:var(--berry-soft)}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden;transition:background .4s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:12px}

.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(46px);opacity:.55;animation:drift 18s ease-in-out infinite alternate;transition:background .6s}
.blob.a{width:280px;height:280px;background:var(--acc-soft);top:-80px;right:-90px}
.blob.b{width:220px;height:220px;background:var(--gold-soft);bottom:140px;left:-100px;animation-delay:-6s}
.blob.c{width:170px;height:170px;background:var(--lilac-soft);top:42%;right:-70px;animation-delay:-11s}
@keyframes drift{to{transform:translate(30px,40px) scale(1.12)}}

.app{position:relative;z-index:1;max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 130px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{margin:0;font-size:12px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-family:var(--f-display);font-weight:400;font-size:clamp(25px,7.6vw,34px);line-height:1.05;color:var(--rose)}
h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--ink);text-wrap:balance;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc);flex:0 0 auto}
h2.plain::before{display:none}
h3{margin:0;font-size:11.5px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--acc)}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
.iconbtn svg{width:20px;height:20px}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);border:1.5px solid color-mix(in srgb,var(--acc) 16%,var(--line));box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.tint{background:linear-gradient(145deg,var(--surface) 35%,var(--acc-soft))}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pop{animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{opacity:.0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

/* segmented control */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:0 -2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:13px;font-weight:800;color:var(--muted);transition:all .2s}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 8px 16px -10px var(--acc)}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 120px}
.card>.field,.sc .field,.grow .field,.sheet-in>.field{flex:0 0 auto}
.field>span{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.in{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;min-width:0;transition:border-color .2s}
.in:focus{border-color:var(--acc)}
textarea.in{resize:vertical;min-height:64px;font-weight:600;line-height:1.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
input[type=date].in,input[type=time].in{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;min-height:46px;direction:ltr;text-align:center}
input[type=date].in::-webkit-date-and-time-value,input[type=time].in::-webkit-date-and-time-value{text-align:center;margin:0}
.sc .fields input[type=date].in,.sc .fields input[type=time].in{min-height:38px}
select.in{min-width:0;max-width:100%}
.btn{background:var(--acc);color:#fff;font-weight:900;padding:11px 16px;border-radius:14px;flex:0 0 auto;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.soft{background:var(--acc-soft);color:var(--acc)}
.btn.full{width:100%}
.linkbtn{font-size:12px;font-weight:900;color:var(--acc);padding:6px 11px;border-radius:999px;background:var(--acc-soft);flex:0 0 auto}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);min-width:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .t{font-weight:700;min-width:0;overflow-wrap:anywhere}
.item .s{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.tick{width:26px;height:26px;border-radius:9px;border:2px solid var(--acc-soft);display:grid;place-items:center;transition:all .25s cubic-bezier(.3,1.6,.5,1);flex:0 0 auto}
.tick svg{width:14px;height:14px;stroke:#fff;stroke-width:4;fill:none;opacity:0}
.tick.on{background:var(--mint);border-color:var(--mint);transform:rotate(-6deg)}
.tick.on svg{opacity:1}
.del{color:var(--muted);font-size:20px;line-height:1;min-width:30px;height:30px;border-radius:15px;display:grid;place-items:center;padding:0 6px}
.del.armed{font-size:12px;color:var(--danger);font-weight:900;background:color-mix(in srgb,var(--danger) 12%,transparent)}
.empty{font-size:13px;color:var(--muted);text-align:center;padding:10px 0}
.amt{font-family:var(--f-num);font-weight:600;white-space:nowrap}
.pill{display:inline-block;font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:999px;background:var(--acc-soft);color:var(--acc);margin-right:4px;vertical-align:1px}
.pill.urgent{background:var(--danger);color:#fff}
.pill.high{background:var(--gold-soft);color:#a86d00}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);font-size:13px;font-weight:800;transition:all .2s}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;transform:translateY(-1px)}
.chip .cnt{font-family:var(--f-num);font-size:11px;opacity:.85}
.hgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.habit{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:16px;background:var(--bg);border:1.5px solid var(--line);text-align:left;font-weight:800;font-size:13.5px;min-width:0;transition:all .25s cubic-bezier(.3,1.5,.5,1)}
.habit .e{font-size:19px}
.habit .hs{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.habit.on{background:var(--mint-soft);border-color:var(--mint);transform:scale(1.02)}
.habit .hl{min-width:0}
.habit .fire{margin-left:auto;font-family:var(--f-num);font-size:12px;color:var(--warn);white-space:nowrap}
.hgrid.hg3{grid-template-columns:repeat(3,1fr);gap:7px}
.habit.mini{position:relative;flex-direction:column;justify-content:center;text-align:center;gap:3px;padding:12px 6px 10px;font-size:12px;line-height:1.2}
.habit.mini .e{font-size:22px}
.habit.mini .hl{overflow-wrap:anywhere}
.habit.mini .hs{font-size:10.5px}
.habit.mini .fire{position:absolute;top:4px;right:6px;margin:0;font-size:10.5px}
.habit.met{border-color:var(--mint);border-style:dashed}
.ov{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.ovt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:16px;background:var(--bg);border:1.5px solid var(--line);text-align:center;min-width:0;color:var(--ink)}
.ovt .oe{font-size:20px}
.ovt b{font-family:var(--f-num);font-size:17px;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovt span:last-child{font-size:10.5px;font-weight:800;color:var(--muted);line-height:1.2;overflow-wrap:anywhere}
.ovt:active{transform:scale(.96)}
.wedtrack{background:linear-gradient(150deg,var(--rose-soft),var(--gold-soft));border-color:transparent;gap:10px}
.wedtrack .wtop{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.wedtrack .wn{font-size:48px;font-weight:600;color:var(--rose);line-height:1}
.wedpill{background:var(--rose-soft);color:var(--rose)}
.tagw{border:1.5px dashed var(--line);background:var(--bg);border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:800;color:var(--muted);white-space:nowrap}
.tagw.on{border-style:solid;border-color:var(--rose);background:var(--rose-soft);color:var(--rose)}

/* hero + stats */
.greet{font-family:var(--f-display);font-size:22px;line-height:1.1}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:16px;padding:10px;text-align:center;border:1.5px solid var(--line)}
.stat b{display:block;font-family:var(--f-num);font-size:20px;font-weight:600;color:var(--acc)}
.stat span{font-size:11px;font-weight:800;color:var(--muted)}
.money3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mbox{background:var(--surface);border-radius:20px;padding:12px;border:1.5px solid color-mix(in srgb,var(--acc) 16%,var(--line));box-shadow:var(--shadow);min-width:0}
.mbox b{display:block;font-family:var(--f-num);font-size:18px;font-weight:600;overflow-wrap:anywhere;color:var(--ink)}
.mbox span{font-size:11px;font-weight:800;color:var(--muted)}

/* urgent banner */
.urgent{background:linear-gradient(135deg,var(--danger),var(--warn));color:#fff;border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 14px 28px -14px var(--danger);animation:pulse 2s ease-in-out infinite}
.urgent h2{color:#fff}.urgent h2::before{background:#fff}
.urgent .ur{display:flex;align-items:center;gap:10px;font-weight:800;text-align:left}
.urgent .ur .tick{border-color:rgba(255,255,255,.7)}
.urgent .card-head h2{margin:0}
.flag{flex:0 0 auto;width:32px;height:32px;border-radius:999px;border:1.5px dashed var(--line);background:var(--bg);font-size:14px;line-height:1;filter:grayscale(1);opacity:.5;transition:all .2s}
.ibtns{display:inline-flex;gap:4px;align-items:center;flex:0 0 auto}
.bell{flex:0 0 auto;width:32px;height:32px;border-radius:999px;border:1.5px dashed var(--line);background:var(--bg);font-size:14px;line-height:1;filter:grayscale(1);opacity:.5;transition:all .2s}
.bell.on{filter:none;opacity:1;border-style:solid;border-color:var(--gold);background:var(--gold-soft)}
.urgent .bell{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.6)}
.flag.on{filter:none;opacity:1;border-style:solid;border-color:var(--danger);background:#ffe3e8;transform:scale(1.05)}
.urgent .flag.on{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.75)}
@keyframes pulse{0%,100%{box-shadow:0 14px 28px -14px var(--danger)}50%{box-shadow:0 14px 34px -8px var(--danger)}}

/* mood */
.moods{display:flex;justify-content:space-between;gap:6px}
.mood{flex:1;font-size:26px;padding:8px 0;border-radius:16px;background:var(--bg);border:1.5px solid var(--line);transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.mood.on{background:var(--acc-soft);border-color:var(--acc);transform:scale(1.08)}
.mood span{display:block;font-size:10px;font-weight:900;color:var(--muted);margin-top:2px}
.qlab{font-weight:800;font-size:14px;color:var(--ink);text-transform:none!important;letter-spacing:0!important}

/* meals */
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 8px;margin:0 -2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dpill{flex:0 0 52px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);font-family:var(--f-num);transition:transform .25s}
.dpill .dn{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dpill .dd{font-size:19px;font-weight:600}
.dpill .dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dpill.done .dot{background:var(--mint)}
.dpill.part .dot{background:var(--gold)}
.dpill.today{border-style:dashed;border-color:var(--acc)}
.dpill.sel{background:var(--acc);border-color:var(--acc);color:#fff;transform:translateY(-3px)}
.dpill.sel .dn{color:#fff}
.ringwrap{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{position:relative;width:124px;height:124px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--acc-soft);stroke-width:12}
.ring .fill{fill:none;stroke:url(#grad);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.3,1.4,.5,1)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-family:var(--f-num);font-size:26px;font-weight:600;line-height:1}
.ring .sm{font-size:11px;color:var(--muted);font-weight:800}
.bar{height:10px;border-radius:999px;background:var(--acc-soft);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--lilac),var(--acc));transition:width .9s cubic-bezier(.3,1.3,.5,1)}
.bar.over>i{background:linear-gradient(90deg,var(--gold),var(--danger))}
.bar.good>i{background:linear-gradient(90deg,var(--sky),var(--mint))}
.statrow{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:800;text-align:left}
.sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .25s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.sw[aria-checked="true"]{background:var(--acc)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.cups{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.cup{aspect-ratio:3/4;max-width:100%;border-radius:10px 10px 14px 14px;border:2px solid var(--sky-soft);position:relative;overflow:hidden}
.cup::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#9fd8ff,#79b8ff);transition:height .45s cubic-bezier(.3,1.4,.5,1)}
.cup.on::after{height:78%}
.cup.on{border-color:#9fd0ff}
.meal{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border-radius:var(--r);padding:13px;border:1.5px solid color-mix(in srgb,var(--acc) 16%,var(--line));box-shadow:var(--shadow);transition:background .3s}
.meal .ic{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.meal .ic svg{width:24px;height:24px}
.meal .txt{min-width:0}
.meal .lbl{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.meal .nm{font-weight:800;font-size:14.5px;line-height:1.3;margin-top:2px}
.meal .mac{font-family:var(--f-num);font-size:12px;color:var(--muted);margin-top:3px}
.meal .swap{font-size:11px;font-weight:900;color:var(--acc);background:var(--acc-soft);padding:3px 9px;border-radius:999px;letter-spacing:0;text-transform:none}
.check{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--acc-soft);display:grid;place-items:center;transition:all .3s cubic-bezier(.3,1.6,.5,1)}
.check svg{width:16px;height:16px;stroke:#fff;stroke-width:3.5;fill:none;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s .1s}
.meal.eaten{background:var(--mint-soft)}
.meal.eaten .check{background:var(--mint);border-color:var(--mint)}
.meal.eaten .check svg{stroke-dashoffset:0}
.meal.eaten .nm{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--mint) 70%,transparent);text-decoration-thickness:2px}
.dish{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);text-align:left;width:100%}
.dish:last-child{border-bottom:0}
.dish .t{font-weight:700;overflow-wrap:anywhere}

/* ============ LANGUAGE: Egyptian Arabic (default) or English ============
   The app is written in English. In Arabic mode every text the page shows is translated on the fly:
   AR holds exact strings, AR_RX handles strings built from parts (numbers, names, dates),
   AR_WORDS is the last resort for single words left inside a sentence. Dates and months switch arrays. */
const AR = Object.create(null);
const AR_RX = [];
const AR_WORDS = [];
const AR_WD = ['الأحد', 'الاتنين', 'التلات', 'الأربع', 'الخميس', 'الجمعة', 'السبت'];
const AR_MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
function lang(){ try { return (S && S.settings && S.settings.lang) || 'ar'; } catch(e){ return 'ar'; } }
const isAr = () => lang() === 'ar';
const trCache = new Map(), trOut = new Set();
let wordsRx = null;
function tr(s){
  if (s == null) return s; s = String(s);
  if (!isAr() || !/[A-Za-z]/.test(s) || trOut.has(s)) return s;
  if (trCache.has(s)) return trCache.get(s);
  const m = /^(\s*)([\s\S]*?)(\s*)$/.exec(s);
  let out = s;
  try { out = m[1] + trCore(m[2]) + m[3]; } catch(e){}
  trCache.set(s, out); trOut.add(out); return out;
}
const flipArrows = s => s.replace(/[›‹→←]/g, c => ({'›':'‹', '‹':'›', '→':'←', '←':'→'}[c]));
function trCore(t){
  if (!t || !/[A-Za-z]/.test(t)) return t;
  if (AR[t] != null) return AR[t];
  // leading emoji or symbols, trailing emoji, hearts or arrows
  const sm = /^([^A-Za-z0-9؀-ۿ“"'(+]*)([\s\S]*?)([\s‍️←-⇿⌀-⏿☀-➿⬀-⯿\u{1F000}-\u{1FFFF}♡›‹→←✓✦]*)$/u.exec(t);
  if (sm && (sm[1] || sm[3]) && sm[2]){
    const mid = sm[2];
    if (AR[mid] != null) return sm[1] + AR[mid] + flipArrows(sm[3]);
    if (/[A-Za-z]/.test(mid) && mid !== t){ const r = trCore(mid); if (r !== mid) return sm[1] + r + flipArrows(sm[3]); }
  }
  const latin = x => (x.match(/[A-Za-z]/g) || []).length;
  if (t.includes(' · ')){
    const parts = t.split(' · ').map(trCore).join(' · ');
    if (!latin(parts)) return parts;
    const whole = rxChain(t); return latin(whole) < latin(parts) ? whole : parts;
  }
  return rxChain(t);
}
function rxChain(t){
  let r = t;
  for (const [rx, rep] of AR_RX){ if (!/[A-Za-z]{2}/.test(r)) break; if (rx.test(r)) r = r.replace(rx, rep); }
  return /[A-Za-z]{2}/.test(r) ? trWords(r) : r;
}
function trWords(t){
  if (!AR_WORDS.length) return t;
  if (!wordsRx){
    AR_WORDS.sort((a, b) => b[0].length - a[0].length);
    wordsRx = new RegExp('(^|[^A-Za-z])(' + AR_WORDS.map(w => w[0].replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')(?![A-Za-z])', 'g');
  }
  const map = new Map(AR_WORDS);
  return t.replace(wordsRx, (all, pre, w) => pre + map.get(w));
}
// a name inside a sentence: translate it if it is one of ours, keep it if it is hers
const trName = n => tr(n);

/* ---------- the page ---------- */
const TR_ATTRS = ['placeholder', 'aria-label', 'title'];
function trText(n){
  const p = n.parentNode; if (!p || p.nodeType !== 1) return;
  const tag = p.nodeName; if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'TEXTAREA' || (p.closest && p.closest('[data-notr]'))) return;
  const v = n.nodeValue; if (!v || !/[A-Za-z]/.test(v) || trOut.has(v)) return;
  const nv = tr(v); if (nv !== v) n.nodeValue = nv;
}
function trEl(el){
  for (const a of TR_ATTRS){ const v = el.getAttribute(a); if (v && /[A-Za-z]/.test(v)){ const nv = tr(v); if (nv !== v) el.setAttribute(a, nv); } }
  if (el.nodeName === 'INPUT' && (el.type === 'text' || el.type === 'search') && el.value && AR[el.value] != null) el.value = AR[el.value];
}
function trNode(root){
  if (!isAr() || !root) return;
  if (root.nodeType === 3) return trText(root);
  if (root.nodeType !== 1) return;
  trEl(root);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
  let n; while ((n = w.nextNode())){ if (n.nodeType === 3) trText(n); else trEl(n); }
}
let trObserver = null;
function applyLang(){
  const ar = isAr(), H = document.documentElement;
  H.lang = ar ? 'ar' : 'en'; H.dir = ar ? 'rtl' : 'ltr';
  if (ar){
    WD.splice(0, 7, ...AR_WD); MONTHS.splice(0, 12, ...AR_MONTHS); MONTHS_L.splice(0, 12, ...AR_MONTHS);
    document.title = tr(document.title);
    if (!trObserver){
      trObserver = new MutationObserver(muts => { for (const m of muts){ if (m.type === 'characterData') trText(m.target); else m.addedNodes.forEach(trNode); } });
      trObserver.observe(document.body, {childList:true, subtree:true, characterData:true});
    }
    trNode(document.body);
  }
}
function trReminders(r){
  if (!isAr()) return r;
  const f = x => Object.assign({}, x, {title:tr(x.title), body:tr(x.body)});
  return {repeat:r.repeat.map(f), once:r.once.map(f)};

  "Erikson sorts people into four colours: Red (direct, decisive), Yellow (enthusiastic, social), Green (calm, loyal) and Blue (careful, analytical). Most conflict comes from speaking only your own colour.": "إريكسون بيقسم الناس لأربع ألوان: أحمر (مباشر وحاسم)، أصفر (متحمس واجتماعي)، أخضر (هادي ووفي)، وأزرق (دقيق وتحليلي). أغلب الخناقات بتيجي من إنك بتتكلمي بلونك انتي بس.",
  "Before a hard work conversation, guess their colour. Give Reds the bottom line, Yellows energy, Greens time and reassurance, Blues data and details.": "قبل أي كلام صعب في الشغل، خمّني لونهم. الأحمر اديله الخلاصة، الأصفر طاقة، الأخضر وقت وطمأنينة، والأزرق أرقام وتفاصيل.",
  "The colour model is a lens, not a science: psychologists consider it a simplification. Its real value is reminding you that “difficult” people often just communicate differently.": "موديل الألوان عدسة مش علم: علماء النفس شايفينه تبسيط. قيمته الحقيقية إنه بيفكرك إن الناس «الصعبة» غالبًا بس بتتواصل بطريقة مختلفة.",
  "Next time someone annoys you, ask “what do they need that I’m not giving?” before deciding they’re the problem.": "المرة الجاية لما حد يضايقك، اسألي «هو محتاج إيه أنا مش بديهوله؟» قبل ما تقرري إنه هو المشكلة.",
  "People give and receive love in five main ways: words of affirmation, quality time, gifts, acts of service and physical touch. We tend to give love in our own language, not theirs.": "الناس بتدي وتاخد الحب بخمس طرق: كلام حلو، وقت مع بعض، هدايا، خدمات، ولمسة. وإحنا غالبًا بنحب بلغتنا إحنا، مش بلغتهم.",
  "Ask your fiancé which one matters most to him, and tell him yours. It’s one of the best conversations before marriage.": "اسألي خطيبك أنهي واحدة بتفرق معاه أكتر، وقوليله بتاعتك. ده من أحلى الكلام قبل الجواز.",
  "In Gottman’s studies, stable couples had about five positive interactions for every negative one during conflict.": "في دراسات جوتمان، الأزواج المستقرين كان عندهم حوالي خمس مواقف حلوة قصاد كل موقف وحش وقت الخلاف.",
  "If you have to raise something hard today, surround it with warmth: appreciation first, the issue second, affection after.": "لو لازم تفتحي موضوع صعب النهارده، حاوطيه بدفا: تقدير الأول، الموضوع تاني، وحنية بعدها.",
  "Gottman found contempt (eye-rolling, mockery, superiority) to be the strongest predictor of divorce among his “Four Horsemen”: criticism, contempt, defensiveness and stonewalling.": "جوتمان لقى إن الاحتقار (تقليب العين، التريقة، التعالي) أقوى مؤشر للطلاق من «الفرسان الأربعة»: النقد، الاحتقار، الدفاعية، والتجاهل.",
  "Complain about the behaviour, not the person: “I felt alone when you were on your phone” instead of “You never care.”": "اشتكي من التصرف، مش من الشخص: «حسيت إني لوحدي لما كنت على الموبايل» بدل «انت عمرك ما بتهتم.»",
  "Couples still together six years later had “turned toward” each other’s small bids for attention about 86% of the time; couples who divorced, about 33%.": "الأزواج اللي فضلوا مع بعض بعد ست سنين كانوا بيستجيبوا لمحاولات الاهتمام الصغيرة من بعض حوالي 86% من الوقت؛ واللي اتطلقوا حوالي 33%.",
  "When someone you love shares something small, a meme, a thought, a sigh, turn toward it. Small moments build the marriage.": "لما حد بتحبيه يشاركك حاجة صغيرة، ميم، فكرة، تنهيدة، اهتمي بيها. اللحظات الصغيرة هي اللي بتبني الجواز.",
  "People with a growth mindset believe ability is built through effort and learning; they see failure as information, not identity.": "اللي عندهم عقلية النمو مؤمنين إن القدرة بتتبني بالمجهود والتعلم؛ وشايفين الفشل معلومة، مش هوية.",
  "Add “yet” to one sentence today: “I’m not good at email campaigns, yet.”": "زودي «لسه» على جملة النهارده: «أنا مش شاطرة في حملات الإيميل، لسه.»",
  "Duckworth’s research found passion plus long-term perseverance often predicts achievement better than talent alone.": "أبحاث داكوورث لقت إن الشغف مع المثابرة على المدى الطويل غالبًا بيتوقعوا النجاح أحسن من الموهبة لوحدها.",
  "Choose one long-term goal and show up for it today, especially if you’re bored. Boredom is where most people quit.": "اختاري هدف طويل واحد واشتغلي عليه النهارده، خصوصًا لو زهقانة. الزهق هو المكان اللي أغلب الناس بتبطل فيه.",
  "We have a fast, emotional System 1 and a slow, deliberate System 2. Most bad decisions are fast ones that deserved slow thinking.": "عندنا نظام 1 سريع وعاطفي، ونظام 2 بطيء ومتأني. أغلب القرارات الوحشة كانت سريعة وكانت محتاجة تفكير بطيء.",
  "For any decision over a few thousand pounds or a big life choice, sleep on it once before saying yes.": "أي قرار فوق كام ألف جنيه أو اختيار كبير في حياتك، نامي عليه ليلة قبل ما تقولي آه.",
  "Loss aversion: losing something feels roughly twice as painful as gaining the same thing feels good.": "النفور من الخسارة: إنك تخسري حاجة بيوجع تقريبًا ضعف فرحتك لو كسبتيها.",
  "When an investment dips, remember the pain is louder than the facts. Don’t make money decisions on a scary day.": "لما استثمار ينزل، افتكري إن الوجع صوته أعلى من الحقايق. متاخديش قرارات فلوس في يوم مخوّف.",
  "“Everything can be taken from a man but one thing: the last of the human freedoms, to choose one’s attitude in any given set of circumstances.”": "«كل حاجة ممكن تتاخد من الإنسان إلا حاجة واحدة: آخر حرياته، إنه يختار موقفه في أي ظروف.»",
  "You can’t control every part of today, but you can choose how you meet it. Choose on purpose.": "مش هتقدري تتحكمي في كل حاجة النهارده، بس تقدري تختاري هتقابليه إزاي. اختاري عن قصد.",
  "Brown’s research found vulnerability is the birthplace of connection, courage and creativity, not weakness.": "أبحاث براون لقت إن الضعف الإنساني هو أصل التواصل والشجاعة والإبداع، مش ضعف.",
  "Say the honest thing today, kindly: ask for help, admit you’re tired, tell someone you miss them.": "قولي الحاجة الصادقة النهارده بلطف: اطلبي مساعدة، اعترفي إنك تعبانة، قولي لحد إنه وحشك.",
  "Focus on your circle of influence (what you can act on), not your circle of concern (everything you worry about).": "ركزي على دايرة تأثيرك (اللي تقدري تعملي فيه حاجة)، مش دايرة قلقك (كل حاجة بتقلقك).",
  "Write your worry, then circle the one part you can act on today. Do that part; release the rest.": "اكتبي اللي قلقك، وعلّمي على الجزء الوحيد اللي تقدري تعملي فيه حاجة النهارده. اعمليه؛ وسيبي الباقي.",
  "Begin with the end in mind: imagine who you want to be at the end, then plan backwards.": "ابدئي والنهاية في دماغك: تخيلي عايزة تبقي مين في الآخر، وخططي بالعكس.",
  "Picture yourself one year after your wedding. What habits does that woman have? Start one of them this week.": "تخيلي نفسك بعد الفرح بسنة. الست دي عندها عادات إيه؟ ابدئي واحدة منها الأسبوع ده.",
  "Become genuinely interested in other people. A person’s own name is, to them, the sweetest sound.": "اهتمي بالناس بجد. اسم الواحد هو أحلى صوت بالنسباله.",
  "Use people’s names today and ask one follow-up question about something they care about.": "نادي الناس بأساميهم النهارده واسألي سؤال متابعة عن حاجة تهمهم.",
  "The former FBI negotiator recommends labelling emotions (“It seems like…”) and asking “how” and “what” questions instead of saying no.": "المفاوض السابق في الـ FBI بينصح إنك تسمّي المشاعر («شكلك…») وتسألي بـ«إزاي» و«إيه» بدل ما تقولي لأ.",
  "When an offer is too low, try: “How am I supposed to do that?” Then stay quiet and let them answer.": "لما العرض يبقى قليل أوي، جربي: «المفروض أعمل ده إزاي؟» وبعدين اسكتي وسيبيهم يردوا.",
  "In Babcock’s study of graduates, far more men than women negotiated their first salary (57% vs 7%), a gap that compounds over a career.": "في دراسة بابكوك على الخريجين، الرجالة فاوضوا على أول مرتب أكتر بكتير من الستات (57% قصاد 7%)، وده فرق بيكبر على مدار الشغل كله.",
  "Never accept a first offer without asking for more. The worst answer is usually just “no”.": "عمرك ما توافقي على أول عرض من غير ما تطلبي أكتر. أوحش رد غالبًا هيبقى «لأ» بس.",
  "Focused work without distraction produces far more value than scattered hours of shallow work.": "الشغل المركز من غير تشتيت بيطلع قيمة أكتر بكتير من ساعات متقطعة من الشغل السطحي.",
  "Block 60 minutes today with your phone in another room for your most important task.": "احجزي 60 دقيقة النهارده والموبايل في أوضة تانية لأهم تاسك عندك.",
  "If it isn’t a clear yes, then it’s a clear no. Saying no to the good makes room for the great.": "لو مش آه واضحة، يبقى لأ واضحة. إنك تقولي لأ للكويس بيفضّي مكان للأحسن.",
  "Say no to one thing this week that you’d only half-want to do.": "قولي لأ لحاجة واحدة الأسبوع ده انتي عايزاها نص نص.",
  "Don’t take anything personally: what others say and do is mostly about their own world.": "متاخديش حاجة على نفسك: اللي الناس بتقوله وبتعمله غالبًا عن دنيتهم هما.",
  "If someone is rude today, let it be their story, not yours.": "لو حد كان قليل الذوق النهارده، خليها حكايته هو، مش حكايتك.",
  "Seneca wrote that we suffer more often in imagination than in reality.": "سينيكا كتب إننا بنتعذب في خيالنا أكتر ما بنتعذب في الحقيقة.",
  "When you catch yourself picturing the worst, ask: is this happening, or am I rehearsing it?": "لما تلاقي نفسك بتتخيلي الأسوأ، اسألي: ده بيحصل فعلًا، ولا أنا بتمرّن عليه؟",
  "Some things are within our control (our choices, effort, attitude) and some are not (others’ opinions, outcomes). Peace comes from knowing the difference.": "في حاجات في إيدينا (اختياراتنا، مجهودنا، موقفنا) وحاجات لأ (آراء الناس، النتايج). الراحة بتيجي من إنك تعرفي الفرق.",
  "Sort today’s stress into two lists: mine and not mine. Spend energy only on the first.": "قسمي ضغط النهارده لليستتين: بتاعي ومش بتاعي. اصرفي طاقتك على الأولى بس.",
  "Kiyosaki defines an asset as something that puts money in your pocket and a liability as something that takes money out.": "كيوساكي بيعرّف الأصل إنه حاجة بتحط فلوس في جيبك، والالتزام إنه حاجة بتطلع فلوس منه.",
  "Before a big purchase, like a car, list its monthly costs: fuel, insurance, maintenance. Budget for the real price.": "قبل أي حاجة كبيرة زي العربية، اكتبي مصاريفها الشهرية: بنزين، تأمين، صيانة. اعملي ميزانية للسعر الحقيقي.",
  "Pay yourself first: keep at least a tenth of everything you earn before paying anyone else.": "ادفعي لنفسك الأول: خلي على الأقل عُشر اللي بتكسبيه ليكي قبل ما تدفعي لأي حد.",
  "On payday, move your saving and investing amount first, then live on the rest.": "يوم القبض، حوّلي مبلغ التحويش والاستثمار الأول، وعيشي بالباقي.",
  "This study has followed people for over 80 years. Its clearest finding: good relationships keep us happier and healthier than money or fame.": "الدراسة دي متابعة ناس من أكتر من 80 سنة. أوضح نتيجة فيها: العلاقات الحلوة بتخلينا أسعد وأصح من الفلوس والشهرة.",
  "Invest in one relationship today: call your mom, plan a date, reply to a friend you’ve been meaning to.": "استثمري في علاقة واحدة النهارده: كلمي مامتك، خططي لخروجة، أو ردي على صاحبتك اللي كان نفسك تردي عليها.",
  "People who regularly wrote down things they were grateful for reported more optimism and better wellbeing than those who didn’t.": "اللي كانوا بيكتبوا الحاجات اللي ممتنين لها بانتظام كانوا أكتر تفاؤلًا وأحسن حالًا من اللي مكانوش بيكتبوا.",
  "Answer one of today’s diary questions with three specific things you’re grateful for.": "جاوبي سؤال من أسئلة اليوميات النهارده بتلات حاجات محددة انتي ممتنة لها.",
  "Spending on experiences tends to bring more lasting happiness than spending on things, partly because we adapt to things quickly.": "الصرف على التجارب غالبًا بيجيب سعادة بتدوم أكتر من الصرف على الحاجات، جزء من السبب إننا بنتعود على الحاجات بسرعة.",
  "Next time you want to treat yourself, consider an experience from your list instead of an item.": "المرة الجاية لما تحبي تدلعي نفسك، فكري في تجربة من ليستتك بدل حاجة تشتريها.",
  "People are more likely to start new goals at “temporal landmarks”: a Monday, a new month, a birthday.": "الناس بتبدأ أهداف جديدة أكتر عند «علامات الوقت»: يوم اتنين، شهر جديد، عيد ميلاد.",
  "Use the next landmark on purpose. Decide now what you’ll start on the 1st of the month.": "استغلي العلامة الجاية عن قصد. قرري دلوقتي هتبدئي إيه يوم 1 في الشهر.",
  "Plans in the form “When X happens, I will do Y” make people far more likely to follow through.": "الخطط اللي على شكل «لما يحصل كذا، هعمل كذا» بتخلي الناس تكمّل أكتر بكتير.",
  "Write one: “When I finish lunch, I will read 5 pages.”": "اكتبي واحدة: «لما أخلص الغدا، هقرا 5 صفحات.»",
  "In experiments, people greatly overestimated how much others noticed their appearance or mistakes.": "في التجارب، الناس بالغوا جدًا في تقدير قد إيه غيرهم واخد باله من شكلهم أو غلطاتهم.",
  "Wear the outfit, ask the question, post the idea. People are thinking about themselves, not you.": "البسي الطقم، اسألي السؤال، انشري الفكرة. الناس بتفكر في نفسها، مش فيكي.",
  "Research shows that treating yourself kindly after a mistake increases motivation to improve, rather than making you lazy.": "الأبحاث بتقول إنك لما تعاملي نفسك بحنية بعد غلطة، بيزيد حماسك تتحسني، مش بيكسّلك.",
  "Talk to yourself today the way you’d talk to your best friend after a bad day.": "كلمي نفسك النهارده زي ما بتكلمي أقرب صاحبة ليكي بعد يوم وحش.",
  "Work expands to fill the time available for its completion.": "الشغل بيتمط عشان يملا الوقت المتاح له.",
  "Give your next task a shorter deadline than feels comfortable, and watch it shrink to fit.": "ادي التاسك الجاي ديدلاين أقصر من المريح، وشوفيه بيصغر عشان يلحق.",
  "Roughly 80% of results often come from 20% of efforts.": "تقريبًا 80% من النتايج غالبًا بتيجي من 20% من المجهود.",
  "Which 20% of your work brings most of your results? Do that first today.": "أنهي 20% من شغلك بتجيب أغلب نتايجك؟ اعمليها الأول النهارده.",
  "In a famous study, shoppers offered 6 jams were about 10 times more likely to buy than those offered 24.": "في دراسة مشهورة، الناس اللي اتعرض عليهم 6 أنواع مربى اشتروا حوالي 10 أضعاف اللي اتعرض عليهم 24.",
  "Reduce your options to decide faster: two outfits, three dinner choices, one course at a time.": "قللي اختياراتك عشان تقرري أسرع: طقمين، تلات اختيارات للعشا، كورس واحد في المرة.",

  "Investing": "استثمار", "Economics": "اقتصاد", "Politics": "سياسة", "Health": "صحة", "Jobs": "شغل", "Countries": "بلاد", "Top countries": "البلاد الأولى", "Women": "الستات", "Psychology": "علم نفس",

  // ---------- facts ----------
  "Rule of 72: divide 72 by your yearly return to estimate how many years it takes money to double. At 12% a year, about 6 years.": "قاعدة الـ72: اقسمي 72 على العائد السنوي عشان تعرفي الفلوس هتتضاعف في كام سنة. بـ12% في السنة، حوالي 6 سنين.",
  "Investing 1,000 EGP a month at 15% a year for 20 years grows to roughly 1.5 million EGP before inflation, from 240,000 EGP put in. Time does most of the work.": "لو استثمرتي 1,000 جنيه في الشهر بـ15% في السنة لمدة 20 سنة، هتوصل لحوالي 1.5 مليون جنيه قبل التضخم، من 240,000 جنيه بس حطيتيهم. الوقت بيعمل أغلب الشغل.",
  "Over 15 years or more, the large majority of actively managed US stock funds have done worse than the simple S&P 500 index, according to S&P’s SPIVA reports.": "على مدى 15 سنة أو أكتر، أغلب صناديق الأسهم الأمريكية المُدارة كانت أوحش من مؤشر S&P 500 البسيط، حسب تقارير SPIVA.",
  "A 1% yearly fee sounds small, but over 30 years it can eat about a quarter of your final returns. Always check fees.": "رسوم 1% في السنة شكلها صغيرة، بس على 30 سنة ممكن تاكل حوالي ربع أرباحك. دايمًا بصي على الرسوم.",
  "Investing a fixed amount on a schedule, called dollar-cost averaging, means you buy more when prices are low and less when they’re high, without guessing.": "إنك تستثمري مبلغ ثابت في مواعيد ثابتة (متوسط التكلفة) معناه إنك بتشتري أكتر لما الأسعار تنزل وأقل لما تطلع، من غير تخمين.",
  "Many of the stock market’s best days come right after its worst ones. People who sell in panic often miss the recovery.": "أحسن أيام البورصة كتير بتيجي بعد أوحش أيامها على طول. اللي بيبيعوا من الخضة غالبًا بيفوتهم الرجوع.",
  "Gold has long been a store of value when currencies lose value, but it pays no interest or dividends. It protects wealth more than it grows it.": "الدهب من زمان مخزن للقيمة لما العملات تقل قيمتها، بس مش بيدي فايدة ولا أرباح. بيحمي الثروة أكتر ما بيكبّرها.",
  "The EGX30 is the main index of the Egyptian Exchange, tracking 30 of its largest and most traded companies.": "EGX30 هو المؤشر الرئيسي للبورصة المصرية، وبيتابع أكبر 30 شركة وأكترهم تداول.",
  "Your real return is your return minus inflation. A 20% certificate during 25% inflation still loses buying power.": "عائدك الحقيقي هو العائد ناقص التضخم. شهادة بـ20% وقت تضخم 25% لسه بتخسّرك قوة شرائية.",
  "Money you’ll need within 3 to 5 years usually belongs somewhere safer than stocks, because markets can drop sharply in the short term.": "الفلوس اللي هتحتاجيها في خلال 3 لـ 5 سنين مكانها غالبًا حاجة أأمن من الأسهم، لأن السوق ممكن ينزل جامد في المدى القصير.",
  "When inflation is high, central banks usually raise interest rates. Borrowing gets more expensive, saving gets more attractive and spending slows.": "لما التضخم يعلى، البنوك المركزية غالبًا بترفع الفايدة. السلف بيغلى، والتحويش بيبقى أحلى، والصرف بيهدى.",
  "Egypt’s main sources of foreign currency include remittances from Egyptians working abroad, Suez Canal fees, tourism and exports.": "أهم مصادر العملة الصعبة في مصر: تحويلات المصريين بره، رسوم قناة السويس، السياحة، والتصدير.",
  "Roughly 12% of global trade passes through the Suez Canal, which makes shipping disruptions in the Red Sea felt worldwide.": "حوالي 12% من التجارة العالمية بتعدي من قناة السويس، عشان كده أي مشكلة شحن في البحر الأحمر العالم كله بيحس بيها.",
  "When a currency is devalued, imports get more expensive and exports get cheaper for foreign buyers.": "لما العملة تتعوم، الاستيراد بيغلى والتصدير بيرخص على المشتري الأجنبي.",
  "The US dollar is on one side of about 88% of all currency trades in the world, according to the Bank for International Settlements (2022).": "الدولار الأمريكي طرف في حوالي 88% من كل تداولات العملات في العالم، حسب بنك التسويات الدولية (2022).",
  "GDP is the total value of everything a country produces in a year. A common rule of thumb defines a recession as two quarters in a row of shrinking GDP.": "الناتج المحلي هو قيمة كل اللي البلد بتنتجه في سنة. والقاعدة المشهورة إن الركود هو ربعين سنة ورا بعض الناتج فيهم بيقل.",

const LS = 'monmon-life-v2';
let S = DEF();
(function load(){
  let local = null, nat = null;
  try { local = JSON.parse(localStorage.getItem(LS) || 'null'); } catch(e){}
  if (!local){ try { local = JSON.parse(localStorage.getItem('monmon-v1') || 'null'); } catch(e){} }
  try { nat = window.__NATIVE_STATE__ || null; } catch(e){}
  const pick = (nat && (!local || (nat.savedAt || 0) >= (local.savedAt || 0))) ? nat : local;
  if (pick && typeof pick === 'object') S = merge(DEF(), pick);
  if (!Array.isArray(S.habits) || !S.habits.length) S.habits = JSON.parse(JSON.stringify(DEFAULT_HABITS));
  if (!S.noDonateHabit){ S.habits = S.habits.filter(h => h.id !== 'donate'); S.noDonateHabit = true; }
  S.habits.forEach(h => { if (!(h.target > 0)) h.target = 1; if (h.reward == null) h.reward = ''; });
})();
function merge(base, src){
  for (const k in src){
    if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) base[k] = merge(base[k], src[k]);
    else base[k] = src[k];
  }
  return base;
}
function native(){ try { return window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.app; } catch(e){ return null; } }
let saveTimer = null;
function save(){
  S.savedAt = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){}

/* ============ celebrations ============ */
function confetti(canvas){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const dpr = devicePixelRatio || 1, ctx = canvas.getContext('2d'), W = canvas.width = innerWidth * dpr, H = canvas.height = innerHeight * dpr;
  const cols = ['#ff5c8f','#ffb48f','#b9a3ff','#3fbf8f','#ffd166','#7cc4ff'];
  const ps = Array.from({length:140}, () => ({x:W / 2, y:H * .45, vx:(Math.random() - .5) * 26 * dpr, vy:(-Math.random() * 22 - 6) * dpr, s:(5 + Math.random() * 7) * dpr, c:cols[Math.floor(Math.random() * cols.length)], r:Math.random() * 6, vr:(Math.random() - .5) * .3, h:Math.random() < .3}));
  let t = 0;
  (function frame(){
    if (!canvas.isConnected) return;
    ctx.clearRect(0, 0, W, H); t++;
    ps.forEach(p => { p.vy += .55 * dpr; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.h){ ctx.font = (p.s * 2) + 'px serif'; ctx.fillText('♥', 0, 0); } else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore(); });
    if (t < 220) requestAnimationFrame(frame);
  })();
}

  const iso = d => ymd(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  const push = (id, title, body, when) => { if (when > now) once.push({id, title, body, at:iso(when)}); };
  if (R.water) [11,13,16,19].forEach(h => repeat.push({id:'water-' + h, title:'Water break \u{1F4A7}', body:'Have a glass of water and tap it in Monmon’s Life.', hour:h, minute:0}));
  if (R.diary){

    repeat.push({id:'diary-2', title:'Before you sleep \u{1F319}', body:'If you haven’t yet, close the day in your diary. Then rest, beautiful.', hour:2, minute:0});
  }
  if (R.checkin) repeat.push({id:'checkin', title:'Evening check-in ✨', body:'Tick your habits, log your spending and what you did today.', hour:22, minute:0});
  if (R.money){
    const amt = S.settings.invest ? money(S.settings.invest) : 'your monthly amount';
    repeat.push({id:'invest', title:'New month: invest \u{1F4B0}', body:'Add ' + amt + ' to your investments this month.', day:1, hour:10, minute:0});
    repeat.push({id:'gold', title:'Gold reminder ✨', body:'Buy gold this month.', day:1, hour:10, minute:5});
    repeat.push({id:'scplan', title:'Plan your self-care month \u{1F338}', body:'Open Plans › Self-care and set this month’s sessions and prices.', day:1, hour:10, minute:10});
    repeat.push({id:'salary', title:'Log your salary \u{1F4B5}', body:'Add this month’s salary in Money › Salary.', day:1, hour:12, minute:0});
  }
  if (R.plans){
    S.tasks.filter(t => !t.done && t.due && t.prio === 'urgent').forEach(t => {
      const tm = t.time ? t.time.split(':').map(Number) : null, due = parseD(t.due);
      const eve = at(due, 20, 0); eve.setDate(eve.getDate() - 1);
      push('tu1-' + t.id, '\u{1F6A8} Urgent tomorrow', t.title, eve);
      push('tu2-' + t.id, '\u{1F6A8} Urgent today', t.title + (t.time ? ' · by ' + t.time : ''), at(due, 9, 0));
      if (tm){ const b = at(due, tm[0], tm[1]); b.setHours(b.getHours() - 1); push('tu3-' + t.id, '\u{1F6A8} 1 hour left', t.title, b); }
    });
    S.mashawer.filter(m => !m.done && m.remind !== false && m.date).forEach(m => {
      const t = m.time ? m.time.split(':').map(Number) : [10, 0];
      const when = at(parseD(m.date), t[0], t[1]); when.setDate(when.getDate() - 1);
      push('m-' + m.id, 'Tomorrow: ' + m.name + ' \u{1F4CD}', (m.time ? 'At ' + m.time + '. ' : '') + (m.note || 'Your meshwar is tomorrow.'), when);
    });
    Object.values(S.selfcare).forEach(list => list.forEach(s => {
      if (s.done || !s.planned) return;
      const when = at(parseD(s.planned), 20, 0); when.setDate(when.getDate() - 1);
      push('s-' + s.id, 'Tomorrow: ' + s.e + ' ' + s.name, s.price ? ('Budget: ' + money(s.price)) : 'Your self-care session is tomorrow.', when);
    }));
    S.tasks.filter(t => !t.done && t.due && t.prio !== 'urgent').forEach(t => {
      if (t.prio === 'high'){ const eve = at(parseD(t.due), 20, 0); eve.setDate(eve.getDate() - 1); push('th-' + t.id, '⚠\u{FE0F} Important tomorrow', t.title, eve); }
      push('t-' + t.id, (t.kind === 'work' ? 'Work task due today' : 'To-do today'), t.title, at(parseD(t.due), 9, 0));
    });
    S.exp.filter(x => !x.done && x.date).forEach(x => { const when = at(parseD(x.date), 19, 0); when.setDate(when.getDate() - 1); push('x-' + x.id, 'Tomorrow: ' + x.title + ' ✨', x.with && x.with.length ? 'With ' + x.with.join(', ') : 'A new experience awaits.', when); });
  }
  if (R.meals){
    const slots = [['Breakfast',9,0],['Lunch',14,0],['Snack',17,30],['Dinner',20,30]];
    for (let o = 0; o < 4; o++){
      const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + o);
      const n = planDayNum(d); if (n < 1 || n > 30) continue;
      mealsFor(n).forEach((m, i) => push('meal-' + n + '-' + i, slots[i][0] + ' time, Monmon ♡', m.name + ' · ' + m.kcal + ' kcal', at(d, slots[i][1], slots[i][2])));
    }
  }
  lifeReminders(R, repeat, push, at);
  once.sort((a, b) => a.at < b.at ? -1 : 1);
  return {repeat, once};
}

function setupSelfcare(k){

}

  const list = S.skills.filter(s => s.kind === kind), isSkill = kind === 'skill', defE = isSkill ? '\u{1F4C8}' : '\u{1F3A8}';
  el.innerHTML = '<div class="card tint"><div class="greet">' + (isSkill ? 'Skills I’m mastering \u{1F4DA}' : 'Hobbies I’m learning \u{1F3A8}') + '</div><span class="small muted" style="font-weight:700">Log each practice session, move the slider as you grow, and keep your next step clear.</span></div>' +
    (list.length ? '<div class="card"><div class="list">' + list.map(s => '<div class="grow"><div class="gh"><span class="ge">' + s.e + '</span><span style="min-width:0"><span class="gn">' + esc(s.name) + '</span><span class="small muted" style="display:block;font-weight:700">' + (s.sessions || 0) + ' sessions · ' + (s.progress || 0) + '%</span></span>' + delBtn('data-gdel', s.id) + '</div>' +
      '<input class="range" type="range" min="0" max="100" step="5" value="' + (s.progress || 0) + '" data-gp="' + s.id + '" aria-label="Progress for ' + esc(s.name) + '">' +
      '<label class="field"><span>Next step</span><input class="in" data-gnext="' + s.id + '" value="' + esc(s.next || '') + '" placeholder="The very next thing to do"></label>' +
      '<label class="field"><span>Notes and resources</span><textarea class="in" data-gnotes="' + s.id + '" placeholder="Courses, links, what I learned…" style="min-height:52px">' + esc(s.notes || '') + '</textarea></label>' +
      '<button class="btn soft" data-gsess="' + s.id + '">+ I practiced today</button></div>').join('') + '</div></div>' : '') +
    '<div class="card"><h2>Add a ' + (isSkill ? 'skill' : 'hobby') + '</h2>' + emoPicker(ui.gEmo || defE, 'data-ge') + '<label class="field"><span>Name</span><input class="in" id="gN" placeholder="' + (isSkill ? 'SEO, Meta ads, copywriting…' : 'Painting, belly dancing, crochet…') + '"></label><button class="btn full" id="gAdd">Add</button></div>';
  const again = () => VIEWS['grow.' + (isSkill ? 'skills' : 'hobbies')](el);
  bindEmo(el, 'data-ge', e => { ui.gEmo = e; });
  $('#gAdd', el).onclick = () => { const n = $('#gN', el).value.trim(); if (!n) return toast('Name it'); S.skills.push({id:uid(), kind, name:n, e:ui.gEmo || defE, progress:0, next:'', notes:'', sessions:0}); ui.gEmo = null; save(); again(); };
  $$('[data-gp]', el).forEach(r => r.onchange = () => { const s = S.skills.find(x => x.id === r.dataset.gp), before = s.progress || 0; s.progress = +r.value; save();
    const ms = [25, 50, 75, 100].filter(m => before < m && s.progress >= m).pop();
    if (ms) celebrate({key:'grow-' + s.id + '-' + ms, e:ms === 100 ? '\u{1F393}' : s.e, title:ms === 100 ? 'You mastered ' + s.name + '!' : s.name + ': ' + ms + '% there!', msg:ms === 100 ? 'From curious to confident. Time to show it off.' : 'Keep going. Every session builds on the last.'});
    again(); });
  $$('[data-gnext]', el).forEach(i => i.onchange = () => { S.skills.find(x => x.id === i.dataset.gnext).next = i.value; save(); });
  $$('[data-gnotes]', el).forEach(i => i.oninput = () => { S.skills.find(x => x.id === i.dataset.gnotes).notes = i.value; save(); });
  $$('[data-gsess]', el).forEach(b => b.onclick = ev => { const s = S.skills.find(x => x.id === b.dataset.gsess); s.sessions = (s.sessions || 0) + 1; save(); hearts(ev.clientX, ev.clientY);
    if ([1, 5, 10, 25, 50, 100].includes(s.sessions)) celebrate({key:'sess-' + s.id + '-' + s.sessions, e:s.e, title:s.sessions === 1 ? 'First session of ' + s.name + '!' : s.sessions + ' sessions of ' + s.name + '!', msg:'Practice is how talent is made. Proud of you.'});
    else toast(s.e + ' Session logged!'); again(); });
  armDelete(el, 'data-gdel', id => { S.skills = S.skills.filter(x => x.id !== id); save(); again(); });
}; }

VIEWS['me.days'] = function(el){
  const d = ui.dayView, t = todayStr();
  const diary = S.diary[d] || {}, qa = S.qa[d] || {}, logs = S.daylog[d] || [], media = S.media[d] || {};
  const habits = S.habits.filter(h => habitDone(h.id, d));
  const spends = S.spend.filter(s => s.date === d), sad = S.sadaqa.filter(s => s.date === d);
  const n = planDayNum(parseD(d)), inPlan = n >= 1 && n <= 30;
  const meals = inPlan ? mealsFor(n).filter((m, i) => S.checks[n + '-' + i]) : [];
  const extras = S.extras[d] || [];
  const kcal = sum(meals, m => m.kcal) + sum(extras, x => x.kcal);
  const doneTasks = S.tasks.filter(x => x.doneOn === d), doneM = S.mashawer.filter(x => x.doneOn === d), doneX = S.exp.filter(x => x.doneOn === d);
  const answered = Object.keys(qa).filter(q => qa[q]);
  const sec = (title, body) => '<div style="display:flex;flex-direction:column;gap:6px"><h3>' + title + '</h3>' + body + '</div>';
  const parts = [];
  if (logs.length) parts.push(sec('What I did', '<div class="chips">' + logs.map(id => { const x = DAYLOG.find(y => y.id === id); return x ? '<span class="chip on" style="cursor:default">' + x.e + ' ' + x.name + '</span>' : ''; }).join('') + '</div>'));
  if (habits.length) parts.push(sec('Habits', '<div style="font-size:22px;letter-spacing:4px">' + habits.map(h => h.e).join('') + '</div>'));
  if (meals.length || extras.length) parts.push(sec('Ate', '<div class="list">' + meals.map(m => '<div class="item"><span>\u{1F37D}\u{FE0F}</span><span class="t">' + esc(m.name) + '</span><span class="amt muted" style="font-size:12px">' + m.kcal + '</span></div>').join('') + extras.map(x => '<div class="item"><span>' + x.e + '</span><span class="t">' + esc(x.name) + '</span><span class="amt muted" style="font-size:12px">' + x.kcal + '</span></div>').join('') + '</div>'));
  if (spends.length) parts.push(sec('Spent', '<div class="list">' + spends.map(s => '<div class="item"><span>' + catOf(s.cat).e + '</span><span class="t">' + esc(s.note || catOf(s.cat).name) + '</span><span class="amt">' + fmt(s.amount) + '</span></div>').join('') + '</div>'));
  if (sad.length) parts.push(sec('Sadaqa', '<p style="margin:0;font-weight:700">\u{1F49D} ' + money(sum(sad, s => s.amount)) + '</p>'));
  if (media.pages || media.episode) parts.push(sec('Read & listened', '<p style="margin:0;font-weight:700">' + (media.pages ? '\u{1F4D6} ' + media.pages + ' pages' + (media.book ? ' of ' + esc(media.book) : '') : '') + (media.pages && media.episode ? '<br>' : '') + (media.episode ? '\u{1F3A7} ' + esc(media.episode) : '') + '</p>'));
  if (doneTasks.length || doneM.length || doneX.length) parts.push(sec('Finished', '<div class="list">' + doneTasks.map(x => '<div class="item"><span>✅</span><span class="t">' + esc(x.title) + '</span><span></span></div>').join('') + doneM.map(x => '<div class="item"><span>\u{1F4CD}</span><span class="t">' + esc(x.name) + '</span><span></span></div>').join('') + doneX.map(x => '<div class="item"><span>✨</span><span class="t">' + esc(x.title) + '</span><span></span></div>').join('') + '</div>'));
  if (diary.summary) parts.push(sec('Summary', '<p style="margin:0;white-space:pre-wrap">' + esc(diary.summary) + '</p>'));
  if (diary.feelings) parts.push(sec('Feelings', '<p style="margin:0;white-space:pre-wrap">' + esc(diary.feelings) + '</p>'));
  if (answered.length) parts.push(sec('Reflections', answered.map(q => '<p style="margin:0"><b>' + esc(QUESTIONS[q]) + '</b><br>' + esc(qa[q]) + '</p>').join('')));

    '<div class="card tint"><div class="card-head"><div class="greet">My day</div><span style="font-size:34px">' + (diary.mood ? MOODS[diary.mood - 1].e : '') + '</span></div>' +
      '<div class="stats3"><div class="stat"><b>' + habits.length + '</b><span>habits</span></div><div class="stat"><b>' + fmt(kcal) + '</b><span>kcal eaten</span></div><div class="stat"><b>' + fmt(sum(spends, s => s.amount)) + '</b><span>EGP spent</span></div></div></div>' +
    '<div class="card">' + (parts.length ? parts.join('') : '<div class="empty">Nothing logged for this day yet.</div>') +

VIEWS['me.diary'] = function(el){
  const k = ui.diaryMonth, first = parseD(k + '-01'), last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7, t = todayStr();
  let cells = ''; ['M','T','W','T','F','S','S'].forEach(x => cells += '<div class="cday blank muted" style="font-weight:900">' + x + '</div>');
  for (let i = 0; i < lead; i++) cells += '<div class="cday blank"></div>';
  for (let d = 1; d <= last; d++){ const key = k + '-' + pad(d), m = S.diary[key] && S.diary[key].mood; cells += '<button class="cday' + (key === t ? ' today' : '') + '" data-day="' + key + '" aria-label="' + nice(key) + '">' + (m ? '<span class="e">' + MOODS[m - 1].e + '</span>' : '<span class="muted">' + d + '</span>') + '</button>'; }
  const entries = Object.keys(S.diary).filter(d => d.slice(0, 7) === k && (S.diary[d].summary || S.diary[d].feelings || S.diary[d].mood)).sort().reverse();
  const counts = [0,0,0,0,0]; entries.forEach(d => { const m = S.diary[d].mood; if (m) counts[m - 1]++; });
  el.innerHTML = monthNav('diaryMonth') + '<div class="card"><h2>Mood calendar</h2><div class="cal">' + cells + '</div><div class="chips" style="justify-content:center">' + MOODS.map((m, i) => '<span class="chip" style="cursor:default">' + m.e + ' <span class="cnt">' + counts[i] + '</span></span>').join('') + '</div><p class="small muted" style="margin:0;text-align:center">Tap a day to open its full record.</p></div>' +
    (entries.length ? entries.map(d => { const e = S.diary[d]; return '<div class="card"><div class="card-head"><h3>' + nice(d) + '</h3><span style="font-size:22px">' + (e.mood ? MOODS[e.mood - 1].e : '') + '</span></div>' + (e.summary ? '<p style="margin:0;white-space:pre-wrap">' + esc(e.summary) + '</p>' : '') + (e.feelings ? '<p style="margin:0;white-space:pre-wrap;color:var(--muted)">' + esc(e.feelings) + '</p>' : '') + '</div>'; }).join('') : '<div class="card"><div class="empty">No diary entries in ' + monthLabel(k) + '. Write today’s on the Today tab.</div></div>');
  bindMonthNav(el, 'diaryMonth', () => VIEWS['me.diary'](el));
  $$('[data-day]', el).forEach(b => b.onclick = () => { if (b.dataset.day > t) return; ui.dayView = b.dataset.day; go('me', 'days'); });
};
VIEWS['me.habits'] = function(el){

  const pages = sum(dom, d => S.media[d] && S.media[d].pages), eps = dom.filter(d => S.media[d] && S.media[d].episode).length;
  el.innerHTML = '<div class="money3"><div class="mbox"><b style="color:var(--warn)">\u{1F525}' + streakOf('nosugar') + '</b><span>no-sugar streak</span></div><div class="mbox"><b>' + fmt(pages) + '</b><span>pages this month</span></div><div class="mbox"><b>' + eps + '</b><span>episodes this month</span></div></div>' +
    '<div class="card"><div class="card-head"><h2>This month</h2><span class="small muted">' + days + ' days so far</span></div>' +

    '<div class="card"><h2>Customize my habits</h2><p class="small muted" style="margin:0;font-weight:700">Set a reward for each one; it pops up when you hit a streak milestone (3, 7, 14, 21, 30 days and more).</p>' +
      '<div class="list">' + S.habits.map(h => '<div class="grow"><div class="gh"><input class="in" data-he="' + h.id + '" value="' + esc(h.e) + '" maxlength="4" style="text-align:center;padding:8px;font-size:20px" aria-label="Emoji"><input class="in" data-hn="' + h.id + '" value="' + esc(h.name) + '" aria-label="Habit name">' + delBtn('data-hdel', h.id) + '</div>' +

        (h.freq !== 'daily' ? '<label class="field" style="flex:0 0 90px"><span>' + (h.freq === 'monthly' ? 'Per month' : 'Per week') + '</span><input class="in num" type="number" min="1" max="' + (h.freq === 'monthly' ? 31 : 7) + '" data-ht="' + h.id + '" value="' + h.target + '"></label>' : '') + '</div>' +
        '<label class="field"><span>My reward</span><input class="in" data-hr="' + h.id + '" value="' + esc(h.reward || '') + '" placeholder="A face mask, a new nail colour…"></label></div>').join('') + '</div>' +
      '<h3 style="margin-top:6px">Add a habit</h3>' + emoPicker(ui.hEmo || '\u{1F338}', 'data-hpick') + '<div class="row"><label class="field"><span>Name</span><input class="in" id="hN" placeholder="Skincare, stretch, pray on time…"></label><button class="btn" id="hAdd">Add</button></div></div>';
  const again = () => VIEWS['me.habits'](el), find = id => S.habits.find(h => h.id === id);

  $$('[data-hn]', el).forEach(i => i.onchange = () => { if (i.value.trim()) find(i.dataset.hn).name = i.value.trim(); save(); });
  $$('[data-hf]', el).forEach(i => i.onchange = () => { const h = find(i.dataset.hf); h.freq = i.value; if (!(h.target > 0)) h.target = 1; save(); again(); });
  $$('[data-ht]', el).forEach(i => i.onchange = () => { { const h = find(i.dataset.ht); h.target = Math.min(h.freq === 'monthly' ? 31 : 7, Math.max(1, +i.value || 1)); }; save(); });

};

/* ---------- small helpers ---------- */
const isNight = () => { const h = new Date().getHours(); return h >= 23 || h < 9; };

const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
function paydayOn(job, y, m){ const last = new Date(y, m + 1, 0).getDate(); return ymd(new Date(y, m, Math.min(job.day, last))); }
function nextPaydays(job, n){ const out = [], now = new Date(); let y = now.getFullYear(), m = now.getMonth(); while (out.length < n){ const d = paydayOn(job, y, m); if (d >= todayStr()) out.push(d); m++; if (m > 11){ m = 0; y++; } } return out; }
function paydayWindow(){
  const t = todayStr(), now = new Date();
  for (const j of S.jobs){ for (let back = 0; back < 2; back++){ const d = paydayOn(j, now.getFullYear(), now.getMonth() - back + (now.getMonth() - back < 0 ? 12 : 0)); const diff = daysBetween(d, t); if (diff >= 0 && diff <= 2) return j; } }
  const inc = S.income.find(i => { const diff = daysBetween(i.date, t); return diff >= 0 && diff <= 2; });
  return inc ? (S.jobs.find(j => j.id === inc.job) || {name:'Salary'}) : null;
}
const incomeIn = k => S.income.filter(i => inMonth(i, k));
const valuLeft = () => Math.max(0, S.valu.total - sum(S.valu.paid, p => p.amount));
const jarByName = n => S.jars.find(j => j.name.toLowerCase() === n.toLowerCase());
const jarTotal = j => sum(j.deposits, d => d.amount);
function deposit(j, a, why){
  const before = jarTotal(j); j.deposits.push({id:uid(), date:todayStr(), amount:a, why:why || ''}); save();

  return !!ms;
}

/* ---------- PLANS: wedding ---------- */
function autoPlanBeauty(){
  const W = S.profile.wedding; if (!W) return 0;
  const t = todayStr(), cap = (d, max) => (d > max ? max : d), before = n => addDays(W, -n);
  const plan = {hl1:addDays(t, 3), hl2:addDays(t, 31), hl3:addDays(t, 59), pc1:addDays(t, 5), pc2:addDays(t, 33), sv:addDays(t, 10), sb:before(21), fi:before(25), bo:before(25), ht:before(14), hd:before(5)};
  const max = {hl1:before(10), hl2:before(10), hl3:before(10), pc1:before(14), pc2:before(14), sv:before(21)};
  let n = 0;
  S.wedding.beauty.forEach(b => { if (!b.planned && !b.done && plan[b.id]){ let d = plan[b.id]; if (max[b.id]) d = cap(d, max[b.id]); if (d < t) d = t; b.planned = d; n++; } });
  return n;
}

/* ---------- habits by period ---------- */
function periodCount(h, day){
  if (h.freq === 'weekly') return weekCount(h.id, day);
  if (h.freq === 'monthly'){ const k = day.slice(0, 7), last = new Date(+k.slice(0, 4), +k.slice(5, 7), 0).getDate(); let c = 0; for (let d = 1; d <= last; d++) if (habitDone(h.id, k + '-' + pad(d))) c++; return c; }
  return habitDone(h.id, day) ? 1 : 0;
}

/* ---------- 🚨 emergency flags: tasks, mashawer, wedding prep, shopping, beauty ---------- */
function flagBtn(key, on){ return '<span class="ibtns">' + bellBtn(key) + flagOnly(key, on) + '</span>'; }
function flagOnly(key, on){ return '<button class="flag' + (on ? ' on' : '') + '" data-flag="' + key + '" aria-pressed="' + !!on + '" aria-label="' + (on ? 'Remove emergency flag' : 'Flag as emergency') + '">\u{1F6A8}</button>'; }
function findFlag(key){
  const [k, id] = key.split(':');
  if (k === 't') return S.tasks.find(x => x.id === id);
  if (k === 'm') return S.mashawer.find(x => x.id === id);
  if (k === 'c') return S.wedding.checklist.find(x => x.id === id);
  if (k === 'w') return (S.wedding.shopping || []).find(x => x.id === id);
  if (k === 's') for (const m in S.selfcare){ const x = S.selfcare[m].find(y => y.id === id); if (x) return x; }
}
function toggleFlag(key){
  const x = findFlag(key); if (!x) return;
  let on; if (key[0] === 't'){ x.prio = x.prio === 'urgent' ? 'normal' : 'urgent'; on = x.prio === 'urgent'; } else on = x.flag = !x.flag;
  save(); toast(on ? '\u{1F6A8} Emergency. It’s at the top of Today now.' : 'Flag removed');
}
function bindFlags(el, again){ $$('[data-flag]', el).forEach(b => b.onclick = ev => { ev.stopPropagation(); toggleFlag(b.dataset.flag); again(); }); bindBells(el, again); }
function emergencies(){
  const out = [];
  urgentTasks().forEach(x => out.push({key:'t:' + x.id, e:x.kind === 'work' ? '\u{1F4BC}' : '✅', title:x.title, date:x.due, time:x.time, kind:x.prio === 'urgent' ? (x.job ? jobName(x.job) : 'Task') : '⚠\u{FE0F} Due soon', flag:x.prio === 'urgent', wed:/wedding|زفاف|فرح/i.test(x.title)}));

  S.wedding.checklist.filter(c => c.flag && !c.done).forEach(c => out.push({key:'c:' + c.id, e:c.e || '\u{1F48D}', title:c.title, date:c.date || '', kind:'Wedding prep', flag:true, wed:true}));
  (S.wedding.shopping || []).filter(x => x.flag && !x.done).forEach(x => out.push({key:'w:' + x.id, e:x.e, title:x.title, date:'', kind:'To buy', flag:true, wed:true}));
  Object.values(S.selfcare).forEach(l => l.filter(x => x.flag && !x.done).forEach(x => out.push({key:'s:' + x.id, e:x.e, title:x.name, date:x.planned, kind:'Beauty', flag:true, wed:!!x.wedding})));
