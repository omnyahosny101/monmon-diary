name: Make book audio (Egyptian voice)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Turn the book into Egyptian-Arabic audio
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          python3 scripts/book_audio.py poor-econ books/poor-economics.js
          python3 scripts/book_audio.py mars-venus books/mars-venus.js
      - name: Save the audio to the site
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add books/audio
          git diff --cached --quiet || git commit -m "Book audio in the Egyptian voice"
          git pull --rebase && git push
