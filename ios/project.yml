name: MonmonsLife
options:
  bundleIdPrefix: com.monmon2026
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MonmonsLife:
    type: application
    platform: iOS
    sources:
      - path: MonmonsLife
      - path: Shared
      - path: Web
        type: folder
    info:
      path: MonmonsLife/Info.plist
      properties:
        CFBundleDisplayName: "Monmon's Life"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        NSCameraUsageDescription: To take photos of your food, outings and diary.
        NSPhotoLibraryUsageDescription: To add photos of your food, outings and diary.
        NSMicrophoneUsageDescription: To hear you say French words and play your voice back.
        NSSpeechRecognitionUsageDescription: To check how you pronounce French words.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monmon2026.monmonslife
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MonmonWidget
    scheme: {}
  MonmonWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MonmonWidget
      - path: Shared
    info:
      path: MonmonWidget/Info.plist
      properties:
        CFBundleDisplayName: "Monmon's Life"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.monmon2026.monmonslife.widget
