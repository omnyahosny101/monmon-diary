<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monmon's Life</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monmon's Life">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fff2f6">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: one phone column; six colour-coded sections (Today rose, Food coral, Money mint, Plans lilac, Grow sky, Me berry).
   Each section: segmented sub-menu, then stacked soft cards with a 1.5px tinted border. Tab bar pinned to the bottom. */
:root{
  --bg:#fff4f8; --bg2:#ffe6ef; --surface:#ffffff; --ink:#4b1f33; --muted:#9a6a7e; --line:#f5d6e1;
  --rose:#ff5c8f; --coral:#ff7f5c; --mint:#22b07d; --lilac:#8f6bff; --sky:#3b9cf5; --berry:#d9479a; --gold:#e8a317; --warn:#ff6a3d; --danger:#ef3b5d;
  --rose-soft:#ffd6e3; --coral-soft:#ffe1d6; --mint-soft:#d6f5e8; --lilac-soft:#e8e0ff; --sky-soft:#dcedff; --berry-soft:#fbdcee; --gold-soft:#fff0c9;
  --acc:var(--rose); --acc-soft:var(--rose-soft);
  --shadow:0 12px 28px -18px rgba(150,40,90,.45);
  --r:22px;
  --f-display:"Shrikhand","Georgia",serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Fredoka","Nunito",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#211019; --bg2:#311827; --surface:#2f1a26; --ink:#ffe8f0; --muted:#d2a5b9; --line:#4a2a3b;
  --rose:#ff7aa5; --coral:#ff9a7c; --mint:#4fd8a4; --lilac:#ae94ff; --sky:#6db7ff; --berry:#f06db4; --gold:#ffc542; --warn:#ff8f66; --danger:#ff6380;
  --rose-soft:#55233d; --coral-soft:#55302a; --mint-soft:#1f4637; --lilac-soft:#3a2f5c; --sky-soft:#22394f; --berry-soft:#522540; --gold-soft:#4d3d16;
  --shadow:0 12px 28px -18px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#211019; --bg2:#311827; --surface:#2f1a26; --ink:#ffe8f0; --muted:#d2a5b9; --line:#4a2a3b;
  --rose:#ff7aa5; --coral:#ff9a7c; --mint:#4fd8a4; --lilac:#ae94ff; --sky:#6db7ff; --berry:#f06db4; --gold:#ffc542; --warn:#ff8f66; --danger:#ff6380;
  --rose-soft:#55233d; --coral-soft:#55302a; --mint-soft:#1f4637; --lilac-soft:#3a2f5c; --sky-soft:#22394f; --berry-soft:#522540; --gold-soft:#4d3d16;
  --shadow:0 12px 28px -18px rgba(0,0,0,.7); color-scheme:dark}
body[data-tab="today"]{--acc:var(--rose);--acc-soft:var(--rose-soft)}
body[data-tab="food"]{--acc:var(--coral);--acc-soft:var(--coral-soft)}
body[data-tab="money"]{--acc:var(--mint);--acc-soft:var(--mint-soft)}
body[data-tab="plans"]{--acc:var(--lilac);--acc-soft:var(--lilac-soft)}
body[data-tab="grow"]{--acc:var(--sky);--acc-soft:var(--sky-soft)}
body[data-tab="me"]{--acc:var(--berry);--acc-soft:var(--berry-soft)}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden;transition:background .4s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:12px}

.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(46px);opacity:.55;animation:drift 18s ease-in-out infinite alternate;transition:background .6s}
.blob.a{width:280px;height:280px;background:var(--acc-soft);top:-80px;right:-90px}
.blob.b{width:220px;height:220px;background:var(--gold-soft);bottom:140px;left:-100px;animation-delay:-6s}
.blob.c{width:170px;height:170px;background:var(--lilac-soft);top:42%;right:-70px;animation-delay:-11s}
@keyframes drift{to{transform:translate(30px,40px) scale(1.12)}}

.app{position:relative;z-index:1;max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 130px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{margin:0;font-size:12px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-family:var(--f-display);font-weight:400;font-size:clamp(25px,7.6vw,34px);line-height:1.05;color:var(--rose)}
h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--ink);text-wrap:balance;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc);flex:0 0 auto}
h2.plain::before{display:none}
h3{margin:0;font-size:11.5px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--acc)}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
.iconbtn svg{width:20px;height:20px}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);border:1.5px solid color-mix(in srgb,var(--acc) 16%,var(--line));box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.tint{background:linear-gradient(145deg,var(--surface) 35%,var(--acc-soft))}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pop{animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{opacity:.0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

/* segmented control */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:0 -2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:13px;font-weight:800;color:var(--muted);transition:all .2s}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 8px 16px -10px var(--acc)}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 120px}
.card>.field,.sc .field,.grow .field,.sheet-in>.field{flex:0 0 auto}
.field>span{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.in{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;min-width:0;transition:border-color .2s}
.in:focus{border-color:var(--acc)}
textarea.in{resize:vertical;min-height:64px;font-weight:600;line-height:1.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.btn{background:var(--acc);color:#fff;font-weight:900;padding:11px 16px;border-radius:14px;flex:0 0 auto;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.soft{background:var(--acc-soft);color:var(--acc)}
.btn.full{width:100%}
.linkbtn{font-size:12px;font-weight:900;color:var(--acc);padding:6px 11px;border-radius:999px;background:var(--acc-soft);flex:0 0 auto}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);min-width:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .t{font-weight:700;min-width:0;overflow-wrap:anywhere}
.item .s{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.tick{width:26px;height:26px;border-radius:9px;border:2px solid var(--acc-soft);display:grid;place-items:center;transition:all .25s cubic-bezier(.3,1.6,.5,1);flex:0 0 auto}
.tick svg{width:14px;height:14px;stroke:#fff;stroke-width:4;fill:none;opacity:0}
.tick.on{background:var(--mint);border-color:var(--mint);transform:rotate(-6deg)}
.tick.on svg{opacity:1}
.del{color:var(--muted);font-size:20px;line-height:1;min-width:30px;height:30px;border-radius:15px;display:grid;place-items:center;padding:0 6px}
.del.armed{font-size:12px;color:var(--danger);font-weight:900;background:color-mix(in srgb,var(--danger) 12%,transparent)}
.empty{font-size:13px;color:var(--muted);text-align:center;padding:10px 0}
.amt{font-family:var(--f-num);font-weight:600;white-space:nowrap}
.pill{display:inline-block;font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:999px;background:var(--acc-soft);color:var(--acc);margin-right:4px;vertical-align:1px}
.pill.urgent{background:var(--danger);color:#fff}
.pill.high{background:var(--gold-soft);color:#a86d00}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);font-size:13px;font-weight:800;transition:all .2s}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;transform:translateY(-1px)}
.chip .cnt{font-family:var(--f-num);font-size:11px;opacity:.85}
.hgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.habit{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:16px;background:var(--bg);border:1.5px solid var(--line);text-align:left;font-weight:800;font-size:13.5px;min-width:0;transition:all .25s cubic-bezier(.3,1.5,.5,1)}
.habit .e{font-size:19px}
.habit .hs{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.habit.on{background:var(--mint-soft);border-color:var(--mint);transform:scale(1.02)}
.habit .hl{min-width:0}
.habit .fire{margin-left:auto;font-family:var(--f-num);font-size:12px;color:var(--warn);white-space:nowrap}
.hgrid.hg3{grid-template-columns:repeat(3,1fr);gap:7px}
.habit.mini{position:relative;flex-direction:column;justify-content:center;text-align:center;gap:3px;padding:12px 6px 10px;font-size:12px;line-height:1.2}
.habit.mini .e{font-size:22px}
.habit.mini .hl{overflow-wrap:anywhere}
.habit.mini .hs{font-size:10.5px}
.habit.mini .fire{position:absolute;top:4px;right:6px;margin:0;font-size:10.5px}
.habit.met{border-color:var(--mint);border-style:dashed}
.ov{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.ovt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:16px;background:var(--bg);border:1.5px solid var(--line);text-align:center;min-width:0;color:var(--ink)}
.ovt .oe{font-size:20px}
.ovt b{font-family:var(--f-num);font-size:17px;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovt span:last-child{font-size:10.5px;font-weight:800;color:var(--muted);line-height:1.2;overflow-wrap:anywhere}
.ovt:active{transform:scale(.96)}
.wedtrack{background:linear-gradient(150deg,var(--rose-soft),var(--gold-soft));border-color:transparent;gap:10px}
.wedtrack .wtop{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.wedtrack .wn{font-size:48px;font-weight:600;color:var(--rose);line-height:1}
.wedpill{background:var(--rose-soft);color:var(--rose)}
.tagw{border:1.5px dashed var(--line);background:var(--bg);border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:800;color:var(--muted);white-space:nowrap}
.tagw.on{border-style:solid;border-color:var(--rose);background:var(--rose-soft);color:var(--rose)}

/* hero + stats */
.greet{font-family:var(--f-display);font-size:22px;line-height:1.1}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:16px;padding:10px;text-align:center;border:1.5px solid var(--line)}
.stat b{display:block;font-family:var(--f-num);font-size:20px;font-weight:600;color:var(--acc)}
.stat span{font-size:11px;font-weight:800;color:var(--muted)}
.money3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mbox{background:var(--surface);border-radius:20px;padding:12px;border:1.5px solid color-mix(in srgb,var(--acc) 16%,var(--line));box-shadow:var(--shadow);min-width:0}
.mbox b{display:block;font-family:var(--f-num);font-size:18px;font-weight:600;overflow-wrap:anywhere;color:var(--ink)}
.mbox span{font-size:11px;font-weight:800;color:var(--muted)}

/* urgent banner */
.urgent{background:linear-gradient(135deg,var(--danger),var(--warn));color:#fff;border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 14px 28px -14px var(--danger);animation:pulse 2s ease-in-out infinite}
.urgent h2{color:#fff}.urgent h2::before{background:#fff}
.urgent .ur{display:flex;align-items:center;gap:10px;font-weight:800;text-align:left}
.urgent .ur .tick{border-color:rgba(255,255,255,.7)}
@keyframes pulse{0%,100%{box-shadow:0 14px 28px -14px var(--danger)}50%{box-shadow:0 14px 34px -8px var(--danger)}}

/* mood */
.moods{display:flex;justify-content:space-between;gap:6px}
.mood{flex:1;font-size:26px;padding:8px 0;border-radius:16px;background:var(--bg);border:1.5px solid var(--line);transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.mood.on{background:var(--acc-soft);border-color:var(--acc);transform:scale(1.08)}
.mood span{display:block;font-size:10px;font-weight:900;color:var(--muted);margin-top:2px}
.qlab{font-weight:800;font-size:14px;color:var(--ink);text-transform:none!important;letter-spacing:0!important}

/* meals */
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 8px;margin:0 -2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dpill{flex:0 0 52px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);font-family:var(--f-num);transition:transform .25s}
.dpill .dn{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dpill .dd{font-size:19px;font-weight:600}
.dpill .dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dpill.done .dot{background:var(--mint)}
.dpill.part .dot{background:var(--gold)}
.dpill.today{border-style:dashed;border-color:var(--acc)}
.dpill.sel{background:var(--acc);border-color:var(--acc);color:#fff;transform:translateY(-3px)}
.dpill.sel .dn{color:#fff}
.ringwrap{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{position:relative;width:124px;height:124px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--acc-soft);stroke-width:12}
.ring .fill{fill:none;stroke:url(#grad);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.3,1.4,.5,1)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-family:var(--f-num);font-size:26px;font-weight:600;line-height:1}
.ring .sm{font-size:11px;color:var(--muted);font-weight:800}
.bar{height:10px;border-radius:999px;background:var(--acc-soft);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--lilac),var(--acc));transition:width .9s cubic-bezier(.3,1.3,.5,1)}
.bar.over>i{background:linear-gradient(90deg,var(--gold),var(--danger))}
.bar.good>i{background:linear-gradient(90deg,var(--sky),var(--mint))}
.statrow{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:800;text-align:left}
.sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .25s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.sw[aria-checked="true"]{background:var(--acc)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.cups{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.cup{aspect-ratio:3/4;max-width:100%;border-radius:10px 10px 14px 14px;border:2px solid var(--sky-soft);position:relative;overflow:hidden}
.cup::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#9fd8ff,#79b8ff);transition:height .45s cubic-bezier(.3,1.4,.5,1)}
.cup.on::after{height:78%}
.cup.on{border-color:#9fd0ff}
.meal{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border-radius:var(--r);padding:13px;border:1.5px solid color-mix(in srgb,var(--acc) 16%,var(--line));box-shadow:var(--shadow);transition:background .3s}
.meal .ic{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.meal .ic svg{width:24px;height:24px}
.meal .txt{min-width:0}
.meal .lbl{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.meal .nm{font-weight:800;font-size:14.5px;line-height:1.3;margin-top:2px}
.meal .mac{font-family:var(--f-num);font-size:12px;color:var(--muted);margin-top:3px}
.meal .swap{font-size:11px;font-weight:900;color:var(--acc);background:var(--acc-soft);padding:3px 9px;border-radius:999px;letter-spacing:0;text-transform:none}
.check{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--acc-soft);display:grid;place-items:center;transition:all .3s cubic-bezier(.3,1.6,.5,1)}
.check svg{width:16px;height:16px;stroke:#fff;stroke-width:3.5;fill:none;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s .1s}
.meal.eaten{background:var(--mint-soft)}
.meal.eaten .check{background:var(--mint);border-color:var(--mint)}
.meal.eaten .check svg{stroke-dashoffset:0}
.meal.eaten .nm{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--mint) 70%,transparent);text-decoration-thickness:2px}
.dish{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);text-align:left;width:100%}
.dish:last-child{border-bottom:0}
.dish .t{font-weight:700;overflow-wrap:anywhere}
.dish .m{font-family:var(--f-num);font-size:12px;color:var(--muted);white-space:nowrap;text-align:right;display:flex;align-items:center;gap:4px;justify-content:flex-end}
.forbid{background:repeating-linear-gradient(-45deg,var(--surface),var(--surface) 12px,color-mix(in srgb,var(--danger) 6%,var(--surface)) 12px,color-mix(in srgb,var(--danger) 6%,var(--surface)) 24px);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.forbid h2::before{background:var(--danger)}
.fitem{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.fitem:last-child{border-bottom:0}
.fitem .fe{font-size:28px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

  {src:'The Psychology of Money · Morgan Housel', idea:'The highest dividend money pays is the ability to control your own time.', advice:'Think of savings as buying freedom: the freedom to choose your job, your hours and when to say no.'},
  {src:'Men Are from Mars, Women Are from Venus · John Gray', idea:'Gray describes many men handling stress by withdrawing to “their cave” to think alone, and many women handling it by talking it through. Neither is wrong; they’re different.', advice:'If your fiancé goes quiet, give him space before asking what’s wrong. When you need to talk, tell him: “I don’t need a solution, I just need you to listen.”'},
  {src:'Men Are from Mars, Women Are from Venus · John Gray', idea:'Gray argues that in a partner’s eyes, many small loving gestures often count as much as one big one.', advice:'Do one small thing for someone you love today: a voice note, their favourite snack, a real compliment.'},
  {src:'Surrounded by Idiots · Thomas Erikson', idea:'Erikson sorts people into four colours: Red (direct, decisive), Yellow (enthusiastic, social), Green (calm, loyal) and Blue (careful, analytical). Most conflict comes from speaking only your own colour.', advice:'Before a hard work conversation, guess their colour. Give Reds the bottom line, Yellows energy, Greens time and reassurance, Blues data and details.'},
  {src:'Surrounded by Idiots · Thomas Erikson', idea:'The colour model is a lens, not a science: psychologists consider it a simplification. Its real value is reminding you that “difficult” people often just communicate differently.', advice:'Next time someone annoys you, ask “what do they need that I’m not giving?” before deciding they’re the problem.'},
  {src:'The 5 Love Languages · Gary Chapman', idea:'People give and receive love in five main ways: words of affirmation, quality time, gifts, acts of service and physical touch. We tend to give love in our own language, not theirs.', advice:'Ask your fiancé which one matters most to him, and tell him yours. It’s one of the best conversations before marriage.'},
  {src:'Research by John Gottman', idea:'In Gottman’s studies, stable couples had about five positive interactions for every negative one during conflict.', advice:'If you have to raise something hard today, surround it with warmth: appreciation first, the issue second, affection after.'},
  {src:'Research by John Gottman', idea:'Gottman found contempt (eye-rolling, mockery, superiority) to be the strongest predictor of divorce among his “Four Horsemen”: criticism, contempt, defensiveness and stonewalling.', advice:'Complain about the behaviour, not the person: “I felt alone when you were on your phone” instead of “You never care.”'},
  {src:'Research by John Gottman', idea:'Couples still together six years later had “turned toward” each other’s small bids for attention about 86% of the time; couples who divorced, about 33%.', advice:'When someone you love shares something small, a meme, a thought, a sigh, turn toward it. Small moments build the marriage.'},
  {src:'Mindset · Carol Dweck', idea:'People with a growth mindset believe ability is built through effort and learning; they see failure as information, not identity.', advice:'Add “yet” to one sentence today: “I’m not good at email campaigns, yet.”'},
  {src:'Grit · Angela Duckworth', idea:'Duckworth’s research found passion plus long-term perseverance often predicts achievement better than talent alone.', advice:'Choose one long-term goal and show up for it today, especially if you’re bored. Boredom is where most people quit.'},
  {src:'Thinking, Fast and Slow · Daniel Kahneman', idea:'We have a fast, emotional System 1 and a slow, deliberate System 2. Most bad decisions are fast ones that deserved slow thinking.', advice:'For any decision over a few thousand pounds or a big life choice, sleep on it once before saying yes.'},
  {src:'Thinking, Fast and Slow · Daniel Kahneman', idea:'Loss aversion: losing something feels roughly twice as painful as gaining the same thing feels good.', advice:'When an investment dips, remember the pain is louder than the facts. Don’t make money decisions on a scary day.'},
  {src:'Man’s Search for Meaning · Viktor Frankl', idea:'“Everything can be taken from a man but one thing: the last of the human freedoms, to choose one’s attitude in any given set of circumstances.”', advice:'You can’t control every part of today, but you can choose how you meet it. Choose on purpose.'},
  {src:'Daring Greatly · Brené Brown', idea:'Brown’s research found vulnerability is the birthplace of connection, courage and creativity, not weakness.', advice:'Say the honest thing today, kindly: ask for help, admit you’re tired, tell someone you miss them.'},
  {src:'The 7 Habits of Highly Effective People · Stephen Covey', idea:'Focus on your circle of influence (what you can act on), not your circle of concern (everything you worry about).', advice:'Write your worry, then circle the one part you can act on today. Do that part; release the rest.'},
  {src:'The 7 Habits of Highly Effective People · Stephen Covey', idea:'Begin with the end in mind: imagine who you want to be at the end, then plan backwards.', advice:'Picture yourself one year after your wedding. What habits does that woman have? Start one of them this week.'},
  {src:'How to Win Friends and Influence People · Dale Carnegie', idea:'Become genuinely interested in other people. A person’s own name is, to them, the sweetest sound.', advice:'Use people’s names today and ask one follow-up question about something they care about.'},
  {src:'Never Split the Difference · Chris Voss', idea:'The former FBI negotiator recommends labelling emotions (“It seems like…”) and asking “how” and “what” questions instead of saying no.', advice:'When an offer is too low, try: “How am I supposed to do that?” Then stay quiet and let them answer.'},
  {src:'Women Don’t Ask · Linda Babcock and Sara Laschever', idea:'In Babcock’s study of graduates, far more men than women negotiated their first salary (57% vs 7%), a gap that compounds over a career.', advice:'Never accept a first offer without asking for more. The worst answer is usually just “no”.'},
  {src:'Deep Work · Cal Newport', idea:'Focused work without distraction produces far more value than scattered hours of shallow work.', advice:'Block 60 minutes today with your phone in another room for your most important task.'},
  {src:'Essentialism · Greg McKeown', idea:'If it isn’t a clear yes, then it’s a clear no. Saying no to the good makes room for the great.', advice:'Say no to one thing this week that you’d only half-want to do.'},
  {src:'The Four Agreements · Don Miguel Ruiz', idea:'Don’t take anything personally: what others say and do is mostly about their own world.', advice:'If someone is rude today, let it be their story, not yours.'},
  {src:'Letters from a Stoic · Seneca', idea:'Seneca wrote that we suffer more often in imagination than in reality.', advice:'When you catch yourself picturing the worst, ask: is this happening, or am I rehearsing it?'},
  {src:'Enchiridion · Epictetus', idea:'Some things are within our control (our choices, effort, attitude) and some are not (others’ opinions, outcomes). Peace comes from knowing the difference.', advice:'Sort today’s stress into two lists: mine and not mine. Spend energy only on the first.'},
  {src:'Rich Dad Poor Dad · Robert Kiyosaki', idea:'Kiyosaki defines an asset as something that puts money in your pocket and a liability as something that takes money out.', advice:'Before a big purchase, like a car, list its monthly costs: fuel, insurance, maintenance. Budget for the real price.'},
  {src:'The Richest Man in Babylon · George Clason', idea:'Pay yourself first: keep at least a tenth of everything you earn before paying anyone else.', advice:'On payday, move your saving and investing amount first, then live on the rest.'},
  {src:'Harvard Study of Adult Development', idea:'This study has followed people for over 80 years. Its clearest finding: good relationships keep us happier and healthier than money or fame.', advice:'Invest in one relationship today: call your mom, plan a date, reply to a friend you’ve been meaning to.'},
  {src:'Research on gratitude · Emmons and McCullough', idea:'People who regularly wrote down things they were grateful for reported more optimism and better wellbeing than those who didn’t.', advice:'Answer one of today’s diary questions with three specific things you’re grateful for.'},
  {src:'Research on happiness · Van Boven and Gilovich', idea:'Spending on experiences tends to bring more lasting happiness than spending on things, partly because we adapt to things quickly.', advice:'Next time you want to treat yourself, consider an experience from your list instead of an item.'},
  {src:'The fresh start effect · Dai, Milkman and Riis', idea:'People are more likely to start new goals at “temporal landmarks”: a Monday, a new month, a birthday.', advice:'Use the next landmark on purpose. Decide now what you’ll start on the 1st of the month.'},
  {src:'Implementation intentions · Peter Gollwitzer', idea:'Plans in the form “When X happens, I will do Y” make people far more likely to follow through.', advice:'Write one: “When I finish lunch, I will read 5 pages.”'},
  {src:'The spotlight effect · Thomas Gilovich', idea:'In experiments, people greatly overestimated how much others noticed their appearance or mistakes.', advice:'Wear the outfit, ask the question, post the idea. People are thinking about themselves, not you.'},
  {src:'Self-Compassion · Kristin Neff', idea:'Research shows that treating yourself kindly after a mistake increases motivation to improve, rather than making you lazy.', advice:'Talk to yourself today the way you’d talk to your best friend after a bad day.'},
  {src:'Parkinson’s law', idea:'Work expands to fill the time available for its completion.', advice:'Give your next task a shorter deadline than feels comfortable, and watch it shrink to fit.'},
  {src:'The Pareto principle', idea:'Roughly 80% of results often come from 20% of efforts.', advice:'Which 20% of your work brings most of your results? Do that first today.'},
  {src:'The paradox of choice · Iyengar and Lepper', idea:'In a famous study, shoppers offered 6 jams were about 10 times more likely to buy than those offered 24.', advice:'Reduce your options to decide faster: two outfits, three dinner choices, one course at a time.'},
];

function merge(base, src){
  for (const k in src){
    if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) base[k] = merge(base[k], src[k]);
    else base[k] = src[k];
  }
  return base;
}

function hearts(x, y){

  const g = ['♥','✦','♥','❀'], c = ['var(--rose)','var(--gold)','var(--lilac)','var(--mint)'];

    const h = document.createElement('span'); h.className = 'heart'; h.textContent = g[i % 4];

    h.style.left = x + 'px'; h.style.top = y + 'px'; h.style.color = c[i % 4];
    h.style.setProperty('--dx', Math.cos(a) * r + 'px'); h.style.setProperty('--dy', Math.sin(a) * r - 30 + 'px'); h.style.setProperty('--r', (Math.random() * 120 - 60) + 'deg');
    document.body.appendChild(h); setTimeout(() => h.remove(), 950);

}

/* ============ celebrations ============ */
function confetti(canvas){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const dpr = devicePixelRatio || 1, ctx = canvas.getContext('2d'), W = canvas.width = innerWidth * dpr, H = canvas.height = innerHeight * dpr;
  const cols = ['#ff5c8f','#ffb48f','#b9a3ff','#3fbf8f','#ffd166','#7cc4ff'];
  const ps = Array.from({length:140}, () => ({x:W / 2, y:H * .45, vx:(Math.random() - .5) * 26 * dpr, vy:(-Math.random() * 22 - 6) * dpr, s:(5 + Math.random() * 7) * dpr, c:cols[Math.floor(Math.random() * cols.length)], r:Math.random() * 6, vr:(Math.random() - .5) * .3, h:Math.random() < .3}));
  let t = 0;
  (function frame(){
    if (!canvas.isConnected) return;
    ctx.clearRect(0, 0, W, H); t++;
    ps.forEach(p => { p.vy += .55 * dpr; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.h){ ctx.font = (p.s * 2) + 'px serif'; ctx.fillText('♥', 0, 0); } else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore(); });
    if (t < 220) requestAnimationFrame(frame);
  })();
}
function celebrate(o){
  if (o.key){ if (S.celebrated[o.key]) return; S.celebrated[o.key] = Date.now(); save(); }
  if (S.settings.celebrate === false){ toast(o.title); return; }
  $$('.overlay.celebration').forEach(x => x.remove());
  const ov = document.createElement('div'); ov.className = 'overlay celebration'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
  ov.innerHTML = '<canvas class="confetti"></canvas><div class="ocard"><div class="big">' + o.e + '</div><h2>' + esc(o.title) + '</h2><p>' + esc(o.msg) + '</p>' + (o.reward ? '<div class="adv"><b>Your reward</b>' + esc(o.reward) + '</div>' : '') + '<button class="btn full" style="background:var(--rose)">Yay, thank you ♡</button></div>';
  document.body.appendChild(ov);
  confetti($('canvas', ov));
  const close = () => ov.remove();
  $('button', ov).onclick = close; ov.onclick = e => { if (e.target === ov) close(); };
}

function buildReminders(){
  const R = S.settings.rem, now = new Date(), once = [], repeat = [];
  const at = (d, h, m) => { const x = new Date(d); x.setHours(h, m, 0, 0); return x; };
  const iso = d => ymd(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  const push = (id, title, body, when) => { if (when > now) once.push({id, title, body, at:iso(when)}); };
  if (R.water) [11,13,16,19].forEach(h => repeat.push({id:'water-' + h, title:'Water break \u{1F4A7}', body:'Have a glass of water and tap it in Monmon’s Life.', hour:h, minute:0}));
  if (R.diary){
    repeat.push({id:'diary-0', title:'Diary time, Monmon ♡', body:'How was today? Pick your mood and answer today’s 3 questions.', hour:0, minute:0});
    repeat.push({id:'diary-2', title:'Before you sleep \u{1F319}', body:'If you haven’t yet, close the day in your diary. Then rest, beautiful.', hour:2, minute:0});
  }
  if (R.checkin) repeat.push({id:'checkin', title:'Evening check-in ✨', body:'Tick your habits, log your spending and what you did today.', hour:22, minute:0});
  if (R.money){
    const amt = S.settings.invest ? money(S.settings.invest) : 'your monthly amount';
    repeat.push({id:'invest', title:'New month: invest \u{1F4B0}', body:'Add ' + amt + ' to your investments this month.', day:1, hour:10, minute:0});
    repeat.push({id:'gold', title:'Gold reminder ✨', body:'Buy gold this month.', day:1, hour:10, minute:5});
    repeat.push({id:'scplan', title:'Plan your self-care month \u{1F338}', body:'Open Plans › Self-care and set this month’s sessions and prices.', day:1, hour:10, minute:10});
    repeat.push({id:'salary', title:'Log your salary \u{1F4B5}', body:'Add this month’s salary in Money › Salary.', day:1, hour:12, minute:0});
  }
  if (R.plans){
    S.tasks.filter(t => !t.done && t.due && t.prio === 'urgent').forEach(t => {
      const tm = t.time ? t.time.split(':').map(Number) : null, due = parseD(t.due);
      const eve = at(due, 20, 0); eve.setDate(eve.getDate() - 1);
      push('tu1-' + t.id, '\u{1F6A8} Urgent tomorrow', t.title, eve);
      push('tu2-' + t.id, '\u{1F6A8} Urgent today', t.title + (t.time ? ' · by ' + t.time : ''), at(due, 9, 0));
      if (tm){ const b = at(due, tm[0], tm[1]); b.setHours(b.getHours() - 1); push('tu3-' + t.id, '\u{1F6A8} 1 hour left', t.title, b); }
    });
    S.mashawer.filter(m => !m.done && m.remind !== false && m.date).forEach(m => {
      const t = m.time ? m.time.split(':').map(Number) : [10, 0];
      const when = at(parseD(m.date), t[0], t[1]); when.setDate(when.getDate() - 1);
      push('m-' + m.id, 'Tomorrow: ' + m.name + ' \u{1F4CD}', (m.time ? 'At ' + m.time + '. ' : '') + (m.note || 'Your meshwar is tomorrow.'), when);
    });
    Object.values(S.selfcare).forEach(list => list.forEach(s => {
      if (s.done || !s.planned) return;
      const when = at(parseD(s.planned), 20, 0); when.setDate(when.getDate() - 1);
      push('s-' + s.id, 'Tomorrow: ' + s.e + ' ' + s.name, s.price ? ('Budget: ' + money(s.price)) : 'Your self-care session is tomorrow.', when);
    }));
    S.tasks.filter(t => !t.done && t.due && t.prio !== 'urgent').forEach(t => {
      if (t.prio === 'high'){ const eve = at(parseD(t.due), 20, 0); eve.setDate(eve.getDate() - 1); push('th-' + t.id, '⚠\u{FE0F} Important tomorrow', t.title, eve); }
      push('t-' + t.id, (t.kind === 'work' ? 'Work task due today' : 'To-do today'), t.title, at(parseD(t.due), 9, 0));
    });
    S.exp.filter(x => !x.done && x.date).forEach(x => { const when = at(parseD(x.date), 19, 0); when.setDate(when.getDate() - 1); push('x-' + x.id, 'Tomorrow: ' + x.title + ' ✨', x.with && x.with.length ? 'With ' + x.with.join(', ') : 'A new experience awaits.', when); });
  }
  if (R.meals){
    const slots = [['Breakfast',9,0],['Lunch',14,0],['Snack',17,30],['Dinner',20,30]];
    for (let o = 0; o < 4; o++){
      const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + o);
      const n = planDayNum(d); if (n < 1 || n > 30) continue;
      mealsFor(n).forEach((m, i) => push('meal-' + n + '-' + i, slots[i][0] + ' time, Monmon ♡', m.name + ' · ' + m.kcal + ' kcal', at(d, slots[i][1], slots[i][2])));
    }
  }
  lifeReminders(R, repeat, push, at);
  once.sort((a, b) => a.at < b.at ? -1 : 1);
  return {repeat, once};
}

function setupSelfcare(k){

  return SELFCARE.map((s, i) => ({id:uid(), name:s.name, e:s.e, price:'', planned:ymd(new Date(first.getFullYear(), first.getMonth(), startDay + i * step)), done:'', spendId:'', wedding:k <= (S.profile && S.profile.wedding ? S.profile.wedding.slice(0, 7) : '2026-12')}));
}

/* ---------- small helpers ---------- */
const isNight = () => { const h = new Date().getHours(); return h >= 23 || h < 9; };
const jobName = id => (S.jobs.find(j => j.id === id) || {name:id === 'other' ? 'Other income' : id}).name;
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
function paydayOn(job, y, m){ const last = new Date(y, m + 1, 0).getDate(); return ymd(new Date(y, m, Math.min(job.day, last))); }
function nextPaydays(job, n){ const out = [], now = new Date(); let y = now.getFullYear(), m = now.getMonth(); while (out.length < n){ const d = paydayOn(job, y, m); if (d >= todayStr()) out.push(d); m++; if (m > 11){ m = 0; y++; } } return out; }
function paydayWindow(){
  const t = todayStr(), now = new Date();
  for (const j of S.jobs){ for (let back = 0; back < 2; back++){ const d = paydayOn(j, now.getFullYear(), now.getMonth() - back + (now.getMonth() - back < 0 ? 12 : 0)); const diff = daysBetween(d, t); if (diff >= 0 && diff <= 2) return j; } }
  const inc = S.income.find(i => { const diff = daysBetween(i.date, t); return diff >= 0 && diff <= 2; });
  return inc ? (S.jobs.find(j => j.id === inc.job) || {name:'Salary'}) : null;
}
const incomeIn = k => S.income.filter(i => inMonth(i, k));
const valuLeft = () => Math.max(0, S.valu.total - sum(S.valu.paid, p => p.amount));
const jarByName = n => S.jars.find(j => j.name.toLowerCase() === n.toLowerCase());
const jarTotal = j => sum(j.deposits, d => d.amount);
function deposit(j, a, why){

  return !!ms;
}

function autoPlanBeauty(){
  const W = S.profile.wedding; if (!W) return 0;
  const t = todayStr(), cap = (d, max) => (d > max ? max : d), before = n => addDays(W, -n);
  const plan = {hl1:addDays(t, 3), hl2:addDays(t, 31), hl3:addDays(t, 59), pc1:addDays(t, 5), pc2:addDays(t, 33), sv:addDays(t, 10), sb:before(21), fi:before(25), bo:before(25), ht:before(14), hd:before(5)};
  const max = {hl1:before(10), hl2:before(10), hl3:before(10), pc1:before(14), pc2:before(14), sv:before(21)};
  let n = 0;
  S.wedding.beauty.forEach(b => { if (!b.planned && !b.done && plan[b.id]){ let d = plan[b.id]; if (max[b.id]) d = cap(d, max[b.id]); if (d < t) d = t; b.planned = d; n++; } });
  return n;
}

/* ---------- habits by period ---------- */
function periodCount(h, day){
  if (h.freq === 'weekly') return weekCount(h.id, day);
  if (h.freq === 'monthly'){ const k = day.slice(0, 7), last = new Date(+k.slice(0, 4), +k.slice(5, 7), 0).getDate(); let c = 0; for (let d = 1; d <= last; d++) if (habitDone(h.id, k + '-' + pad(d))) c++; return c; }
  return habitDone(h.id, day) ? 1 : 0;
}

  $('#pAdd', el).onclick = () => { const name = $('#pName', el).value.trim(); if (!name) return toast('Where are you going?');

  $$('[data-mw]', el).forEach(b => b.onclick = () => { const m = S.mashawer.find(x => x.id === b.dataset.mw); m.wedding = !m.wedding; save(); toast(m.wedding ? 'Added to wedding prep \u{1F48D}' : 'Removed from wedding prep'); again(); });

const WED_SHOP = [['\u{1FA72}','Panties'],['\u{1F459}','More lingerie (cosplay)'],['\u{1F9F4}','Perfumes'],['\u{1F9F4}','Body lotion'],['\u{1F4A6}','Body splash'],['\u{1F6C1}','Body care'],

  {id:'moist', name:'Moisturise my body', e:'\u{1F9F4}', freq:'daily', target:1, reward:''},
  {id:'nails', name:'Nails at home', e:'\u{1F485}', freq:'weekly', target:1, reward:''},
  {id:'pedi', name:'Pedicure in the shower', e:'\u{1F9B6}', freq:'weekly', target:1, reward:''},
];
function weddingSessions(){ const out = []; Object.keys(S.selfcare).sort().forEach(k => S.selfcare[k].forEach(s => { if (s.wedding) out.push({k, s}); })); return out; }
function scHabit(s){
  if (!s.done) return;
  const id = /lash/i.test(s.name) ? 'm-lashes' : /moroccan|bath/i.test(s.name) ? 'm-bath' : (/laser/i.test(s.name) && !/pico|spider/i.test(s.name)) ? 'm-laser' : '';
  if (id && S.habits.some(h => h.id === id)){ S.hlog[s.done] = S.hlog[s.done] || {}; S.hlog[s.done][id] = true; }
}
function weddingMigrate(){
  if (S.seed6) return;
  const t = todayStr(), W = S.profile.wedding = '2026-12-31';
  const old = {}; (S.wedding.beauty || []).forEach(b => { old[b.id === 'sv' ? 'sv1' : b.id] = b; });
  const months = [...new Set(WED_PLAN.map(p => p[4].slice(0, 7)))], claimed = new Set();
  WED_PLAN.forEach(([key, name, e, price, date, note]) => {
    const o = old[key], k = date.slice(0, 7), list = S.selfcare[k] = S.selfcare[k] || [], re = WED_MATCH[key.replace(/\d$/, '')];
    let s = re && list.find(x => !claimed.has(x.id) && !x.key && re.test(x.name) && !(key.startsWith('hl') && /pico|spider/i.test(x.name)));
    if (!s){ s = {id:uid(), name, e, price:'', planned:'', done:'', spendId:''}; list.push(s); }
    claimed.add(s.id);
    Object.assign(s, {key, name, e, wedding:true, note:note || ''});
    if (o && o.done){ s.done = o.done; s.spendId = o.spendId || ''; }
    s.price = s.price || (o && o.price) || price;
    s.planned = s.done ? (s.planned || s.done) : (date < t ? t : date);
  });
  months.forEach(k => { S.selfcare[k] = S.selfcare[k].filter(x => {
    if (claimed.has(x.id)) return true;
    if (k > ym(new Date()) && !x.done && !x.price) return false;   // untouched placeholder sessions in coming months
    x.wedding = false; return true; }); });
  S.wedding.beauty = [];
  const hd = S.wedding.checklist.find(c => /find a hairdresser/i.test(c.title)); if (hd) hd.title = 'Book the hairdresser';
  if (!S.wedding.checklist.some(c => /turkey/i.test(c.title))) S.wedding.checklist.push({id:uid(), e:'\u{2708}\u{FE0F}', title:'Turkey travel papers', done:false});
  S.wedding.shopping = S.wedding.shopping || [];
  WED_SHOP.forEach(([e, title]) => { if (!S.wedding.shopping.some(x => x.title === title)) S.wedding.shopping.push({id:uid(), e, title, done:false}); });

  HOME_HABITS.forEach(h => { if (!S.habits.some(x => x.id === h.id)) S.habits.push(Object.assign({}, h)); });
  S.seed6 = true;
}

        L.map(s => '<div class="sc' + (s.done ? ' done' : '') + '"><span class="em">' + s.e + '</span><div style="min-width:0"><div class="nm">' + esc(s.name) + '</div>' + (s.note ? '<span class="small muted" style="font-weight:700">' + esc(s.note) + '</span>' : '') +
          '<div class="fields">' + field(s, 'price', 'Price', 'number') + field(s, 'planned', 'Planned', 'date') + field(s, 'done', 'Done on', 'date') + '</div></div>' + delBtn('data-wsdel', s.id) + '</div>').join('') + '</div>' +
        '<div class="row"><label class="field"><input class="in" data-wsin="' + k + '" placeholder="Add a session to ' + MONTHS_L[+k.slice(5) - 1] + '…" aria-label="New session"></label><button class="btn soft" data-wsadd="' + k + '">Add</button></div></div>'; }).join('') +
    '<p class="note">\u{1F514} Reminder the evening before each session. These also show in Plans › Self-care, month by month. ' + money(spent) + ' spent so far.</p>' +
    '<div class="card"><h2>Wedding preparations</h2><div class="row"><label class="field" style="flex:0 0 60px"><input class="in" id="wcE" value="\u{1F48D}" maxlength="4" style="text-align:center" aria-label="Emoji"></label><label class="field"><input class="in" id="wcIn" placeholder="Invitations, photographer, dress fitting…" aria-label="New item"></label><button class="btn" id="wcAdd">Add</button></div>' +
      '<div class="list">' + S.wedding.checklist.map(x => '<div class="item' + (x.done ? ' done' : '') + '"><button class="tick' + (x.done ? ' on' : '') + '" data-wcd="' + x.id + '" aria-label="Done">' + CHECK + '</button><span class="t">' + (x.e || '\u{1F48D}') + ' ' + esc(x.title) + '</span>' + delBtn('data-wcdel', x.id) + '</div>').join('') + '</div></div>' +
    '<div class="card"><div class="card-head"><h2>Wedding shopping</h2><span class="num muted">' + shop.filter(x => x.done).length + '/' + shop.length + '</span></div><div class="row"><label class="field"><input class="in" id="wsIn" placeholder="Add something to buy…" aria-label="New item"></label><button class="btn" id="wsAdd">Add</button></div>' +
      '<div class="list">' + shop.map(x => '<div class="item' + (x.done ? ' done' : '') + '"><button class="tick' + (x.done ? ' on' : '') + '" data-wsd="' + x.id + '" aria-label="Bought">' + CHECK + '</button><span class="t">' + x.e + ' ' + esc(x.title) + '</span>' + delBtn('data-wshdel', x.id) + '</div>').join('') + '</div>' +

    '<div class="card"><div class="card-head"><h2>Mashawer \u{1F48D}</h2><button class="linkbtn" data-go="plans:mashawer">Add or set dates</button></div><div class="list">' + (wm.length ? wm.map(m => '<div class="item' + (m.done ? ' done' : '') + '"><button class="tick' + (m.done ? ' on' : '') + '" data-wmd="' + m.id + '" aria-label="Done">' + CHECK + '</button><span class="t">' + esc(m.name) + '<span class="s">' + (m.date ? nice(m.date) : 'No date yet') + '</span></span><span></span></div>').join('') : '<div class="empty">Tap \u{1F48D} on a meshwar to add it here.</div>') + '</div></div>';
