<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Monmon's Life</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monmon's Life">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fff2f6">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@500;600&family=Lalezar&family=Cairo:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: one phone column; six colour-coded sections (Today rose, Food coral, Money mint, Plans lilac, Grow sky, Me berry).
   Each section: segmented sub-menu, then stacked soft cards with a 1.5px tinted border. Tab bar pinned to the bottom. */
:root{
  --bg:#fff4f8; --bg2:#ffe6ef; --surface:#ffffff; --ink:#4b1f33; --muted:#9a6a7e; --line:#f5d6e1;
  --rose:#ff5c8f; --coral:#ff7f5c; --mint:#22b07d; --lilac:#8f6bff; --sky:#3b9cf5; --berry:#d9479a; --gold:#e8a317; --warn:#ff6a3d; --danger:#ef3b5d;
  --rose-soft:#ffd6e3; --coral-soft:#ffe1d6; --mint-soft:#d6f5e8; --lilac-soft:#e8e0ff; --sky-soft:#dcedff; --berry-soft:#fbdcee; --gold-soft:#fff0c9;
  --acc:var(--rose); --acc-soft:var(--rose-soft);
  --shadow:0 12px 28px -18px rgba(150,40,90,.45);
  --r:22px;
  --f-display:"Shrikhand","Lalezar","Georgia",serif;
  --f-body:"Nunito","Cairo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Fredoka","Nunito","Cairo",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}

:root[data-theme="dark"]{
  --bg:#211019; --bg2:#311827; --surface:#2f1a26; --ink:#ffe8f0; --muted:#d2a5b9; --line:#4a2a3b;
  --rose:#ff7aa5; --coral:#ff9a7c; --mint:#4fd8a4; --lilac:#ae94ff; --sky:#6db7ff; --berry:#f06db4; --gold:#ffc542; --warn:#ff8f66; --danger:#ff6380;
  --rose-soft:#55233d; --coral-soft:#55302a; --mint-soft:#1f4637; --lilac-soft:#3a2f5c; --sky-soft:#22394f; --berry-soft:#522540; --gold-soft:#4d3d16;
  --shadow:0 12px 28px -18px rgba(0,0,0,.7); color-scheme:dark}
body[data-tab="today"]{--acc:var(--rose);--acc-soft:var(--rose-soft)}
body[data-tab="food"]{--acc:var(--coral);--acc-soft:var(--coral-soft)}
body[data-tab="money"]{--acc:var(--mint);--acc-soft:var(--mint-soft)}
body[data-tab="plans"]{--acc:var(--lilac);--acc-soft:var(--lilac-soft)}
body[data-tab="grow"]{--acc:var(--sky);--acc-soft:var(--sky-soft)}
body[data-tab="me"]{--acc:var(--berry);--acc-soft:var(--berry-soft)}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);touch-action:pan-x pan-y;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden;transition:background .4s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:12px}

.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(46px);opacity:.55;animation:drift 18s ease-in-out infinite alternate;transition:background .6s}
.blob.a{width:280px;height:280px;background:var(--acc-soft);top:-80px;right:-90px}
.blob.b{width:220px;height:220px;background:var(--gold-soft);bottom:140px;left:-100px;animation-delay:-6s}
.blob.c{width:170px;height:170px;background:var(--lilac-soft);top:42%;right:-70px;animation-delay:-11s}
@keyframes drift{to{transform:translate(30px,40px) scale(1.12)}}

.app{position:relative;z-index:1;max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 130px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{margin:0;font-size:12px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-family:var(--f-display);font-weight:400;font-size:clamp(25px,7.6vw,34px);line-height:1.05;color:var(--rose)}
h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--ink);text-wrap:balance;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc);flex:0 0 auto}
h2.plain::before{display:none}
h3{margin:0;font-size:11.5px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--acc)}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
.iconbtn svg{width:20px;height:20px}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);border:1.5px solid color-mix(in srgb,var(--acc) 16%,var(--line));box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.tint{background:linear-gradient(145deg,var(--surface) 35%,var(--acc-soft))}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pop{animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{opacity:.0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

/* segmented control */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:0 -2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:13px;font-weight:800;color:var(--muted);transition:all .2s}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 8px 16px -10px var(--acc)}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 120px}
.card>.field,.sc .field,.grow .field,.sheet-in>.field{flex:0 0 auto}
.field>span{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.in{width:100%;box-sizing:border-box;font-size:16px;padding:11px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;min-width:0;transition:border-color .2s}
.in:focus{border-color:var(--acc)}
textarea.in{resize:vertical;min-height:64px;font-weight:600;line-height:1.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
input[type=date].in,input[type=time].in{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;min-height:46px;direction:ltr;text-align:center}
input[type=date].in::-webkit-date-and-time-value,input[type=time].in::-webkit-date-and-time-value{text-align:center;margin:0}
.sc .fields input[type=date].in,.sc .fields input[type=time].in{min-height:38px}
select.in{min-width:0;max-width:100%}
.btn{background:var(--acc);color:#fff;font-weight:900;padding:11px 16px;border-radius:14px;flex:0 0 auto;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.soft{background:var(--acc-soft);color:var(--acc)}
.btn.full{width:100%}
.linkbtn{font-size:12px;font-weight:900;color:var(--acc);padding:6px 11px;border-radius:999px;background:var(--acc-soft);flex:0 0 auto}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);min-width:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .t{font-weight:700;min-width:0;overflow-wrap:anywhere}
.item .s{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.tick{width:26px;height:26px;border-radius:9px;border:2px solid var(--acc-soft);display:grid;place-items:center;transition:all .25s cubic-bezier(.3,1.6,.5,1);flex:0 0 auto}
.tick svg{width:14px;height:14px;stroke:#fff;stroke-width:4;fill:none;opacity:0}
.tick.on{background:var(--mint);border-color:var(--mint);transform:rotate(-6deg)}
.tick.on svg{opacity:1}
.del{color:var(--muted);font-size:20px;line-height:1;min-width:30px;height:30px;border-radius:15px;display:grid;place-items:center;padding:0 6px}
.del.armed{font-size:12px;color:var(--danger);font-weight:900;background:color-mix(in srgb,var(--danger) 12%,transparent)}
.empty{font-size:13px;color:var(--muted);text-align:center;padding:10px 0}
.amt{font-family:var(--f-num);font-weight:600;white-space:nowrap}
.pill{display:inline-block;font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:999px;background:var(--acc-soft);color:var(--acc);margin-right:4px;vertical-align:1px}
.pill.urgent{background:var(--danger);color:#fff;animation:none;box-shadow:none;display:inline-block;padding:2px 8px}
.pill.high{background:var(--gold-soft);color:#a86d00}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);font-size:13px;font-weight:800;transition:all .2s}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;transform:translateY(-1px)}
.chip .cnt{font-family:var(--f-num);font-size:11px;opacity:.85}
.hgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.habit{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:16px;background:var(--bg);border:1.5px solid var(--line);text-align:left;font-weight:800;font-size:13.5px;min-width:0;transition:all .25s cubic-bezier(.3,1.5,.5,1)}
.habit .e{font-size:19px}
.habit .hs{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.habit.on{background:var(--mint-soft);border-color:var(--mint);transform:scale(1.02)}
.habit .hl{min-width:0}
.habit .fire{margin-left:auto;font-family:var(--f-num);font-size:12px;color:var(--warn);white-space:nowrap}
.hgrid.hg3{grid-template-columns:repeat(3,1fr);gap:7px}
.habit.mini{position:relative;flex-direction:column;justify-content:center;text-align:center;gap:3px;padding:12px 6px 10px;font-size:12px;line-height:1.2}
.habit.mini .e{font-size:22px}
.habit.mini .hl{overflow-wrap:anywhere}
.habit.mini .hs{font-size:10.5px}
.habit.mini .fire{position:absolute;top:4px;right:6px;margin:0;font-size:10.5px}
.habit.met{border-color:var(--mint);border-style:dashed}
.ov{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.ovt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:16px;background:var(--bg);border:1.5px solid var(--line);text-align:center;min-width:0;color:var(--ink)}
.ovt .oe{font-size:20px}
.ovt b{font-family:var(--f-num);font-size:17px;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovt span:last-child{font-size:10.5px;font-weight:800;color:var(--muted);line-height:1.2;overflow-wrap:anywhere}
.ovt:active{transform:scale(.96)}
.wedtrack{background:linear-gradient(150deg,var(--rose-soft),var(--gold-soft));border-color:transparent;gap:10px}
.wedtrack .wtop{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.wedtrack .wn{font-size:48px;font-weight:600;color:var(--rose);line-height:1}
.wedpill{background:var(--rose-soft);color:var(--rose)}
.tagw{border:1.5px dashed var(--line);background:var(--bg);border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:800;color:var(--muted);white-space:nowrap}
.tagw.on{border-style:solid;border-color:var(--rose);background:var(--rose-soft);color:var(--rose)}

/* hero + stats */
.greet{font-family:var(--f-display);font-size:22px;line-height:1.1}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:16px;padding:10px;text-align:center;border:1.5px solid var(--line)}
.stat b{display:block;font-family:var(--f-num);font-size:20px;font-weight:600;color:var(--acc)}
.stat span{font-size:11px;font-weight:800;color:var(--muted)}
.money3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mbox{background:var(--surface);border-radius:20px;padding:12px;border:1.5px solid color-mix(in srgb,var(--acc) 16%,var(--line));box-shadow:var(--shadow);min-width:0}
.mbox b{display:block;font-family:var(--f-num);font-size:18px;font-weight:600;overflow-wrap:anywhere;color:var(--ink)}
.mbox span{font-size:11px;font-weight:800;color:var(--muted)}

/* urgent banner */
div.urgent{background:linear-gradient(135deg,var(--danger),var(--warn));color:#fff;border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 14px 28px -14px var(--danger);animation:pulse 2s ease-in-out infinite}
.urgent h2{color:#fff}.urgent h2::before{background:#fff}
.urgent .ur{display:flex;align-items:center;gap:10px;font-weight:800;text-align:left}
.urgent .ur .tick{border-color:rgba(255,255,255,.7)}
.urgent .card-head h2{margin:0}
.flag{flex:0 0 auto;width:32px;height:32px;border-radius:999px;border:1.5px dashed var(--line);background:var(--bg);font-size:14px;line-height:1;filter:grayscale(1);opacity:.5;transition:all .2s}
.ibtns{display:inline-flex;gap:4px;align-items:center;flex:0 0 auto}
.bell{flex:0 0 auto;width:32px;height:32px;border-radius:999px;border:1.5px dashed var(--line);background:var(--bg);font-size:14px;line-height:1;filter:grayscale(1);opacity:.5;transition:all .2s}
.bell.on{filter:none;opacity:1;border-style:solid;border-color:var(--gold);background:var(--gold-soft)}
.urgent .bell{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.6)}
.flag.on{filter:none;opacity:1;border-style:solid;border-color:var(--danger);background:#ffe3e8;transform:scale(1.05)}
.urgent .flag.on{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.75)}
@keyframes pulse{0%,100%{box-shadow:0 14px 28px -14px var(--danger)}50%{box-shadow:0 14px 34px -8px var(--danger)}}

/* mood */
.moods{display:flex;justify-content:space-between;gap:6px}
.mood{flex:1;font-size:26px;padding:8px 0;border-radius:16px;background:var(--bg);border:1.5px solid var(--line);transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.mood.on{background:var(--acc-soft);border-color:var(--acc);transform:scale(1.08)}
.mood span{display:block;font-size:10px;font-weight:900;color:var(--muted);margin-top:2px}
.qlab{font-weight:800;font-size:14px;color:var(--ink);text-transform:none!important;letter-spacing:0!important}

/* meals */
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 8px;margin:0 -2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dpill{flex:0 0 52px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);font-family:var(--f-num);transition:transform .25s}
.dpill .dn{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dpill .dd{font-size:19px;font-weight:600}
.dpill .dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dpill.done .dot{background:var(--mint)}
.dpill.part .dot{background:var(--gold)}
.dpill.today{border-style:dashed;border-color:var(--acc)}
.dpill.sel{background:var(--acc);border-color:var(--acc);color:#fff;transform:translateY(-3px)}
.dpill.sel .dn{color:#fff}
.ringwrap{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{position:relative;width:124px;height:124px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--acc-soft);stroke-width:12}
.ring .fill{fill:none;stroke:url(#grad);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.3,1.4,.5,1)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-family:var(--f-num);font-size:26px;font-weight:600;line-height:1}
.ring .sm{font-size:11px;color:var(--muted);font-weight:800}
.bar{height:10px;border-radius:999px;background:var(--acc-soft);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--lilac),var(--acc));transition:width .9s cubic-bezier(.3,1.3,.5,1)}
.bar.over>i{background:linear-gradient(90deg,var(--gold),var(--danger))}
.bar.good>i{background:linear-gradient(90deg,var(--sky),var(--mint))}
.statrow{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:800;text-align:left}
.sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .25s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.sw[aria-checked="true"]{background:var(--acc)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.cups{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.cup{aspect-ratio:3/4;max-width:100%;border-radius:10px 10px 14px 14px;border:2px solid var(--sky-soft);position:relative;overflow:hidden}
.cup::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#9fd8ff,#79b8ff);transition:height .45s cubic-bezier(.3,1.4,.5,1)}
.cup.on::after{height:78%}
.cup.on{border-color:#9fd0ff}
.meal{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border-radius:var(--r);padding:13px;border:1.5px solid color-mix(in srgb,var(--acc) 16%,var(--line));box-shadow:var(--shadow);transition:background .3s}
.meal .ic{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.meal .ic svg{width:24px;height:24px}
.meal .txt{min-width:0}
.meal .lbl{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.meal .nm{font-weight:800;font-size:14.5px;line-height:1.3;margin-top:2px}
.meal .mac{font-family:var(--f-num);font-size:12px;color:var(--muted);margin-top:3px}
.meal .swap{font-size:11px;font-weight:900;color:var(--acc);background:var(--acc-soft);padding:3px 9px;border-radius:999px;letter-spacing:0;text-transform:none}
.check{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--acc-soft);display:grid;place-items:center;transition:all .3s cubic-bezier(.3,1.6,.5,1)}
.check svg{width:16px;height:16px;stroke:#fff;stroke-width:3.5;fill:none;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s .1s}
.meal.eaten{background:var(--mint-soft)}
.meal.eaten .check{background:var(--mint);border-color:var(--mint)}
.meal.eaten .check svg{stroke-dashoffset:0}
.meal.eaten .nm{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--mint) 70%,transparent);text-decoration-thickness:2px}

  {f:'history', t:'تحتمس التالت: نابليون مصر', x:'تحتمس التالت قاد أكتر من 15 حملة عسكرية ووسّع حدود مصر لأكبر حجم في تاريخها، من سوريا للسودان. معركة مجدو من أقدم المعارك اللي وصلنا تفاصيلها مكتوبة.', ex:'أسماء البلاد اللي فتحها مكتوبة على جدران الكرنك.'},
  {f:'history', t:'إخناتون: ثورة دينية', x:'إخناتون (القرن 14 قبل الميلاد) خلّى عبادة قرص الشمس "آتون" الأساسية، ونقل العاصمة لمدينة جديدة "أخيتاتون" (تل العمارنة)، والفن في عهده بقى أكتر واقعية. بعد موته كل ده اترجع.', ex:'زوجته نفرتيتي وتمثالها الشهير موجود في متحف برلين.'},
  {f:'history', t:'توت عنخ آمون', x:'ملك صغير حكم وهو طفل ومات حوالي سن 19، ومكانش من أهم الملوك سياسيًا. شهرته جت لأن مقبرته اتلقت تقريبًا كاملة سنة 1922 على إيد هوارد كارتر، بكنوز زي القناع الدهب.', ex:'كنوزه دلوقتي في المتحف المصري الكبير.'},
  {f:'history', t:'رمسيس التاني', x:'حكم حوالي 66 سنة في القرن 13 قبل الميلاد. حارب الحيثيين في معركة قادش، وبعدها بسنين وقّع معاهم معاهدة سلام تعتبر من أقدم معاهدات السلام المكتوبة. بنى أبو سمبل ومعابد كتير.', ex:'الشمس بتدخل معبد أبو سمبل وتنور وش التمثال مرتين في السنة، في فبراير وأكتوبر.'},
  {f:'history', t:'الكتابة المصرية', x:'المصريين استخدموا الهيروغليفية في المعابد، والهيراطيقية (أسرع) للكتابة اليومية، وبعدين الديموطيقية. ومن آخر مراحل اللغة المصرية جت القبطية بحروف يونانية، ولسه بتتقال في صلوات الكنيسة.', ex:'أسماء الشهور القبطية اللي الفلاحين لسه بيزرعوا بيها، زي توت وطوبة وأمشير وبرمهات، جاية من مصر القديمة. وكلمة "طوب" نفسها أصلها مصري قديم.'},
  {f:'history', t:'نهاية الفراعنة', x:'بعد الدولة الحديثة مصر ضعفت، وحكمها ليبيين ونوبيين، وبعدين الفرس سنة 525 قبل الميلاد. سنة 332 قبل الميلاد دخل الإسكندر الأكبر وأسس الإسكندرية، وبعده حكم البطالمة لحد كليوباترا السابعة اللي ماتت سنة 30 قبل الميلاد ودخلت مصر تحت حكم روما.', ex:'كليوباترا كانت أول بطلمية تتعلم المصري، وكانت بتتكلم لغات كتير.'},
  {f:'history', t:'الإسكندرية: عاصمة العلم', x:'في عصر البطالمة الإسكندرية بقت عاصمة العلم في العالم: مكتبة الإسكندرية والفنار (من عجايب الدنيا السبع). علماء زي إقليدس (الهندسة) وإراتوستينس اللي حسب محيط الأرض بدقة مدهشة اشتغلوا هناك.', ex:'إراتوستينس حسبه من فرق طول ظل الشمس بين أسوان والإسكندرية.'},
  {f:'history', t:'مصر القبطية', x:'المسيحية دخلت مصر بدري، والتقليد بيقول على إيد مرقس الرسول. الرهبنة المسيحية اتولدت في صحاري مصر مع الأنبا أنطونيوس. والكنيسة القبطية الأرثوذكسية من أقدم الكنايس في العالم.', ex:'دير سانت كاترين في سينا من أقدم الأديرة اللي لسه شغالة في العالم.'},
  {f:'history', t:'الفتح الإسلامي', x:'حوالي سنة 640–641 ميلادي دخل عمرو بن العاص مصر، وبنى مدينة الفسطاط وجامع عمرو بن العاص اللي يعتبر أول جامع في مصر وأفريقيا. مع الوقت العربية بقت لغة الناس والإسلام دين الأغلبية.', ex:'مصر بقت ولاية مهمة جدًا لأنها كانت مخزن القمح.'},
  {f:'history', t:'ابن طولون والإخشيديين', x:'سنة 868 أحمد بن طولون بقى والي مصر وعمل دولة شبه مستقلة، وبنى جامع ابن طولون اللي مئذنته بسلم من بره. وبعده حكم الإخشيديين، وفي عهدهم كان كافور الإخشيدي اللي هجاه المتنبي.', ex:'جامع ابن طولون من أقدم وأكبر الجوامع في القاهرة اللي لسه محتفظة بشكلها الأصلي.'},
  {f:'history', t:'الفاطميين: القاهرة والأزهر', x:'سنة 969 جيش الفاطميين بقيادة جوهر الصقلي دخل مصر وأسس مدينة القاهرة، وبنى الجامع الأزهر (حوالي 970–972) اللي بقى من أقدم الجامعات في العالم. وحكموا قرنين.', ex:'شارع المعز وبوابات زي باب زويلة وباب الفتوح من عصرهم.'},
  {f:'history', t:'صلاح الدين والأيوبيين', x:'صلاح الدين الأيوبي أنهى الحكم الفاطمي سنة 1171، وبنى قلعة القاهرة، ووحد مصر والشام، وانتصر على الصليبيين في حطين سنة 1187 واسترد القدس.', ex:'القلعة فضلت مقر حكم مصر حوالي 700 سنة.'},
  {f:'history', t:'المماليك: العبيد اللي بقوا ملوك', x:'المماليك كانوا عبيد بيتشتروا صغيرين ويتربوا كجنود. سنة 1250 استولوا على الحكم بعد شجر الدر، أول ست تحكم مصر في العصر الإسلامي. حكموا من 1250 لـ1517 وانقسموا لمماليك بحرية ومماليك برجية.', ex:'المملوك مكانش بيورث الحكم لابنه في الغالب، الأقوى هو اللي بيحكم.'},
  {f:'history', t:'عين جالوت: وقف المغول', x:'المغول كانوا دمروا بغداد سنة 1258 وكانوا ماشيين في طريقهم. سنة 1260 جيش المماليك بقيادة السلطان قطز والظاهر بيبرس هزمهم في عين جالوت في فلسطين. دي كانت أول هزيمة كبيرة للمغول وحمت مصر.', ex:'بعد المعركة بأيام بيبرس قتل قطز وبقى هو السلطان.'},
  {f:'history', t:'القاهرة المملوكية', x:'المماليك سابوا أجمل عمارة إسلامية في القاهرة: مدرسة السلطان حسن، وجامع ومدرسة قلاوون، وخان الخليلي. والقاهرة وقتها كانت من أكبر وأغنى مدن العالم بسبب التجارة بين الشرق والغرب.', ex:'ابن خلدون عاش وشغل منصب قاضي في القاهرة المملوكية ووصفها إنها "حاضرة الدنيا".'},
  {f:'history', t:'العثمانيين وطومان باي', x:'سنة 1517 السلطان العثماني سليم الأول هزم المماليك ودخل القاهرة، واتشنق آخر سلطان مملوكي طومان باي على باب زويلة. مصر بقت ولاية عثمانية حوالي 3 قرون، بس المماليك فضلوا ليهم نفوذ.', ex:'معركة الريدانية (مكان العباسية دلوقتي تقريبًا) كانت المعركة الحاسمة.'},
  {f:'history', t:'الحملة الفرنسية', x:'سنة 1798 نابليون جه مصر بجيش وعلماء. الحملة فشلت عسكريًا ومشيت سنة 1801، بس سابت أثر كبير: كتاب "وصف مصر"، وحجر رشيد اللي فكّ رموزه شامبليون سنة 1822 وفتح باب فهم الهيروغليفية.', ex:'ثورات القاهرة ضد الفرنسيين بيّنت دور الأزهر والشعب في المقاومة.'},
  {f:'history', t:'محمد علي: مؤسس مصر الحديثة', x:'حكم من 1805 لـ1848. قضى على المماليك في مذبحة القلعة سنة 1811، وبنى جيش حديث، ومصانع، وأرسل بعثات لأوروبا (منها رفاعة الطهطاوي)، وتوسع في زراعة القطن. وأسس أسرة حكمت لحد 1952.', ex:'القطن المصري طويل التيلة بقى من أشهر صادرات مصر من عصره.'},
  {f:'history', t:'إسماعيل وقناة السويس', x:'الخديوي إسماعيل عايز يخلي مصر "قطعة من أوروبا": القاهرة الخديوية والأوبرا وافتتاح قناة السويس سنة 1869. بس الديون كترت جدًا، فاضطر يبيع أسهم مصر في القناة لبريطانيا، والديون بقت باب للتدخل الأجنبي.', ex:'درس مالي من التاريخ: الدين اللي بيمول مظاهر ممكن يكلف الاستقلال.'},
  {f:'history', t:'عرابي والاحتلال الإنجليزي', x:'أحمد عرابي قاد حركة ضد التدخل الأجنبي وتحكم الشراكسة في الجيش. سنة 1882 الإنجليز هزموه في التل الكبير واحتلوا مصر، والاحتلال فضل بأشكال مختلفة لحد 1956.', ex:'جملته المشهورة: "لقد خلقنا الله أحرارًا، ولم يخلقنا تراثًا أو عقارًا".'},
  {f:'history', t:'ثورة 1919', x:'بعد نفي سعد زغلول، المصريين قاموا بثورة شعبية كبيرة شارك فيها مسلمين ومسيحيين وستات لأول مرة في مظاهرات عامة. نتيجتها تصريح 28 فبراير 1922 (استقلال منقوص)، ودستور 1923.', ex:'هدى شعراوي وستات كتير خرجوا في مظاهرات 1919، وده كان بداية الحركة النسائية المصرية الحديثة.'},
  {f:'history', t:'1952 وعبد الناصر', x:'في 23 يوليو 1952 الضباط الأحرار عملوا انقلاب أنهى الملكية، والجمهورية اتعلنت سنة 1953. جمال عبد الناصر عمل الإصلاح الزراعي، وأمّم قناة السويس سنة 1956 فحصل العدوان الثلاثي، وبنى السد العالي اللي خلص سنة 1970.', ex:'السد العالي وقف الفيضانات وولد كهربا، بس وقف الطمي اللي كان بيخصّب الأرض.'},
  {f:'history', t:'من النكسة لأكتوبر للسلام', x:'سنة 1967 مصر خسرت سينا في حرب يونيو (النكسة). وفي 6 أكتوبر 1973 الجيش عبر قناة السويس وحطم خط بارليف. السادات بعدها راح للسلام: اتفاقية كامب ديفيد 1978 ومعاهدة السلام 1979، وسينا رجعت كاملة سنة 1982 وطابا سنة 1989 بالتحكيم الدولي.', ex:'السادات اتقتل في 6 أكتوبر 1981 في العرض العسكري.'},
  {f:'history', t:'من مبارك لحد النهارده', x:'حسني مبارك حكم من 1981 لـ2011، تقريبًا 30 سنة. في 25 يناير 2011 قامت ثورة شعبية وتنحى في 11 فبراير. محمد مرسي اتنتخب سنة 2012، وبعد مظاهرات 30 يونيو 2013 الجيش عزله في 3 يوليو. عبد الفتاح السيسي اتنتخب رئيس سنة 2014، واتعاد انتخابه في 2018 و2023.', ex:'في 13 سنة بس، مصر عاشت 3 دساتير: 1971 (اتعطل)، و2012، و2014.'},
);

{r:[114, 130], s:'هل الأسر الكبيرة بتضر الأطفال؟ الدليل مش قاطع: التوائم وسياسة الطفل الواحد في الصين ماثبتوش إن الأخ الزيادة بيقلل تعليم الطفل. والفقرا غالبًا بيخلفوا العدد اللي عايزينه، وتوفر الموانع لوحده مش العائق. في كينيا، دفع تمن الزي المدرسي خلّى البنات يكملوا ويأجلوا الحمل، ومعلومة إن الرجالة الأكبر أكتر عدوى قللت الحمل منهم. وقوة صوت الست في البيت بتفرق.',
 q:[['إيه اللي قلل حمل البنات في كينيا؟', ['دفع تمن الزي المدرسي ومعلومة إن الرجالة الأكبر أكتر عدوى', 'منهج «امتنع وإلا فلتمت» لوحده', 'منع الجواز بالقانون'], 0, 'المنهج التقليدي مافرقش في السلوك.'],
    ['برنامج «مطلب» في بنجلاديش كان بيعمل إيه؟', ['ممرضة بتزور الستات في بيوتهم كل أسبوعين بخدمات تنظيم أسرة', 'بيدي فلوس للأسر الصغيرة', 'بيعاقب الأسر الكبيرة'], 0, 'وكمان بقت قدوة لـ«عُرف» جديد في القرية.'],
    ['الستات اللي استلموا الموانع وهم لوحدهم من غير أزواجهم...', ['كانوا أحرص على استخدامها وولاداتهم غير المرغوبة أقل', 'مااستخدموهاش خالص', 'اتطلقوا'], 0, 'لأن الراجل غالبًا عايز عيال أكتر.']]},
{r:[130, 142], s:'الأطفال عند الفقرا «خطة تقاعد»: باك سودارنو خلّف 9 عشان يضمن إن اتنين منهم على الأقل يرعوه. والأسرة مش كيان متناغم، لكن «عقد» غير مكتمل والست غالبًا الطرف الأضعف، والفلوس اللي بتروح للستات بتتصرف أحسن على العيال. ثم فصل المخاطر: الفقرا عايشين في عدم يقين كبير (أسعار، شغل، مطر، مرض)، وبيتضرروا أكتر من نفس الصدمة لأن أي تخفيض بيجي على الضروريات.',
 q:[['باك سودارنو خلّف 9 أطفال ليه؟', ['عشان يضمن إن على الأقل اتنين منهم يرعوه في الكبر', 'لأنه ماكانش يعرف عن موانع الحمل', 'عشان العُرف في قريته'], 0, 'في غياب معاش وتأمين، العيال هما الضمان.'],
    ['الكتاب بيوصف الأسرة إزاي؟', ['عقد غير مكتمل بيحدد واجبات كل فرد والمجتمع بينفذه', 'وحدة واحدة بتقرر بنفس العقل', 'شركة بتوزع أرباح بالتساوي'], 0, 'وده بيفسر ليه الأعراف بتتغير ببطء.'],
    ['ليه الفقرا بيتضرروا أكتر من نفس الصدمة؟', ['لأن أي تقليل في الاستهلاك بيجي على الضروريات زي الأكل', 'لأنهم مش بيشتغلوا', 'لأن البنوك بتساعدهم أقل'], 0, 'اللي معاه كتير بيقلل الكماليات، والفقير بيقلل الأكل.']]},
{r:[142, 163], s:'الفقرا «مديرين صناديق تحوط حفيانين»: بيوزعوا المخاطر بمهن كتير، وأراضي متفرقة، وهجرة مؤقتة، وجواز البنات في قرى بعيدة، ومساعدة بعض. بس الحلول دي غالية. والتأمين الرسمي شبه غايب بسبب الخطر الأخلاقي والانتقاء المعاكس والغش (قصة ودان البقر)، والناس نفسها مش متحمسة تشتري تأمين لأنه بيغطي الكوارث بس ومحتاج ثقة كاملة. فلازم يبقى فيه دور للحكومة.',
 q:[['إيه «الانتقاء المعاكس» في التأمين؟', ['إن اللي عارف إنه هيحتاج التأمين هو اللي بيشترك، فالقسط يغلى على الكل', 'إن الشركة بتختار العملاء الأغنى', 'إن الحكومة بتمنع التأمين'], 0, 'وده بيطرد الأصحاء من التأمين.'],
    ['قصة «ودان البقر» في الهند كانت عن إيه؟', ['غش في تأمين الماشية: ودن أي بقرة ميتة بتتباع للي عنده تأمين', 'مهرجان شعبي', 'طريقة لعلاج البقر'], 0, 'فالعميل ياخد التعويض ويحتفظ ببقرته.'],
    ['إزاي الأسر الفقيرة بتقلل المخاطر من غير تأمين؟', ['مهن كتير، أراضي متفرقة، هجرة مؤقتة، ومساعدة بعض', 'بتحط فلوسها في البورصة', 'بتستنى معونات الحكومة بس'], 0, 'الأسرة المتوسطة في غرب البنغال عندها 3 أفراد شغالين و7 مهن.']]},
{r:[163, 168], s:'قليل جدًا من الفقرا بياخدوا قروض رسمية، والباقي من قرايب ومرابين وأصحاب دكاكين بفوايد عالية جدًا، مش لأنهم بيتخلفوا، لكن لأن متابعة القروض الصغيرة ومعرفة المقترض مكلفة. التمويل متناهي الصغر (جرامين وبراك وسباندانا) وصل لـ150-200 مليون مقترض أغلبهم ستات بسداد عالي، بس تقييم سباندانا في حيدر أباد لقى أثر متواضع: مشاريع أكتر شوية وإنفاق أقل على الحاجات التافهة، مش ثورة.',
 q:[['ليه فايدة المرابي عالية؟', ['لأن متابعة القروض الصغيرة ومعرفة المقترض مكلفة، مش بسبب التخلف عن السداد', 'لأن الفقرا مابيسددوش أبدًا', 'لأن الحكومة بتحدد الفايدة'], 0, 'التخلف عن القروض غير الرسمية قليل فعلًا.'],
    ['أغلب المقترضين من التمويل متناهي الصغر...', ['ستات', 'رجال أعمال كبار', 'طلبة'], 0, 'والسداد بيبقى بانتظام وفي مجموعات.'],
    ['تقييم سباندانا في حيدر أباد لقى إيه؟', ['أثر متواضع: مشاريع أكتر شوية مش تحول كبير في حياة الناس', 'إن الفقر اختفى من الأحياء', 'إن القروض زودت الديون بشكل كارثي'], 0, 'مفيد، بس مش «معجزة».']]},
{r:[168, 173], s:'القروض متناهية الصغر مش بتناسب كل الناس: السداد بيبدأ بسرعة وبانتظام، فمش مناسبة لمشروع محتاج وقت يكبر. وفيه «وسط مفقود»: المشاريع المتوسطة أكبر من المرابين وأصغر من البنوك. وبدأ فصل الادخار: البيوت اللي مش مكتملة في الأحياء الفقيرة هي طريقة ادخار طوبة طوبة، والسؤال: ليه الفقرا مش بيدخروا أكتر رغم إن الادخار كان هيحميهم؟',
 q:[['ليه البيوت في الأحياء الفقيرة بتفضل مش مكتملة سنين؟', ['لأن الناس بتدّخر فيها طوبة طوبة كل ما يبقى معاهم فلوس', 'لأن البنائين مضربين', 'لأن الحكومة بتمنع البناء'], 0, 'الطوب أأمن من الفلوس السايلة في البيت.'],
    ['إيه «الوسط المفقود» في تمويل المشاريع؟', ['مشاريع أكبر من قدرة المرابين والتمويل الصغير وأصغر من البنوك', 'الطبقة الوسطى اللي مش بتدّخر', 'المشاريع الحكومية'], 0, 'زي مصنع مياو لي اللي ماعرفش يكبر.'],
    ['من عيوب القروض متناهية الصغر...', ['السداد بيبدأ بسرعة وبانتظام، فمش مناسبة لمشروع محتاج وقت', 'فايدتها صفر', 'بتتدي للرجالة بس'], 0, 'الصرامة دي هي سر انخفاض التخلف، بس ليها تمن.']]},
{r:[173, 181], s:'جنيفر أوما مشتركة في 6 جمعيات ادخار: الفقرا بيدّخروا ببراعة بطرق معقدة لأن البنوك مش عايزة حساباتهم الصغيرة. ولما اتفتحلهم حسابات ببلاش في كينيا، الستات ادخروا واستثمروا أكتر. وبائعي الفاكهة في تشيناي كان ممكن يتحرروا من قرض يومي بفايدة 4.69% في اليوم بمجرد ما يقللوا كوبايتين شاي. المشكلة جزء منها نفسي (إغراء النهارده)، وحلول زي حسابات بهدف مقفول وبيع السماد وقت الحصاد بتساعد.',
 q:[['بائعي الفاكهة في تشيناي كانوا بيقترضوا كل صبح بفايدة قد إيه؟', ['حوالي 4.69% في اليوم', '1% في السنة', 'مفيش فايدة'], 0, 'شوية ادخار صغير كانوا هيحرروهم في أسابيع.'],
    ['ليه فلاحين كينيا اللي اقتنعوا بالسماد مارجعوش يشتروه؟', ['لأن الفلوس بتخلص قبل وقت الشرا، وبيع السماد وقت الحصاد ساعدهم', 'لأنهم ماقتنعوش بيه', 'لأنه ممنوع'], 0, 'لما يشتروه وقت ما الفلوس في إيدهم بيستخدموه.'],
    ['إيه فكرة حساب الادخار في الفلبين؟', ['حساب مربوط بهدف أو تاريخ مايتسحبش منه قبله', 'حساب بفايدة عالية جدًا', 'حساب مشترك مع الجيران'], 0, 'بيحمينا من نفسنا.']]},
{r:[181, 189], s:'الفقر بيخلي ضبط النفس أصعب: لما المستقبل مش باين، ليه تحرم نفسك النهارده؟ والادخار بيتشجع لما الناس تشوف أمل حقيقي إن أهدافها هتتحقق، فالأمل نفسه وقود. ثم فصل «رواد الأعمال غصب عنهم»: الفقرا بيفتحوا مشاريع كتير جدًا، ومؤسسة الأمانة في المغرب لقت إن ناس كتير مش عايزين يقترضوا حتى لما القرض متاح.',
 q:[['حسب الكتاب، إيه اللي بيشجع الفقرا على الادخار والاستثمار؟', ['إحساسهم إن فيه أمل حقيقي إن أهدافهم هتتحقق', 'الوعظ والنصايح', 'فرض ضرايب أعلى'], 0, 'الأمل بيخلي التضحية النهارده ليها معنى.'],
    ['تجربة مؤسسة الأمانة في ريف المغرب لقت إيه؟', ['إن الإقبال على القروض أقل بكتير من المتوقع', 'إن الكل اقترض فورًا', 'إن القروض ممنوعة عند الكل'], 0, 'مش كل الناس عايزة تبقى صاحبة مشروع.'],
    ['ليه ضبط النفس أصعب على الفقير؟', ['لأن الضغوط والإغراءات اليومية كتير والمستقبل مش واضح', 'لأنه أقل ذكاء', 'لأنه مش بيحب يحوّش'], 0, 'وده حال أي حد تحت ضغط مستمر.']]},
{r:[189, 193], s:'مشاريع الفقرا صغيرة جدًا ومش مربحة: أغلبها من غير موظفين وأصولها قليلة. العايد على أول دولار ممكن يبقى عالي، بس العايد الكلي للمشروع ضئيل، والمشروع مش بيقدر يكبر لأن الكبر محتاج استثمار كبير مرة واحدة. فريادة الأعمال عند أغلب الفقرا مش موهبة، لكن طريقة للبقاء.',
 q:[['الفرق بين العايد الحدي والعايد الكلي هو...', ['الحدي على دولار زيادة، والكلي على المشروع كله بعد كل التكاليف', 'مفيش فرق', 'الحدي للبنوك والكلي للحكومة'], 0, 'ممكن الدولار الإضافي يكسب كتير والمشروع كله يكسب قليل.'],
    ['متوسط عدد الموظفين في مشاريع الفقرا...', ['قريب من صفر، أغلبهم من غير موظفين', 'حوالي 10', 'أكتر من 50'], 0, 'بيشتغل فيها صاحبها وأسرته.'],
    ['ليه مشاريع الفقرا مش بتكبر؟', ['لأن الكبر محتاج استثمار كبير مرة واحدة فوق قدرتهم', 'لأنهم مش عايزين فلوس', 'لأن الحكومة بتمنع'], 0, 'وده نوع من «الحدبة» اللي صعب يعدّوها.']]},
{r:[193, 199], s:'الفقرا كتير بيفتحوا مشروع عشان «يشتروا وظيفة» لما مش لاقيين شغل، زي دكان باك أوان. وحلم أغلب الأهالي الفقرا إن عيالهم ياخدوا وظيفة حكومية ثابتة، لأن الأمان بيغير طريقة التفكير والادخار والاستثمار في العيال. وبدأ فصل السياسة: أحسن سياسة مش هتنفع لو اتنفذت غلط، زي منح المدارس في أوغندا اللي أغلبها كان بيتسرق.',
 q:[['أكبر حلم عند الأهالي الفقرا لعيالهم حسب الاستطلاعات...', ['وظيفة حكومية ثابتة', 'مشروع خاص كبير', 'السفر برا'], 0, 'الأمان أهم من الثروة.'],
    ['يعني إيه «يشتروا وظيفة»؟', ['يفتحوا مشروع صغير عشان يشغلوا نفسهم لما مش لاقيين شغل', 'يدفعوا رشوة عشان وظيفة', 'يشتروا أسهم في شركة'], 0, 'المشروع هنا بديل للشغل مش حلم ريادي.'],
    ['منح المدارس في أوغندا كانت مشكلتها إيه في الأول؟', ['جزء صغير بس كان بيوصل للمدارس والباقي بيتسرق', 'كانت كبيرة زيادة عن اللزوم', 'كانت بتتصرف على الأكل'], 0, 'ولما الأرقام اتنشرت في الجرايد السرقة قلت جدًا.']]},
{r:[199, 205], s:'أسيموجلو وروبنسون بيقولوا المؤسسات الكبيرة هي اللي بتحدد مصير الدول، وده بيخلي التغيير صعب. المؤلفين أقل تشاؤمًا: تغييرات صغيرة على الهامش بتفرق، زي التصويت الإلكتروني في البرازيل اللي سهّل على الأميين يصوتوا وزوّد الإنفاق على الصحة، والمراجعات المفاجئة اللي قللت الفساد. وتسليم المسؤولية للفقرا نفسهم مش دايمًا بينجح من غير معلومات ودعم.',
 q:[['التصويت الإلكتروني في البرازيل عمل إيه؟', ['سهّل على الأميين يصوتوا صح، والإنفاق على الصحة زاد', 'لغى الانتخابات', 'زود الفساد'], 0, 'تغيير صغير في التفاصيل بأثر كبير.'],
    ['رأي المؤلفين في تغيير المؤسسات...', ['التغييرات الصغيرة على الهامش ممكن تفرق من غير ثورة كاملة', 'لازم ثورة شاملة الأول', 'المؤسسات مش مهمة خالص'], 0, 'عكس تشاؤم أسيموجلو وروبنسون.'],
    ['مين أسيموجلو وروبنسون؟', ['اقتصاديين شايفين إن المؤسسات السياسية هي اللي بتحدد ثروة الدول', 'مؤسسين بنك جرامين', 'أطباء في أودايبور'], 0, 'وهما مؤلفين «لماذا تفشل الأمم».']]},
{r:[205, 210], s:'في بنين، حملات انتخابية مبنية على برامج عامة بدل الوعود العرقية نجحت وماخسرتش أصوات. والسياسة الكويسة ممكن تبقى بداية لسياسة أحسن: حصص الستات في المجالس المحلية في الهند غيّرت نظرة الناس للستات القائدات. بس مش كل حاجة بتنجح: برنامج حضور الممرضات في أودايبور فشل لأن الإدارة نفسها سمحت بالأعذار.',
 q:[['تجربة وانتشيكون في بنين أثبتت إيه؟', ['إن الحملات على برامج عامة ممكن تنجح بدل الاعتماد على الولاء العرقي', 'إن التصويت كله عرقي ومستحيل يتغير', 'إن الانتخابات ملهاش لازمة'], 0, 'المرشحين وافقوا يجربوا في قرى مختارة عشوائيًا.'],
    ['حصص الستات في المجالس المحلية في الهند عملت إيه؟', ['غيّرت نظرة الناس للستات كقيادات مع الوقت', 'مافرقتش خالص', 'اتلغت فورًا'], 0, 'الناخبين بيغيروا رأيهم باللي بيشوفوه.'],
    ['ليه برنامج حضور الممرضات في أودايبور فشل؟', ['لأن الإدارة المحلية سمحت لهم بأعذار وإعفاءات كتير', 'لأن الممرضات استقالوا', 'لأن المراكز اتقفلت'], 0, 'من غير التزام من فوق الرقابة بتفشل.']]},
{r:[210, 218], s:'الخاتمة فيها 5 دروس: (1) الفقرا ناقصهم معلومات مهمة ومصدقين أفكار غلط، (2) شايلين مسؤولية حاجات كتير إحنا بناخدها جاهزة، (3) فيه أسواق غايبة عنهم زي الادخار والتأمين، (4) الدول الفقيرة مش محكوم عليها بالفشل والتغيير الصغير ممكن، (5) التوقعات بتتحول لنبوءات بتحقق نفسها. والرسالة: مفيش حلول سحرية، بس خطوات صغيرة مدروسة ومختبرة بتحرر الناس من مصايد الفقر.',
 q:[['أنهي واحد من دول من دروس الكتاب الخمسة؟', ['التوقعات بتتحول لنبوءات بتحقق نفسها', 'المعونات دايمًا مضرة', 'الفقرا كسالى'], 0, 'لو محدش متوقع منك حاجة بتبطل تحاول.'],
    ['يعني إيه إن الفقرا «بيتحملوا مسؤولية جوانب كتير»؟', ['إن حاجات بتتعمل لنا أوتوماتيك (ميه نظيفة، معاش) هم لازم يعملوها بنفسهم', 'إنهم بيحكموا البلد', 'إنهم بيدفعوا ضرايب أكتر'], 0, 'وكل قرار محتاج إرادة ومجهود.'],
    ['إيه الرسالة الأساسية للكتاب؟', ['الحلول الصغيرة المدروسة والمختبرة ممكن تحرر الناس من مصايد الفقر', 'الفقر مستحيل يتحل', 'لازم نوزع فلوس على الكل ونخلص'], 0, 'افهم المنطق، جرّب، وقيس.']]}
],

{r:[0, 9], s:'الكتاب بيبدأ بقصة رمزية: الرجالة من المريخ والستات من الزهرة، حبوا بعض وعاشوا سعدا لأنهم كانوا عارفين إنهم مختلفين، ولما نزلوا الأرض نسيوا («فقدان ذاكرة اختياري»). مشاكلنا بتيجي من إننا متوقعين الطرف التاني يفكر ويحس زينا. أهل المريخ بيقدّروا القوة والكفاءة والإنجاز، وأهل الزهرة بيقدّروا الحب والتواصل والعلاقات.',
 q:[['إيه سبب أغلب الخلافات بين الرجالة والستات حسب الفصل الأول؟', ['إننا بننسى إننا مختلفين ومتوقعين الطرف التاني يبقى زينا', 'إن الحب بيخلص مع الوقت', 'الفلوس'], 0, 'لما نفتكر الاختلاف بنبطل ناخد الحاجات على نفسنا.'],
    ['أهل المريخ بيقدّروا إيه أكتر حاجة؟', ['القوة والكفاءة والإنجاز', 'الكلام عن المشاعر', 'الجمال والديكور'], 0, 'مفهومهم عن نفسهم بيتحدد بقدرتهم على تحقيق نتايج.'],
    ['أهل الزهرة فكرتهم عن نفسهم بتتحدد بإيه؟', ['مشاعرهم ونوعية علاقاتهم', 'شغلهم ومرتبهم', 'قوتهم البدنية'], 0, 'وبيحسوا بالإشباع بالمشاركة والتواصل.']]},
{r:[9, 19], s:'أكبر غلطتين: الراجل بيلبس «قبعة الخبير» ويقدم حلول وهي عايزة تتسمع بس، والست بتعمل «لجنة تحسين البيت» وتنصحه وتصلحه من غير ما يطلب. لما الست تنصحه بيحس إنها مش واثقة فيه (زي توم لما تاه بالعربية ومارى اقترحت يسأل)، ولما هو يقدم حلول هي بتحس إنه مش سامعها. تمرين الأسبوع: هي تمتنع عن النصيحة من غير طلب، وهو يسمع بنية إنه يفهم بس.',
 q:[['لما توم تاه بالعربية ومارى اقترحت يسأل حد، هو حس بإيه؟', ['إنها مش واثقة في قدرته', 'إنها بتحبه أكتر', 'إنها مهتمة بالوقت'], 0, 'عند المريخي النصيحة من غير طلب معناها «إنت مش قدها».'],
    ['الست لما بتحكي عن مشكلتها غالبًا عايزة إيه؟', ['حد يسمعها ويفهمها مش حلول', 'حل سريع', 'نصيحة من خبير'], 0, 'الكلام نفسه هو اللي بيريحها.'],
    ['تمرين الأسبوع للست كان...', ['تبطل تنصح أو تنتقد من غير ما يتطلب منها', 'تطلب منه حاجات أكتر', 'تحكي عن مشاكلها أكتر'], 0, 'وهو تمرينه يسمع من غير ما يحل.']]},
{r:[19, 32], s:'تحت الضغط الراجل بيدخل «كهفه»: بيسكت ويركز على مشكلة واحدة لحد ما يحلها، أو يشغل نفسه بالأخبار أو الماتش، وبيسمع بحوالي 5% بس من دماغه. والست تحت الضغط محتاجة تتكلم عن كل حاجة مضايقاها، كبيرة وصغيرة، عشان تحس بتحسن، مش عشان تلاقي حلول. وكل طرف بيفسر سلوك التاني غلط: هي فاكراه مش مهتم، وهو فاكرها بتلومه.',
 q:[['لما الراجل يدخل «الكهف» يبقى غالبًا...', ['مشغول بحل مشكلة ومحتاج وقت لوحده', 'زعلان منها شخصيًا', 'مش بيحبها'], 0, 'وهيخرج لوحده لما يلاقي حل أو يرتاح.'],
    ['الست لما تتضايق بتحس بتحسن إزاي؟', ['بالكلام عن مشاعرها ومشاكلها', 'بالسكوت لوحدها', 'بحل المشكلة فورًا'], 0, 'مش مهم ترتيب المشاكل، المهم تتقال.'],
    ['لما الراجل في الكهف يقول «أنا سامعك» هو فعلًا بيسمع بقد إيه؟', ['حوالي 5% بس', '100%', 'النص'], 0, 'وهي محتاجة انتباهه كله.']]},
{r:[32, 38], s:'أهل المريخ والزهرة لقوا السلام لما كل طرف احترم طريقة التاني: هو عرف إن سماعها من غير حلول بيساعدها، وهي عرفت تسيبه في كهفه من غير ما تاخدها على نفسها. وبدأ فصل التحفيز: الراجل بيتحفز لما يحس إنه «محتاج» ومقدَّر، والست بتتحفز لما تحس إنها «معتنى بيها».',
 q:[['الراجل بيتحفز أكتر لما يحس بإيه؟', ['إنه محتاج ومفيد ومقدَّر', 'إنه محاسَب على كل غلطة', 'إن مفيش حاجة مطلوبة منه'], 0, 'لما يحس إنه مش محتاج بيبقى سلبي.'],
    ['الست بتتحفز أكتر لما تحس بإيه؟', ['إنها معتنى بيها ومحبوبة', 'إنها مسؤولة عن كل حاجة', 'إنها أحسن من غيرها'], 0, 'لما تحس بالرعاية بتدي أكتر.'],
    ['إزاي أهل المريخ والزهرة عاشوا في سلام؟', ['احترموا اختلافاتهم', 'بقوا شبه بعض تمامًا', 'كل واحد عاش في كوكبه'], 0, 'الاحترام مش التغيير.']]},
{r:[38, 43], s:'الست اللي بتدي من غير حدود بتتعب وتستاء وتلوم شريكها. الحل مش اللوم، لكن إنها تعرف حدودها وتقول «لأ» وتتعلم «تتلقى». قصة جيم وسوزان: سوزان كانت عايزة تطلق لأنها اديت كتير ومش واخدة، وجيم ماكانش واخد باله. وجوه ستات كتير اعتقاد غلط إنهم مش جديرين ياخدوا.',
 q:[['ليه سوزان كانت عايزة تطلق جيم؟', ['حاسة إنها بتدي كتير ومش واخدة حاجة', 'لأنه بيخونها', 'لأنها بتحب حد تاني'], 0, 'وهو ماكانش يعرف لأنها عمرها ما طلبت.'],
    ['الحل اللي الكتاب بيقدمه للست اللي بتدي كتير...', ['تحدد حدودها وتتعلم تتلقى بدل ما تلوم', 'تدي أكتر', 'تسيب العلاقة فورًا'], 0, 'التوازن مسؤوليتها هي كمان.'],
    ['إيه الاعتقاد الغلط اللي جوه ستات كتير؟', ['إنهم مش جديرين يتلقوا', 'إنهم أقوى من الرجالة', 'إنهم لازم يكسبوا أكتر'], 0, 'فبيعوضوه بالعطاء الزايد.']]},
{r:[43, 53], s:'لما الست تحس إنها تستحق، بتفتح الباب للراجل يدي. والراجل أكبر خوف عنده إنه مش كفاية، فبيتعلم يدي أكتر لما يعرف إن الغلط عادي ومش لازم يعرف كل الإجابات. ثم فصل اللغات المختلفة: الست بتستعمل كلام عام ومبالغ («إنت عمرك ما بتسمعني») للتعبير عن مشاعر، والراجل بياخده حرفيًا كمعلومات فبيجادل.',
 q:[['أكبر خوف عند الراجل حسب الكتاب...', ['إنه مش كفء أو مش كفاية', 'إنه يتجوز', 'إنه يتكلم كتير'], 0, 'فبيركز على النجاح والإنجاز.'],
    ['لما الست تقول «إنت عمرك ما بتسمعني» تقصد إيه غالبًا؟', ['إنها محبطة ومحتاجة اهتمام دلوقتي', 'إنه فعلًا عمره ما سمعها', 'إنها عايزة تنهي العلاقة'], 0, '«عمرك» هنا مشاعر مش إحصائية.'],
    ['ليه الراجل بيجادل في كلام الست؟', ['لأنه بياخد كلامها حرفيًا كمعلومات مش كمشاعر', 'لأنه بيحب الخناق', 'لأنها بتكذب'], 0, 'محتاج «مترجم».']]},
{r:[53, 66], s:'قاموس الزهرة/المريخ: كل شكوى ليها ترجمة. «إحنا مابنخرجش أبدًا» = «نفسي نخرج سوا». «محدش بيسمعني» = «محتاجة انتباهك النهارده». «إنت مابقتش بتحبني» = «محتاجة أطمن إنك بتحبني». ولما الراجل يسكت ويدخل كهفه، الست مش المفروض تحاول تطلّعه بالعافية (حكاية التنين): استنيه وهيرجع.',
 q:[['«إحنا مابنخرجش أبدًا» ترجمتها بالمريخي...', ['نفسي نخرج ونعمل حاجة سوا', 'إنت مقصّر وفاشل', 'مش عايزة أخرج تاني'], 0, 'طلب، مش اتهام.'],
    ['حكاية «التنين» بتنصح الست بإيه؟', ['ماتدخلش كهف الراجل وماتحاولش تخليه يتكلم قبل ما يبقى مستعد', 'تطارده لحد ما يتكلم', 'تزعل منه'], 0, 'لو دخلتي الكهف هتتحرقي من التنين.'],
    ['«إنت مابقتش بتحبني» غالبًا معناها...', ['محتاجة أطمن على حبك النهارده', 'العلاقة خلصت', 'إنت خاين'], 0, 'والرد الصح: «بحبك».']]},
{r:[66, 77], s:'القاموس العكسي: لما الراجل يقول «أنا تمام» أو «مفيش حاجة» يقصد إنه قادر يتعامل لوحده ومش محتاج أسئلة. أحسن مساندة للراجل في الكهف إنك تثقي فيه وتعملي حاجة تبسطك، ومتواسيهوش أو تساعديه من غير طلب لأن ده بيحسسه إنك مش واثقة فيه.',
 q:[['لما الراجل يقول «مفيش حاجة» يقصد غالبًا...', ['فيه حاجة بس يقدر يحلها لوحده، فماتسأليش أسئلة كتير', 'مفيش أي حاجة خالص', 'محتاج تسأليه كتير'], 0, 'الأسئلة بتطوّل وقت الكهف.'],
    ['إيه أحسن طريقة تساندي بيها راجل في كهفه؟', ['تثقي فيه وتشغلي نفسك بحاجة تبسطك لحد ما يخرج', 'تطارديه وتسأليه', 'تقدمي له نصايح'], 0, 'كل ما ضغطتي أكتر كل ما الوقت طال.'],
    ['المساعدة من غير طلب بتحسس الراجل بإيه؟', ['إنها مش واثقة فيه', 'إنه محبوب جدًا', 'إنه مدين لها'], 0, 'وكأنها بتعامله كطفل.']]},
{r:[77, 81], s:'الرعاية الزايدة (زي أسئلة بوني عن ميعاد الطيارة) بتخنق الراجل. والراجل لما يدخل كهفه يقدر يطمّن الست بجملة بسيطة: «محتاج وقت أفكر، وهرجع». والراجل لازم يتعلم يسمع الست من غير ما يحس إنه ملوم، لأن كلامها عن مشاعرها مش اتهام ليه.',
 q:[['إيه الجملة اللي تطمّن الست لما الراجل ينسحب؟', ['«محتاج وقت أفكر، وهرجع»', '«مش عايز أتكلم معاكي»', '«سيبيني لوحدي»'], 0, 'لأنها من غيرها بتسمع «أنا مش بحبك».'],
    ['لما الست تتكلم عن مشاعرها وهي متضايقة، ده معناه...', ['إنها محتاجة تتسمع، مش إنها بتلومه', 'إنها بتتهمه', 'إنها عايزة خناقة'], 0, 'لو حس باللوم هيقطع الاتصال.'],
    ['أسئلة بوني الكتير قبل سفر جراي كانت مثال على...', ['الرعاية الزايدة اللي بتضايق الراجل', 'الحب الصح', 'عدم الاهتمام'], 0, 'هو حس إنها مش واثقة إنه هيلحق الطيارة.']]},
{r:[81, 87], s:'الرجالة زي «الأستك»: بيقربوا جدًا، وبعدين محتاجين يبعدوا شوية عشان يحسوا باستقلالهم، وبعدين يرجعوا بشوق أكبر. ده مش رفض ولا ملل. ماجي فكرت إن جيف بطّل يحبها لما بعد، والحقيقة إنه في دورة الأستك. ولو الست طاردته أو عاقبته، الأستك مش هيرجع.',
 q:[['«الأستك» يعني إيه في الكتاب؟', ['دورة الراجل: يقرب، يبعد شوية، يرجع بشوق أكبر', 'الراجل بيهرب نهائيًا', 'الراجل بيتغير كل يوم'], 0, 'الانسحاب جزء من القرب عنده.'],
    ['ليه الراجل بيبعد بعد فترة قرب؟', ['عشان يشبع احتياجه للاستقلال وبعدين يرجع', 'لأنه زهق منها', 'لأنه بيحب واحدة تانية'], 0, 'بعدها بيرجع لوحده.'],
    ['لو الست طاردته وهو بيبعد...', ['الأستك مش هيلاقي فرصة يرجع ويشتاق', 'هيرجع أسرع', 'مش هيفرق'], 0, 'سيبيه يبعد عشان يقدر يرجع.']]},
{r:[87, 92], s:'الراجل بيبعد أحيانًا بالظبط لما الست عايزة تقرب وتتكلم. أحسن طريقة الست تخليه يتكلم إنها هي تبدأ بالحكي من غير ما تطالبه، وتقدّر سماعه. ساندرا ولاري: 20 سنة جواز وهي بتطارد وهو بيبعد. وليزا وجيم: لازقين في بعض فمابيبعدش أبدًا، فبقى عصبي ومكتئب.',
 q:[['إزاي الست تخلي الراجل يتكلم؟', ['تبدأ هي بالحكي وتقدّر سماعه من غير ما تطالبه يتكلم', 'تسأله أسئلة كتير', 'تفضل ساكتة لحد ما يتكلم'], 0, 'مع الوقت هيلاقي حاجة يقولها.'],
    ['مشكلة ليزا وجيم كانت...', ['إنهم بيعملوا كل حاجة مع بعض ومابيبعدش أبدًا فاتضايق', 'إنه مسافر دايمًا', 'إنهم مابيتكلموش'], 0, 'الأستك ماخدش فرصته.'],
    ['ساندرا كانت عايزة الطلاق لأن...', ['حاسة إن لاري بارد ومش بيتكلم عن مشاعره', 'لاري بيصرف كتير', 'لاري بيخونها'], 0, 'وهو كان عايز يصلح بس مش عارف إزاي.']]},
{r:[92, 98], s:'الست ممكن تعطّل دورة الأستك بطريقتين: إنها تطارده لما يبعد، أو تعاقبه لما يرجع. والراجل الحكيم يسمع لما الست تتكلم ويطمّنها. ثم الفصل السابع: الست زي «الموجة»: إحساسها بنفسها بيطلع وينزل، ولما توصل للقاع («البير») مش محتاجة حد يصلحها، محتاجة حد يفضل جنبها لحد ما تطلع.',
 q:[['الست «زي الموجة» يعني...', ['إحساسها بنفسها بيطلع وينزل بشكل طبيعي', 'مزاجها ثابت دايمًا', 'بتحب البحر'], 0, 'وده مش مشكلة محتاجة تتصلح.'],
    ['لما الست تبقى في «البير» محتاجة إيه؟', ['حد يفضل جنبها ويسمعها من غير ما يحاول يصلحها', 'حلول عملية', 'تفضل لوحدها'], 0, 'بعد ما توصل للقاع بتطلع لوحدها.'],
    ['الطريقتين اللي الست ممكن تعطل بيهم الأستك...', ['تطارده لما يبعد وتعاقبه لما يرجع', 'تسافر وترجع', 'تشتكي لأهلها'], 0, 'الاتنين بيوقفوا دورة القرب.']]},
{r:[98, 102], s:'لما الست تطلع من البير بتبقى لطيفة تاني، بس ده مش معناه إن المشكلة اتحلت؛ هي هتطلع وتنزل تاني. توم وسوزان: هو طمّنها مرة وافتكر خلاص، وهي محتاجة طمأنة كل ما تنزل. والست محتاجة تحس بالأمان وهي في البير، وإلا هتكتم مشاعرها.',
 q:[['لما الست تبقى لطيفة تاني بعد البير ده معناه...', ['إنها طلعت من الموجة، مش إن كل مشاكلها اتحلت', 'إن المشكلة مش هتيجي تاني أبدًا', 'إنها بتمثل'], 0, 'الموجة هتيجي تاني وده طبيعي.'],
    ['توم فهم غلط إيه في سوزان؟', ['افتكر إن طمأنتها مرة واحدة كفاية', 'افتكر إنها بتحب حد تاني', 'افتكر إنها عايزة فلوس'], 0, 'الطمأنة محتاجة تتكرر.'],
    ['لو الست ماحستش بالأمان في البير هتعمل إيه؟', ['هتتظاهر إن كل حاجة تمام وتكتم مشاعرها', 'هتتكلم أكتر', 'هتسافر'], 0, 'والكتمان بيقتل القرب.']]},
{r:[102, 116], s:'لو الراجل مش قادر يسمع وهو تعبان، يقول بأدب إنه محتاج وقت ويرجع. والفلوس مش بتلغي الموجة (كريس وبام). ثم الفصل التامن: الست محتاجة 6 حاجات: اهتمام، تفهّم، احترام، إخلاص، تقدير لمشاعرها، طمأنة. والراجل محتاج: ثقة، قبول، تقدير، إعجاب، موافقة، تشجيع. وكل واحد بيدي اللي هو محتاجه مش اللي التاني محتاجه.',
 q:[['من احتياجات الست الأساسية...', ['الاهتمام والتفهم والطمأنة', 'الثقة والإعجاب والموافقة', 'الفلوس والهدايا'], 0, 'والتلاتة التانيين: احترام، إخلاص، تقدير لمشاعرها.'],
    ['من احتياجات الراجل الأساسية...', ['الثقة والقبول والتقدير', 'الطمأنة والتفهم', 'الكلام الكتير'], 0, 'والتلاتة التانيين: إعجاب، موافقة، تشجيع.'],

  "If you have to raise something hard today, surround it with warmth: appreciation first, the issue second, affection after.": "لو لازم تفتحي موضوع صعب النهارده، حاوطيه بدفا: تقدير الأول، الموضوع تاني، وحنية بعدها.",
  "Gottman found contempt (eye-rolling, mockery, superiority) to be the strongest predictor of divorce among his “Four Horsemen”: criticism, contempt, defensiveness and stonewalling.": "جوتمان لقى إن الاحتقار (تقليب العين، التريقة، التعالي) أقوى مؤشر للطلاق من «الفرسان الأربعة»: النقد، الاحتقار، الدفاعية، والتجاهل.",
  "Complain about the behaviour, not the person: “I felt alone when you were on your phone” instead of “You never care.”": "اشتكي من التصرف، مش من الشخص: «حسيت إني لوحدي لما كنت على الموبايل» بدل «انت عمرك ما بتهتم.»",
  "Couples still together six years later had “turned toward” each other’s small bids for attention about 86% of the time; couples who divorced, about 33%.": "الأزواج اللي فضلوا مع بعض بعد ست سنين كانوا بيستجيبوا لمحاولات الاهتمام الصغيرة من بعض حوالي 86% من الوقت؛ واللي اتطلقوا حوالي 33%.",
  "When someone you love shares something small, a meme, a thought, a sigh, turn toward it. Small moments build the marriage.": "لما حد بتحبيه يشاركك حاجة صغيرة، ميم، فكرة، تنهيدة، اهتمي بيها. اللحظات الصغيرة هي اللي بتبني الجواز.",
  "People with a growth mindset believe ability is built through effort and learning; they see failure as information, not identity.": "اللي عندهم عقلية النمو مؤمنين إن القدرة بتتبني بالمجهود والتعلم؛ وشايفين الفشل معلومة، مش هوية.",
  "Add “yet” to one sentence today: “I’m not good at email campaigns, yet.”": "زودي «لسه» على جملة النهارده: «أنا مش شاطرة في حملات الإيميل، لسه.»",
  "Duckworth’s research found passion plus long-term perseverance often predicts achievement better than talent alone.": "أبحاث داكوورث لقت إن الشغف مع المثابرة على المدى الطويل غالبًا بيتوقعوا النجاح أحسن من الموهبة لوحدها.",
  "Choose one long-term goal and show up for it today, especially if you’re bored. Boredom is where most people quit.": "اختاري هدف طويل واحد واشتغلي عليه النهارده، خصوصًا لو زهقانة. الزهق هو المكان اللي أغلب الناس بتبطل فيه.",
  "We have a fast, emotional System 1 and a slow, deliberate System 2. Most bad decisions are fast ones that deserved slow thinking.": "عندنا نظام 1 سريع وعاطفي، ونظام 2 بطيء ومتأني. أغلب القرارات الوحشة كانت سريعة وكانت محتاجة تفكير بطيء.",
  "For any decision over a few thousand pounds or a big life choice, sleep on it once before saying yes.": "أي قرار فوق كام ألف جنيه أو اختيار كبير في حياتك، نامي عليه ليلة قبل ما تقولي آه.",
  "Loss aversion: losing something feels roughly twice as painful as gaining the same thing feels good.": "النفور من الخسارة: إنك تخسري حاجة بيوجع تقريبًا ضعف فرحتك لو كسبتيها.",
  "When an investment dips, remember the pain is louder than the facts. Don’t make money decisions on a scary day.": "لما استثمار ينزل، افتكري إن الوجع صوته أعلى من الحقايق. متاخديش قرارات فلوس في يوم مخوّف.",
  "“Everything can be taken from a man but one thing: the last of the human freedoms, to choose one’s attitude in any given set of circumstances.”": "«كل حاجة ممكن تتاخد من الإنسان إلا حاجة واحدة: آخر حرياته، إنه يختار موقفه في أي ظروف.»",
  "You can’t control every part of today, but you can choose how you meet it. Choose on purpose.": "مش هتقدري تتحكمي في كل حاجة النهارده، بس تقدري تختاري هتقابليه إزاي. اختاري عن قصد.",
  "Brown’s research found vulnerability is the birthplace of connection, courage and creativity, not weakness.": "أبحاث براون لقت إن الضعف الإنساني هو أصل التواصل والشجاعة والإبداع، مش ضعف.",
  "Say the honest thing today, kindly: ask for help, admit you’re tired, tell someone you miss them.": "قولي الحاجة الصادقة النهارده بلطف: اطلبي مساعدة، اعترفي إنك تعبانة، قولي لحد إنه وحشك.",
  "Focus on your circle of influence (what you can act on), not your circle of concern (everything you worry about).": "ركزي على دايرة تأثيرك (اللي تقدري تعملي فيه حاجة)، مش دايرة قلقك (كل حاجة بتقلقك).",
  "Write your worry, then circle the one part you can act on today. Do that part; release the rest.": "اكتبي اللي قلقك، وعلّمي على الجزء الوحيد اللي تقدري تعملي فيه حاجة النهارده. اعمليه؛ وسيبي الباقي.",
  "Begin with the end in mind: imagine who you want to be at the end, then plan backwards.": "ابدئي والنهاية في دماغك: تخيلي عايزة تبقي مين في الآخر، وخططي بالعكس.",
  "Picture yourself one year after your wedding. What habits does that woman have? Start one of them this week.": "تخيلي نفسك بعد الفرح بسنة. الست دي عندها عادات إيه؟ ابدئي واحدة منها الأسبوع ده.",
  "Become genuinely interested in other people. A person’s own name is, to them, the sweetest sound.": "اهتمي بالناس بجد. اسم الواحد هو أحلى صوت بالنسباله.",
  "Use people’s names today and ask one follow-up question about something they care about.": "نادي الناس بأساميهم النهارده واسألي سؤال متابعة عن حاجة تهمهم.",
  "The former FBI negotiator recommends labelling emotions (“It seems like…”) and asking “how” and “what” questions instead of saying no.": "المفاوض السابق في الـ FBI بينصح إنك تسمّي المشاعر («شكلك…») وتسألي بـ«إزاي» و«إيه» بدل ما تقولي لأ.",
  "When an offer is too low, try: “How am I supposed to do that?” Then stay quiet and let them answer.": "لما العرض يبقى قليل أوي، جربي: «المفروض أعمل ده إزاي؟» وبعدين اسكتي وسيبيهم يردوا.",
  "In Babcock’s study of graduates, far more men than women negotiated their first salary (57% vs 7%), a gap that compounds over a career.": "في دراسة بابكوك على الخريجين، الرجالة فاوضوا على أول مرتب أكتر بكتير من الستات (57% قصاد 7%)، وده فرق بيكبر على مدار الشغل كله.",
  "Never accept a first offer without asking for more. The worst answer is usually just “no”.": "عمرك ما توافقي على أول عرض من غير ما تطلبي أكتر. أوحش رد غالبًا هيبقى «لأ» بس.",
  "Focused work without distraction produces far more value than scattered hours of shallow work.": "الشغل المركز من غير تشتيت بيطلع قيمة أكتر بكتير من ساعات متقطعة من الشغل السطحي.",
  "Block 60 minutes today with your phone in another room for your most important task.": "احجزي 60 دقيقة النهارده والموبايل في أوضة تانية لأهم تاسك عندك.",
  "If it isn’t a clear yes, then it’s a clear no. Saying no to the good makes room for the great.": "لو مش آه واضحة، يبقى لأ واضحة. إنك تقولي لأ للكويس بيفضّي مكان للأحسن.",
  "Say no to one thing this week that you’d only half-want to do.": "قولي لأ لحاجة واحدة الأسبوع ده انتي عايزاها نص نص.",
  "Don’t take anything personally: what others say and do is mostly about their own world.": "متاخديش حاجة على نفسك: اللي الناس بتقوله وبتعمله غالبًا عن دنيتهم هما.",
  "If someone is rude today, let it be their story, not yours.": "لو حد كان قليل الذوق النهارده، خليها حكايته هو، مش حكايتك.",
  "Seneca wrote that we suffer more often in imagination than in reality.": "سينيكا كتب إننا بنتعذب في خيالنا أكتر ما بنتعذب في الحقيقة.",
  "When you catch yourself picturing the worst, ask: is this happening, or am I rehearsing it?": "لما تلاقي نفسك بتتخيلي الأسوأ، اسألي: ده بيحصل فعلًا، ولا أنا بتمرّن عليه؟",
  "Some things are within our control (our choices, effort, attitude) and some are not (others’ opinions, outcomes). Peace comes from knowing the difference.": "في حاجات في إيدينا (اختياراتنا، مجهودنا، موقفنا) وحاجات لأ (آراء الناس، النتايج). الراحة بتيجي من إنك تعرفي الفرق.",
  "Sort today’s stress into two lists: mine and not mine. Spend energy only on the first.": "قسمي ضغط النهارده لليستتين: بتاعي ومش بتاعي. اصرفي طاقتك على الأولى بس.",
  "Kiyosaki defines an asset as something that puts money in your pocket and a liability as something that takes money out.": "كيوساكي بيعرّف الأصل إنه حاجة بتحط فلوس في جيبك، والالتزام إنه حاجة بتطلع فلوس منه.",
  "Before a big purchase, like a car, list its monthly costs: fuel, insurance, maintenance. Budget for the real price.": "قبل أي حاجة كبيرة زي العربية، اكتبي مصاريفها الشهرية: بنزين، تأمين، صيانة. اعملي ميزانية للسعر الحقيقي.",
  "Pay yourself first: keep at least a tenth of everything you earn before paying anyone else.": "ادفعي لنفسك الأول: خلي على الأقل عُشر اللي بتكسبيه ليكي قبل ما تدفعي لأي حد.",
  "On payday, move your saving and investing amount first, then live on the rest.": "يوم القبض، حوّلي مبلغ التحويش والاستثمار الأول، وعيشي بالباقي.",
  "This study has followed people for over 80 years. Its clearest finding: good relationships keep us happier and healthier than money or fame.": "الدراسة دي متابعة ناس من أكتر من 80 سنة. أوضح نتيجة فيها: العلاقات الحلوة بتخلينا أسعد وأصح من الفلوس والشهرة.",
  "Invest in one relationship today: call your mom, plan a date, reply to a friend you’ve been meaning to.": "استثمري في علاقة واحدة النهارده: كلمي مامتك، خططي لخروجة، أو ردي على صاحبتك اللي كان نفسك تردي عليها.",
  "People who regularly wrote down things they were grateful for reported more optimism and better wellbeing than those who didn’t.": "اللي كانوا بيكتبوا الحاجات اللي ممتنين لها بانتظام كانوا أكتر تفاؤلًا وأحسن حالًا من اللي مكانوش بيكتبوا.",
  "Answer one of today’s diary questions with three specific things you’re grateful for.": "جاوبي سؤال من أسئلة اليوميات النهارده بتلات حاجات محددة انتي ممتنة لها.",
  "Spending on experiences tends to bring more lasting happiness than spending on things, partly because we adapt to things quickly.": "الصرف على التجارب غالبًا بيجيب سعادة بتدوم أكتر من الصرف على الحاجات، جزء من السبب إننا بنتعود على الحاجات بسرعة.",
  "Next time you want to treat yourself, consider an experience from your list instead of an item.": "المرة الجاية لما تحبي تدلعي نفسك، فكري في تجربة من ليستتك بدل حاجة تشتريها.",
  "People are more likely to start new goals at “temporal landmarks”: a Monday, a new month, a birthday.": "الناس بتبدأ أهداف جديدة أكتر عند «علامات الوقت»: يوم اتنين، شهر جديد، عيد ميلاد.",
  "Use the next landmark on purpose. Decide now what you’ll start on the 1st of the month.": "استغلي العلامة الجاية عن قصد. قرري دلوقتي هتبدئي إيه يوم 1 في الشهر.",
  "Plans in the form “When X happens, I will do Y” make people far more likely to follow through.": "الخطط اللي على شكل «لما يحصل كذا، هعمل كذا» بتخلي الناس تكمّل أكتر بكتير.",
  "Write one: “When I finish lunch, I will read 5 pages.”": "اكتبي واحدة: «لما أخلص الغدا، هقرا 5 صفحات.»",
  "In experiments, people greatly overestimated how much others noticed their appearance or mistakes.": "في التجارب، الناس بالغوا جدًا في تقدير قد إيه غيرهم واخد باله من شكلهم أو غلطاتهم.",
  "Wear the outfit, ask the question, post the idea. People are thinking about themselves, not you.": "البسي الطقم، اسألي السؤال، انشري الفكرة. الناس بتفكر في نفسها، مش فيكي.",
  "Research shows that treating yourself kindly after a mistake increases motivation to improve, rather than making you lazy.": "الأبحاث بتقول إنك لما تعاملي نفسك بحنية بعد غلطة، بيزيد حماسك تتحسني، مش بيكسّلك.",
  "Talk to yourself today the way you’d talk to your best friend after a bad day.": "كلمي نفسك النهارده زي ما بتكلمي أقرب صاحبة ليكي بعد يوم وحش.",
  "Work expands to fill the time available for its completion.": "الشغل بيتمط عشان يملا الوقت المتاح له.",
  "Give your next task a shorter deadline than feels comfortable, and watch it shrink to fit.": "ادي التاسك الجاي ديدلاين أقصر من المريح، وشوفيه بيصغر عشان يلحق.",
  "Roughly 80% of results often come from 20% of efforts.": "تقريبًا 80% من النتايج غالبًا بتيجي من 20% من المجهود.",
  "Which 20% of your work brings most of your results? Do that first today.": "أنهي 20% من شغلك بتجيب أغلب نتايجك؟ اعمليها الأول النهارده.",
  "In a famous study, shoppers offered 6 jams were about 10 times more likely to buy than those offered 24.": "في دراسة مشهورة، الناس اللي اتعرض عليهم 6 أنواع مربى اشتروا حوالي 10 أضعاف اللي اتعرض عليهم 24.",
  "Reduce your options to decide faster: two outfits, three dinner choices, one course at a time.": "قللي اختياراتك عشان تقرري أسرع: طقمين، تلات اختيارات للعشا، كورس واحد في المرة.",

  "Investing": "استثمار", "Economics": "اقتصاد", "Politics": "سياسة", "Health": "صحة", "Jobs": "شغل", "Countries": "بلاد", "Top countries": "البلاد الأولى", "Women": "الستات", "Psychology": "علم نفس",

  // ---------- facts ----------
  "Rule of 72: divide 72 by your yearly return to estimate how many years it takes money to double. At 12% a year, about 6 years.": "قاعدة الـ72: اقسمي 72 على العائد السنوي عشان تعرفي الفلوس هتتضاعف في كام سنة. بـ12% في السنة، حوالي 6 سنين.",
  "Investing 1,000 EGP a month at 15% a year for 20 years grows to roughly 1.5 million EGP before inflation, from 240,000 EGP put in. Time does most of the work.": "لو استثمرتي 1,000 جنيه في الشهر بـ15% في السنة لمدة 20 سنة، هتوصل لحوالي 1.5 مليون جنيه قبل التضخم، من 240,000 جنيه بس حطيتيهم. الوقت بيعمل أغلب الشغل.",
  "Over 15 years or more, the large majority of actively managed US stock funds have done worse than the simple S&P 500 index, according to S&P’s SPIVA reports.": "على مدى 15 سنة أو أكتر، أغلب صناديق الأسهم الأمريكية المُدارة كانت أوحش من مؤشر S&P 500 البسيط، حسب تقارير SPIVA.",
  "A 1% yearly fee sounds small, but over 30 years it can eat about a quarter of your final returns. Always check fees.": "رسوم 1% في السنة شكلها صغيرة، بس على 30 سنة ممكن تاكل حوالي ربع أرباحك. دايمًا بصي على الرسوم.",
  "Investing a fixed amount on a schedule, called dollar-cost averaging, means you buy more when prices are low and less when they’re high, without guessing.": "إنك تستثمري مبلغ ثابت في مواعيد ثابتة (متوسط التكلفة) معناه إنك بتشتري أكتر لما الأسعار تنزل وأقل لما تطلع، من غير تخمين.",
  "Many of the stock market’s best days come right after its worst ones. People who sell in panic often miss the recovery.": "أحسن أيام البورصة كتير بتيجي بعد أوحش أيامها على طول. اللي بيبيعوا من الخضة غالبًا بيفوتهم الرجوع.",
  "Gold has long been a store of value when currencies lose value, but it pays no interest or dividends. It protects wealth more than it grows it.": "الدهب من زمان مخزن للقيمة لما العملات تقل قيمتها، بس مش بيدي فايدة ولا أرباح. بيحمي الثروة أكتر ما بيكبّرها.",
  "The EGX30 is the main index of the Egyptian Exchange, tracking 30 of its largest and most traded companies.": "EGX30 هو المؤشر الرئيسي للبورصة المصرية، وبيتابع أكبر 30 شركة وأكترهم تداول.",
  "Your real return is your return minus inflation. A 20% certificate during 25% inflation still loses buying power.": "عائدك الحقيقي هو العائد ناقص التضخم. شهادة بـ20% وقت تضخم 25% لسه بتخسّرك قوة شرائية.",
  "Money you’ll need within 3 to 5 years usually belongs somewhere safer than stocks, because markets can drop sharply in the short term.": "الفلوس اللي هتحتاجيها في خلال 3 لـ 5 سنين مكانها غالبًا حاجة أأمن من الأسهم، لأن السوق ممكن ينزل جامد في المدى القصير.",
  "When inflation is high, central banks usually raise interest rates. Borrowing gets more expensive, saving gets more attractive and spending slows.": "لما التضخم يعلى، البنوك المركزية غالبًا بترفع الفايدة. السلف بيغلى، والتحويش بيبقى أحلى، والصرف بيهدى.",
  "Egypt’s main sources of foreign currency include remittances from Egyptians working abroad, Suez Canal fees, tourism and exports.": "أهم مصادر العملة الصعبة في مصر: تحويلات المصريين بره، رسوم قناة السويس، السياحة، والتصدير.",
  "Roughly 12% of global trade passes through the Suez Canal, which makes shipping disruptions in the Red Sea felt worldwide.": "حوالي 12% من التجارة العالمية بتعدي من قناة السويس، عشان كده أي مشكلة شحن في البحر الأحمر العالم كله بيحس بيها.",
  "When a currency is devalued, imports get more expensive and exports get cheaper for foreign buyers.": "لما العملة تتعوم، الاستيراد بيغلى والتصدير بيرخص على المشتري الأجنبي.",
  "The US dollar is on one side of about 88% of all currency trades in the world, according to the Bank for International Settlements (2022).": "الدولار الأمريكي طرف في حوالي 88% من كل تداولات العملات في العالم، حسب بنك التسويات الدولية (2022).",
  "GDP is the total value of everything a country produces in a year. A common rule of thumb defines a recession as two quarters in a row of shrinking GDP.": "الناتج المحلي هو قيمة كل اللي البلد بتنتجه في سنة. والقاعدة المشهورة إن الركود هو ربعين سنة ورا بعض الناتج فيهم بيقل.",
  "A tariff is a tax on imports. It’s usually paid by the importing company and passed on to shoppers as higher prices.": "التعريفة الجمركية ضريبة على الاستيراد. غالبًا الشركة المستوردة بتدفعها وبتحمّلها على الناس في الأسعار.",
  "The US has the world’s largest economy measured in dollars; China’s is the largest when adjusted for local prices (purchasing power parity).": "أمريكا عندها أكبر اقتصاد في العالم بالدولار؛ والصين الأكبر لو حسبناها بالأسعار المحلية (تعادل القوة الشرائية).",
  "The UN Security Council has 5 permanent members with veto power: the US, UK, France, Russia and China.": "مجلس الأمن فيه 5 أعضاء دايمين معاهم الفيتو: أمريكا، بريطانيا، فرنسا، روسيا، والصين.",
  "The European Union has 27 member countries since the UK left in 2020.": "الاتحاد الأوروبي فيه 27 دولة من ساعة ما بريطانيا خرجت في 2020.",
  "In 2024 the BRICS group expanded beyond Brazil, Russia, India, China and South Africa to include Egypt, Ethiopia, Iran and the UAE.": "في 2024 مجموعة البريكس كبرت عن البرازيل وروسيا والهند والصين وجنوب أفريقيا، ودخلت فيها مصر وإثيوبيا وإيران والإمارات.",
  "IMF loans usually come with conditions, such as cutting subsidies or letting the currency float, which is why they often shape a country’s prices.": "قروض صندوق النقد غالبًا بييجي معاها شروط، زي تقليل الدعم أو تعويم العملة، عشان كده بتأثر على أسعار البلد.",
  "Rwanda has the highest share of women in parliament of any country, with women holding more than 60% of seats in its lower house.": "رواندا عندها أعلى نسبة ستات في البرلمان في العالم، الستات واخدين أكتر من 60% من مقاعد مجلس النواب.",
  "A 2023 US Surgeon General report compared the health risks of chronic loneliness to smoking up to 15 cigarettes a day.": "تقرير أمريكي في 2023 قارن أضرار الوحدة المزمنة على الصحة بإنك تشربي لحد 15 سيجارة في اليوم.",
  "Large studies link walking around 7,000 steps a day to a much lower risk of early death; you don’t need 10,000 for most of the benefit.": "دراسات كبيرة ربطت المشي حوالي 7,000 خطوة في اليوم بخطر أقل بكتير للوفاة بدري؛ مش محتاجة 10,000 عشان تاخدي أغلب الفايدة.",

  try { nat = window.__NATIVE_STATE__ || null; } catch(e){}
  const pick = (nat && (!local || (nat.savedAt || 0) >= (local.savedAt || 0))) ? nat : local;
  if (pick && typeof pick === 'object') S = merge(DEF(), pick);
  if (!Array.isArray(S.habits) || !S.habits.length) S.habits = JSON.parse(JSON.stringify(DEFAULT_HABITS));

function merge(base, src){
  for (const k in src){
    if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) base[k] = merge(base[k], src[k]);
    else base[k] = src[k];
  }
  return base;
}
function native(){ try { return window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.app; } catch(e){ return null; } }

function hearts(x, y){
  if (x == null || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const g = ['♥','✦','♥','❀'], c = ['var(--rose)','var(--gold)','var(--lilac)','var(--mint)'];
  for (let i = 0; i < 12; i++){
    const h = document.createElement('span'); h.className = 'heart'; h.textContent = g[i % 4];
    const a = Math.random() * Math.PI * 2, r = 40 + Math.random() * 60;
    h.style.left = x + 'px'; h.style.top = y + 'px'; h.style.color = c[i % 4];
    h.style.setProperty('--dx', Math.cos(a) * r + 'px'); h.style.setProperty('--dy', Math.sin(a) * r - 30 + 'px'); h.style.setProperty('--r', (Math.random() * 120 - 60) + 'deg');
    document.body.appendChild(h); setTimeout(() => h.remove(), 950);
  }
}

function confetti(canvas){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const dpr = devicePixelRatio || 1, ctx = canvas.getContext('2d'), W = canvas.width = innerWidth * dpr, H = canvas.height = innerHeight * dpr;
  const cols = ['#ff5c8f','#ffb48f','#b9a3ff','#3fbf8f','#ffd166','#7cc4ff'];
  const ps = Array.from({length:140}, () => ({x:W / 2, y:H * .45, vx:(Math.random() - .5) * 26 * dpr, vy:(-Math.random() * 22 - 6) * dpr, s:(5 + Math.random() * 7) * dpr, c:cols[Math.floor(Math.random() * cols.length)], r:Math.random() * 6, vr:(Math.random() - .5) * .3, h:Math.random() < .3}));
  let t = 0;
  (function frame(){
    if (!canvas.isConnected) return;
    ctx.clearRect(0, 0, W, H); t++;
    ps.forEach(p => { p.vy += .55 * dpr; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.h){ ctx.font = (p.s * 2) + 'px serif'; ctx.fillText('♥', 0, 0); } else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore(); });
    if (t < 220) requestAnimationFrame(frame);
  })();
}
function celebrate(o){
  if (o.key){ if (S.celebrated[o.key]) return; S.celebrated[o.key] = Date.now(); save(); }
  if (S.settings.celebrate === false){ toast(o.title); return; }
  $$('.overlay.celebration').forEach(x => x.remove());
  const ov = document.createElement('div'); ov.className = 'overlay celebration'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
  ov.innerHTML = '<canvas class="confetti"></canvas><div class="ocard"><div class="big">' + o.e + '</div><h2>' + esc(o.title) + '</h2><p>' + esc(o.msg) + '</p>' + (o.reward ? '<div class="adv"><b>Your reward</b>' + esc(o.reward) + '</div>' : '') + '<button class="btn full" style="background:var(--rose)">Yay, thank you ♡</button></div>';
  document.body.appendChild(ov);
  confetti($('canvas', ov));
  const close = () => ov.remove();
  $('button', ov).onclick = close; ov.onclick = e => { if (e.target === ov) close(); };
}
const MILESTONES = [3, 7, 14, 21, 30, 45, 60, 90, 100, 150, 200, 365];
const habitDone = (id, day) => !!(S.hlog[day] && S.hlog[day][id]);
function streakOf(id){ let n = 0; const d = new Date(); if (!habitDone(id, ymd(d))) d.setDate(d.getDate() - 1); for (let i = 0; i < 400 && habitDone(id, ymd(d)); i++){ n++; d.setDate(d.getDate() - 1); } return n; }

/* ============ reminders (scheduled by the iPhone app) ============ */
function buildReminders(){
  const R = S.settings.rem, now = new Date(), once = [], repeat = [];
  const at = (d, h, m) => { const x = new Date(d); x.setHours(h, m, 0, 0); return x; };
  const iso = d => ymd(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  const push = (id, title, body, when) => { if (when > now) once.push({id, title, body, at:iso(when)}); };
  if (R.water) [11,13,16,19].forEach(h => repeat.push({id:'water-' + h, title:'Water break \u{1F4A7}', body:'Have a glass of water and tap it in Monmon’s Life.', hour:h, minute:0}));
  if (R.diary){
    repeat.push({id:'diary-0', title:'Diary time, Monmon ♡', body:'How was today? Pick your mood and answer today’s 3 questions.', hour:0, minute:0});
  }
  if (R.checkin) repeat.push({id:'checkin', title:'Evening check-in ✨', body:'Tick your habits, log your spending and what you did today.', hour:22, minute:0});
  if (R.money){
    const amt = S.settings.invest ? money(S.settings.invest) : 'your monthly amount';
    repeat.push({id:'invest', title:'New month: invest \u{1F4B0}', body:'Add ' + amt + ' to your investments this month.', day:1, hour:10, minute:0});
    repeat.push({id:'gold', title:'Gold reminder ✨', body:'Buy gold this month.', day:1, hour:10, minute:5});
    repeat.push({id:'scplan', title:'Plan your self-care month \u{1F338}', body:'Open Plans › Self-care and set this month’s sessions and prices.', day:1, hour:10, minute:10});
    repeat.push({id:'salary', title:'Log your salary \u{1F4B5}', body:'Add this month’s salary in Money › Salary.', day:1, hour:12, minute:0});
  }
  if (R.plans){
    S.tasks.filter(t => !t.done && t.due && t.prio === 'urgent').forEach(t => {
      const tm = t.time ? t.time.split(':').map(Number) : null, due = parseD(t.due);
      const eve = at(due, 20, 0); eve.setDate(eve.getDate() - 1);
      push('tu1-' + t.id, '\u{1F6A8} Urgent tomorrow', t.title, eve);
      push('tu2-' + t.id, '\u{1F6A8} Urgent today', t.title + (t.time ? ' · by ' + t.time : ''), at(due, 9, 0));
      if (tm){ const b = at(due, tm[0], tm[1]); b.setHours(b.getHours() - 1); push('tu3-' + t.id, '\u{1F6A8} 1 hour left', t.title, b); }
    });
    S.mashawer.filter(m => !m.done && m.remind !== false && m.date).forEach(m => {
      const t = m.time ? m.time.split(':').map(Number) : [10, 0];
      const when = at(parseD(m.date), t[0], t[1]); when.setDate(when.getDate() - 1);
      push('m-' + m.id, 'Tomorrow: ' + m.name + ' \u{1F4CD}', (m.time ? 'At ' + m.time + '. ' : '') + (m.note || 'Your meshwar is tomorrow.'), when);
    });
    Object.values(S.selfcare).forEach(list => list.forEach(s => {
      if (s.done || !s.planned) return;
      const when = at(parseD(s.planned), 20, 0); when.setDate(when.getDate() - 1);
      push('s-' + s.id, 'Tomorrow: ' + s.e + ' ' + s.name, s.price ? ('Budget: ' + money(s.price)) : 'Your self-care session is tomorrow.', when);
    }));
    S.tasks.filter(t => !t.done && t.due && t.prio !== 'urgent').forEach(t => {
      if (t.prio === 'high'){ const eve = at(parseD(t.due), 20, 0); eve.setDate(eve.getDate() - 1); push('th-' + t.id, '⚠\u{FE0F} Important tomorrow', t.title, eve); }
      push('t-' + t.id, (t.kind === 'work' ? 'Work task due today' : 'To-do today'), t.title, at(parseD(t.due), 9, 0));
    });
  }
  if (R.meals){
    const slots = [['Breakfast',9,0],['Lunch',14,0],['Snack',17,30],['Dinner',20,30]];
    for (let o = 0; o < 4; o++){
      const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + o);
      const n = planDayNum(d); if (n < 1 || n > 30) continue;
      mealsFor(n).forEach((m, i) => push('meal-' + n + '-' + i, slots[i][0] + ' time, Monmon ♡', m.name + ' · ' + m.kcal + ' kcal', at(d, slots[i][1], slots[i][2])));
    }
  }
  lifeReminders(R, repeat, push, at);
  once.sort((a, b) => a.at < b.at ? -1 : 1);
  return {repeat, once};
}

function planDayNum(date){ const d = new Date(date); d.setHours(0,0,0,0); return Math.round((d - parseD(S.start)) / 864e5) + 1; }
const clampDay = n => Math.min(30, Math.max(1, n));
function planDate(n){ const d = parseD(S.start); d.setDate(d.getDate() + n - 1); return d; }
function mealsFor(n){ return PLAN[n - 1].meals.map((m, i) => { const sw = S.swaps[n + '-' + i]; return sw ? Object.assign({}, m, {name:sw.name, kcal:sw.kcal, protein:sw.protein, swapped:true}) : m; }); }

function restoreScroll(y){
  if (y == null) y = SCROLL[navKey()] || 0;
  window.scrollTo({top:y});

function weekCount(id, dayStr){ const ws = weekStart(parseD(dayStr)); let c = 0; for (let i = 0; i < 7; i++){ const d = new Date(ws); d.setDate(ws.getDate() + i); if (habitDone(id, ymd(d))) c++; } return c; }
function setHabit(id, day, on, ev){
  S.hlog[day] = S.hlog[day] || {};
  if (on) S.hlog[day][id] = true; else delete S.hlog[day][id];
  save();
  if (!on) return;
  if (ev) hearts(ev.clientX, ev.clientY);
  const h = S.habits.find(x => x.id === id); if (!h || day !== todayStr()) return;
  if (h.freq === 'daily'){
    const st = streakOf(id);
    if (MILESTONES.includes(st)) celebrate({key:'st-' + id + '-' + st + '-' + day, e:'\u{1F525}', title:st + ' days of ' + h.name + '!', msg:'Look at you, Monmon. ' + st + ' days in a row. Keep the flame going.', reward:h.reward});
  } else if (periodCount(h, day) === h.target){
    const per = h.freq === 'monthly' ? 'month' : 'week';
    celebrate({key:'goal-' + id + '-' + (per === 'month' ? day.slice(0, 7) : ymd(weekStart(parseD(day)))), e:h.e, title:h.name + ': ' + per + 'ly goal done!', msg:h.target + ' of ' + h.target + ' this ' + per + '. That’s the commitment, Monmon.', reward:h.reward});
  }
  const daily = S.habits.filter(x => x.freq === 'daily');
  if (daily.length && daily.every(x => habitDone(x.id, day))) celebrate({key:'all-' + day, e:'\u{1F451}', title:'All daily habits done!', msg:'Every single one, today. You’re glowing, queen.'});
}

function autoPlanBeauty(){
  const W = S.profile.wedding; if (!W) return 0;
  const t = todayStr(), cap = (d, max) => (d > max ? max : d), before = n => addDays(W, -n);
  const plan = {hl1:addDays(t, 3), hl2:addDays(t, 31), hl3:addDays(t, 59), pc1:addDays(t, 5), pc2:addDays(t, 33), sv:addDays(t, 10), sb:before(21), fi:before(25), bo:before(25), ht:before(14), hd:before(5)};
  const max = {hl1:before(10), hl2:before(10), hl3:before(10), pc1:before(14), pc2:before(14), sv:before(21)};
  let n = 0;
  S.wedding.beauty.forEach(b => { if (!b.planned && !b.done && plan[b.id]){ let d = plan[b.id]; if (max[b.id]) d = cap(d, max[b.id]); if (d < t) d = t; b.planned = d; n++; } });
  return n;
}

  if (R.plans !== false) emergencyReminders(push, at);

  if (R.wake !== false && P.wake){ const [h, m] = hm(P.wake); repeat.push({id:'wake', title:'Good morning, Monmon ☀\u{FE0F}', body:'Same time every day. Curtains open, a glass of water, then your day.', hour:h, minute:m}); }

      repeat.push({id:'work-e-' + wd, title:'Log off, Monmon ♡', body:'Work is done for today. Close the laptop.', weekday:wd, hour:eh, minute:em});
    }
  }
  if (R.friday !== false) repeat.push({id:'friday', title:'Friday money check-in \u{1F4B0}', body:'10 minutes: log what you missed, check budgets, move savings.', weekday:6, hour:12, minute:0});
  if (R.night !== false) repeat.push({id:'night', title:'Shop-free hours \u{1F319}', body:'No shopping until 9 AM. Put wishes on the wait list and decide in the morning.', hour:23, minute:0});
  if (R.payday !== false) S.jobs.forEach(j => nextPaydays(j, 2).forEach(d => {

  }));
  if (R.plans){
    S.wait.filter(w => !w.decided).forEach(w => { let r = new Date(w.added + 48 * 36e5); if (r.getHours() >= 23 || r.getHours() < 9){ if (r.getHours() >= 23) r.setDate(r.getDate() + 1); r.setHours(10, 0, 0, 0); } push('wait-' + w.id, 'Decision time ⏳', (w.name || 'Your wait-list item') + ': ' + money(w.total) + '. Still want it?', r); });

/* ---------- habits by period ---------- */
function periodCount(h, day){
  if (h.freq === 'weekly') return weekCount(h.id, day);
  if (h.freq === 'monthly'){ const k = day.slice(0, 7), last = new Date(+k.slice(0, 4), +k.slice(5, 7), 0).getDate(); let c = 0; for (let d = 1; d <= last; d++) if (habitDone(h.id, k + '-' + pad(d))) c++; return c; }
  return habitDone(h.id, day) ? 1 : 0;
}

  S.wedding.beauty.forEach(b => out.push({key:'b:' + b.id, e:b.e, title:b.name, date:b.planned, done:!!b.done, kind:'Beauty'}));
  S.wedding.checklist.forEach(c => out.push({key:'c:' + c.id, e:c.e || '\u{1F48D}', title:c.title, date:c.date || '', done:!!c.done, kind:'To do'}));
  S.mashawer.filter(m => m.wedding).forEach(m => out.push({key:'m:' + m.id, e:'\u{1F4CD}', title:m.name, date:m.date, done:!!m.done, kind:'Meshwar'}));
