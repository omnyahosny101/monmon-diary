  return out;
}
function logPaid(item, cat){
  S.spend = S.spend.filter(x => x.id !== item.spendId); item.spendId = '';
  if (item.done && +item.price > 0){ item.spendId = uid(); S.spend.push({id:item.spendId, date:item.done, amount:+item.price, cat, note:item.e + ' ' + item.name}); }
}
function togglePrep(key){
  const [k, id] = key.split(':'), t = todayStr();
  if (k === 'b'){ const b = S.wedding.beauty.find(x => x.id === id); b.done = b.done ? '' : t; logPaid(b, 'wedding'); }
  if (k === 'c'){ const c = S.wedding.checklist.find(x => x.id === id); c.done = !c.done; }
  if (k === 'm'){ const m = S.mashawer.find(x => x.id === id); m.done = !m.done; m.doneOn = m.done ? t : ''; }
  if (k === 's') Object.values(S.selfcare).forEach(l => l.forEach(s => { if (s.id === id){ s.done = s.done ? '' : t; logPaid(s, s.wedding ? 'wedding' : 'selfcare'); scHabit(s); } }));
  if (k === 'w'){ const x = S.wedding.shopping.find(y => y.id === id); x.done = !x.done; }
  save();
  const all = prepItems(); if (all.length && all.every(x => x.done)) celebrate({key:'prep-all', e:'\u{1F470}', title:'Wedding prep complete!', msg:'Everything on your list is done. Now enjoy every moment, bride.'});
}

/* ---------- habits ---------- */

    return '<h3>' + title + '</h3><div class="hgrid hg3">' + list.map(h => {
      const on = habitDone(h.id, day), c = periodCount(h, day), met = freq !== 'daily' && c >= h.target, st = freq === 'daily' ? streakOf(h.id) : 0;
      const sub = freq === 'daily' ? (h.id === 'read' ? '5+ pages' : h.id === 'listen' ? 'tap to log' : 'today') : c + '/' + h.target + (freq === 'weekly' ? ' this week' : ' this month');
      return '<button class="habit mini' + (on ? ' on' : '') + (met && !on ? ' met' : '') + '" data-h="' + h.id + '" aria-pressed="' + on + '"><span class="e">' + h.e + '</span><span class="hl">' + esc(h.name) + '</span><span class="hs">' + sub + '</span>' + (st >= 2 ? '<span class="fire">\u{1F525}' + st + '</span>' : '') + '</button>';

/* ---------- 🚨 emergency flags: tasks, mashawer, wedding prep, shopping, beauty ---------- */
function flagBtn(key, on){ return '<span class="ibtns">' + bellBtn(key) + flagOnly(key, on) + '</span>'; }
function flagOnly(key, on){ return '<button class="flag' + (on ? ' on' : '') + '" data-flag="' + key + '" aria-pressed="' + !!on + '" aria-label="' + (on ? 'Remove emergency flag' : 'Flag as emergency') + '">\u{1F6A8}</button>'; }
function findFlag(key){
  const [k, id] = key.split(':');
  if (k === 't') return S.tasks.find(x => x.id === id);
  if (k === 'm') return S.mashawer.find(x => x.id === id);
  if (k === 'c') return S.wedding.checklist.find(x => x.id === id);
  if (k === 'w') return (S.wedding.shopping || []).find(x => x.id === id);
  if (k === 's') for (const m in S.selfcare){ const x = S.selfcare[m].find(y => y.id === id); if (x) return x; }
}
function toggleFlag(key){
  const x = findFlag(key); if (!x) return;
  let on; if (key[0] === 't'){ x.prio = x.prio === 'urgent' ? 'normal' : 'urgent'; on = x.prio === 'urgent'; } else on = x.flag = !x.flag;
  save(); toast(on ? '\u{1F6A8} Emergency. It’s at the top of Today now.' : 'Flag removed');
}
function bindFlags(el, again){ $$('[data-flag]', el).forEach(b => b.onclick = ev => { ev.stopPropagation(); toggleFlag(b.dataset.flag); again(); }); bindBells(el, again); }

  S.wedding.checklist.filter(c => c.flag && !c.done).forEach(c => out.push({key:'c:' + c.id, e:c.e || '\u{1F48D}', title:c.title, date:c.date || '', kind:'Wedding prep', flag:true, wed:true}));

function wkAdd(day, name, extra){

/* ============ PHOTOS: food, diary, outings, tasks ============
   Each photo is shrunk to about 1080px, kept on the phone in IndexedDB, and a copy goes to the iPhone app's own files.
   S.photos = {key: [photoId, …]} where key is like 'diary:2026-11-02', 'task:<id>', 'exp:<id>', 'mesh:<id>', 'food:<id>', 'meal:<date>-<i>'. */
const PHDB = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => { const r = indexedDB.open('monmon-photos', 1); r.onupgradeneeded = () => r.result.createObjectStore('p'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const run = (mode, fn) => open().then(db => new Promise((res, rej) => { const t = db.transaction('p', mode), q = fn(t.objectStore('p')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }));
  return {put:(id, d) => run('readwrite', s => s.put(d, id)), get:id => run('readonly', s => s.get(id)), del:id => run('readwrite', s => s.delete(id))};
})();
const phWait = {};
window.__photoIn = (id, data) => { if (data) PHDB.put(id, data).catch(() => {}); (phWait[id] || []).forEach(f => f(data || null)); delete phWait[id]; };
function photoData(id){
  return PHDB.get(id).catch(() => null).then(d => {
    if (d) return d;
    const n = native(); if (!n) return null;
    return new Promise(res => { (phWait[id] = phWait[id] || []).push(res); try { n.postMessage({type:'getPhoto', id}); } catch(e){ res(null); } setTimeout(() => res(null), 4000); });
  });
}
function shrink(file){
  return new Promise((res, rej) => { const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { const m = 1080, r = Math.min(1, m / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * r); c.height = Math.round(im.height * r);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.72)); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); }; im.src = url; });
}

function legacyCopy(t, done){
  const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';

/* ============ FRENCH+: a clear voice, spaced review, speaking practice and a listening drill ============
   In the iPhone app the voice comes from the phone itself (AVSpeechSynthesizer), which can use the
   Enhanced and Premium French voices downloaded in Settings. Safari's web voices can't, so they stay a fallback.
   S.frv = {speed, voice}; S.fr.srs = {fr:{b, due}}; S.fr.rev / sh / drill = {date:count} */
const VOX = {native:false, listen:false, voices:[], ar:[]};
window.__capsIn = c => { VOX.native = !!(c && c.speak); VOX.audio = !!(c && c.audio); VOX.pod = !!(c && c.pod); VOX.queue = !!(c && c.queue); VOX.listen = !!(c && c.listen); VOX.voices = (c && c.voices) || []; VOX.ar = (c && c.ar) || [];
  if (nav.tab === 'grow' && nav.sub.grow === 'fr' && !$('.sheet') && !RD) render(); };
(function(){ const n = native(); if (n) try { n.postMessage({type:'caps'}); } catch(e){} })();
function frPlusMigrate(){
  S.frv = Object.assign({speed:0.9, voice:''}, S.frv || {});
  ['srs', 'rev', 'sh', 'drill', 'newc'].forEach(k => { S.fr[k] = S.fr[k] && typeof S.fr[k] === 'object' ? S.fr[k] : {}; });
}

/* ---------- speaking ---------- */
let spkN = 0; const spkWait = {};
window.__spoke = id => { const f = spkWait[id]; if (f){ delete spkWait[id]; f(); } };
function webVoices(prefix){ try { return speechSynthesis.getVoices().filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(prefix)); } catch(e){ return []; } }
function bestWebVoice(lang){
  const pre = lang.slice(0, 2).toLowerCase(), vs = webVoices(pre); if (!vs.length) return null;
  if (pre === 'fr' && S.frv && S.frv.voice){ const m = vs.find(v => v.name === S.frv.voice || v.voiceURI === S.frv.voice); if (m) return m; }
  const score = v => (/premium/i.test(v.name) ? 50 : 0) + (/enhanced|amélioré|natural|neural/i.test(v.name) ? 40 : 0) + (/google/i.test(v.name) ? 30 : 0) +
    (/am[ée]lie|thomas|audrey|aur[ée]lie|marie|daniel/i.test(v.name) ? 10 : 0) + (v.lang.replace('_', '-').toLowerCase() === lang.toLowerCase() ? 5 : 0) + (v.localService ? 1 : 0);
  return vs.slice().sort((a, b) => score(b) - score(a))[0];
}
function speak(text, lang, rate){
  text = String(text || '').trim(); rate = rate || 1;
  return new Promise(res => {
    if (!text) return res();
    const id = 's' + (++spkN);
    const tmo = setTimeout(() => window.__spoke(id), 2500 + text.length * 160 / rate);
    spkWait[id] = () => { clearTimeout(tmo); res(); };
    if (VOX.native){ try { native().postMessage({type:'speak', id, text, lang, rate:0.5 * rate, voice:lang.startsWith('fr') ? (S.frv.voice || '') : ''}); return; } catch(e){} }
    try {
      const s = window.speechSynthesis; if (!s){ toast(L2('الصوت مش متاح هنا', 'Sound isn’t available here')); return window.__spoke(id); }
      s.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = rate;
      const v = bestWebVoice(lang); if (v) u.voice = v;
      u.onend = u.onerror = () => window.__spoke(id); s.speak(u);
    } catch(e){ window.__spoke(id); }
  });
}
function stopSpeak(){ Object.keys(spkWait).forEach(k => window.__spoke(k)); try { if (VOX.native) native().postMessage({type:'stopSpeak'}); else if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e){} }
let lastSay = {t:'', at:0};
function frSpeed(slow){ return (S.frv ? S.frv.speed : 0.9) * (slow ? 0.6 : 1); }
// tap 🔊 once: normal speed; tap the same word again within 3 seconds: slow
function sayFr(text, slow){
  const t = frClean(text), again = lastSay.t === t && Date.now() - lastSay.at < 3000;
  lastSay = {t, at:Date.now()};
  return speak(t, 'fr-FR', frSpeed(slow || again));
}
const arClean = t => String(t).replace(/\([^)]*\)/g, '').replace(/ \/ /g, '، ').replace(/[…]/g, '').trim();
function hasArVoice(){ return VOX.native ? VOX.ar.length > 0 : webVoices('ar').length > 0; }

/* ---------- listening to her (speaking practice) ---------- */
let heardCb = null, webRec = null, webMedia = null, webBlobUrl = '';
window.__heard = m => { if (heardCb) heardCb(m || {}); };
function canCheckSpeech(){ return VOX.listen || !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function canRecord(){ return VOX.listen || !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); }
function startListen(cb){
  let gotFinal = false; heardCb = m => { if (m.final) gotFinal = true; cb(m); }; stopSpeak();
  if (VOX.listen){ native().postMessage({type:'listen', lang:'fr-FR'}); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (navigator.mediaDevices && window.MediaRecorder){
    navigator.mediaDevices.getUserMedia({audio:true}).then(stream => {
      const chunks = []; webMedia = new MediaRecorder(stream);
      webMedia.ondataavailable = e => chunks.push(e.data);
      webMedia.onstop = () => { stream.getTracks().forEach(t => t.stop()); if (webBlobUrl) URL.revokeObjectURL(webBlobUrl); webBlobUrl = URL.createObjectURL(new Blob(chunks, {type:webMedia.mimeType || 'audio/mp4'})); setTimeout(() => { if (!gotFinal) window.__heard({text:'', final:true, recOnly:true}); }, SR ? 900 : 0); };
      webMedia.start(); window.__heard({started:true});
      setTimeout(() => { if (webMedia && webMedia.state === 'recording') stopListen(); }, 7000);
    }).catch(() => window.__heard({err:'mic'}));
  }
  if (SR){
    try { webRec = new SR(); webRec.lang = 'fr-FR'; webRec.interimResults = true; webRec.maxAlternatives = 1;
      webRec.onresult = e => { const r = e.results[e.results.length - 1]; window.__heard({text:Array.from(e.results).map(x => x[0].transcript).join(' '), final:r.isFinal}); };
      webRec.onerror = () => { if (!window.MediaRecorder) window.__heard({err:'unavailable'}); }; webRec.onend = () => { if (webMedia && webMedia.state === 'recording') webMedia.stop(); };
      webRec.start(); if (!window.MediaRecorder) window.__heard({started:true}); } catch(e){ window.__heard({err:'unavailable'}); }
  }
}
function stopListen(){
  if (VOX.listen){ try { native().postMessage({type:'stopListen'}); } catch(e){} return; }
  try { if (webRec) webRec.stop(); } catch(e){}
  try { if (webMedia && webMedia.state === 'recording') webMedia.stop(); } catch(e){}
}
function playMine(){
  if (VOX.listen){ native().postMessage({type:'playMine'}); return; }
  if (webBlobUrl){ const a = new Audio(webBlobUrl); a.play().catch(() => {}); }
}
const frNorm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[’'`]/g, ' ').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
function speechScore(target, heard){
  const tw = frNorm(frClean(target)).split(' ').filter(Boolean), hw = frNorm(heard).split(' ').filter(Boolean), pool = hw.slice();
  const marks = tw.map(w => { const i = pool.indexOf(w); if (i >= 0){ pool.splice(i, 1); return true; } return false; });
  return {pct:tw.length ? Math.round(marks.filter(Boolean).length / tw.length * 100) : 0, marks, words:frClean(target).split(/\s+/)};
}

/* ---------- spaced repetition (Leitner boxes) ---------- */
const SRS_INT = [1, 2, 4, 7, 15, 30, 60];
function frLearnedN(){ const done = Object.keys(S.fr.done).map(Number); return Math.min(FR.length, Math.max(0, ...done, todayStr() >= FR_START ? frToday() - 1 : 0)); }
function frCards(){ const out = []; FR.slice(0, frLearnedN()).forEach((L, li) => { L.w.forEach(w => out.push({fr:w[0], ar:w[1], pr:w[2] || '', n:li + 1})); L.p.forEach(p => out.push({fr:p[0], ar:p[1], pr:'', n:li + 1})); }); return out; }
function frDue(){
  const t = todayStr(), cards = frCards(), due = cards.filter(c => S.fr.srs[c.fr] && S.fr.srs[c.fr].due <= t);
  const newLeft = Math.max(0, 15 - (S.fr.newc[t] || 0)), fresh = cards.filter(c => !S.fr.srs[c.fr]).slice(0, newLeft);

}

/* ---------- listening drill: hear the meaning, answer out loud, then hear the French ---------- */
function drillSheet(n, done){
  const L = FR[n - 1], items = L.w.map(w => ({fr:w[0], ar:w[1]})).concat(L.p.map(p => ({fr:p[0], ar:p[1]})));
  let i = 0, run = 0, paused = false; const t = todayStr();
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const loop = async (sh, token) => {
    const box = $('[data-dbox]', sh);
    while (i < items.length){
      if (token !== run || !document.body.contains(sh)) return;
      if (paused){ await wait(300); continue; }
      const it = items[i];
      box.innerHTML = '<span class="small muted" style="font-weight:900">' + (i + 1) + ' / ' + items.length + '</span><div class="srs-front" data-notr>' + esc(arClean(it.ar)) + '</div><div class="dstep">' + L2('🗣️ قوليها انتي بالفرنساوي…', '🗣️ Say it in French…') + '</div>';
      if (hasArVoice()) await speak(arClean(it.ar), 'ar-SA', 1); else await wait(600);
      if (token !== run) return;
      await wait(Math.min(6000, 2600 + frClean(it.fr).length * 60));
      if (token !== run) return;
      box.innerHTML = '<span class="small muted" style="font-weight:900">' + (i + 1) + ' / ' + items.length + '</span><div class="srs-front" data-notr>' + esc(arClean(it.ar)) + '</div><div class="frbig" lang="fr" dir="ltr" data-notr>' + esc(it.fr) + '</div><div class="dstep ok">' + L2('👂 اسمعي وكرري', '👂 Listen and repeat') + '</div>';
      await speak(frClean(it.fr), 'fr-FR', frSpeed(false)); if (token !== run) return;
      await wait(1800); if (token !== run) return;
      await speak(frClean(it.fr), 'fr-FR', frSpeed(false)); if (token !== run) return;
      await wait(1500);
      i++;
    }
    if (token !== run) return;
    S.fr.drill[t] = (S.fr.drill[t] || 0) + 1; save();
    box.innerHTML = '<div style="text-align:center;font-size:46px">🎧</div><div class="greet" style="text-align:center">Très bien !</div><p style="text-align:center;margin:0;font-weight:700">' + L2('خلصتي تمرين الودان. اعمليه تاني وانتي ماشية أو في الجيم.', 'Drill done. Do it again on a walk or at the gym.') + '</p>';
  };
  sheet('<div style="text-align:center;font-size:34px">🎧</div><h2 class="plain" style="justify-content:center">' + L2('تمرين الودان: درس ', 'Listening drill: lesson ') + n + '</h2><p class="small muted" style="margin:0;text-align:center;font-weight:700">' + L2('هسمّعك المعنى بالعربي، تقوليه انتي بالفرنساوي قبل ما تسمعيه، وبعدين تسمعي الصح مرتين. ينفع من غير ما تبصي على الشاشة.', 'Hear the meaning, say the French before you hear it, then hear it twice. Works eyes-free.') + '</p>' +
    '<div data-dbox style="display:flex;flex-direction:column;gap:12px;min-height:150px"></div><div class="row"><button class="btn soft" data-dp style="flex:1">⏸️ ' + L2('وقفي', 'Pause') + '</button><button class="btn soft" data-dn style="flex:1">⏭️ ' + L2('اللي بعدها', 'Skip') + '</button></div>',
    (sh, close) => {
      const start = () => { run++; loop(sh, run); };
      $('[data-dp]', sh).onclick = e => { paused = !paused; e.currentTarget.textContent = paused ? '▶️ ' + L2('كمّلي', 'Resume') : '⏸️ ' + L2('وقفي', 'Pause'); if (paused) stopSpeak(); else start(); };
      $('[data-dn]', sh).onclick = () => { stopSpeak(); i = Math.min(items.length, i + 1); paused = false; start(); };
      $('[data-close]', sh).addEventListener('click', () => { run++; stopSpeak(); done && done(); });
      start();
    });
}

function narrSplit(t){

function narrClean(t){

    .replace(/\bPPP\b/g, '')

    .replace(/\s*[:؛;—–]\s*/g, '، ')

  S.music = Array.isArray(S.music) ? S.music : [];
}
function jsonp(url){
  return new Promise((res, rej) => {
    const cb = '__jp' + Date.now() + Math.floor(Math.random() * 1e5), s = document.createElement('script');
    const done = () => { clearTimeout(t); delete window[cb]; s.remove(); };
    const t = setTimeout(() => { done(); rej(new Error('timeout')); }, 15000);
    window[cb] = d => { done(); res(d); };
    s.onerror = () => { done(); rej(new Error('net')); };
    s.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.head.appendChild(s);
  });
}
const POD_CACHE = {};
function podEpisodes(id, force){
  if (POD_CACHE[id] && !force) return Promise.resolve(POD_CACHE[id]);
  return jsonp('https://itunes.apple.com/lookup?id=' + encodeURIComponent(id) + '&entity=podcastEpisode&limit=60&country=eg').then(d => {
    const rs = (d && d.results) || [], show = rs.find(r => r.kind === 'podcast' || r.wrapperType === 'track' && r.collectionId == id && !r.episodeUrl) || {};
    const eps = rs.filter(r => r.episodeUrl).map(r => ({k:String(r.trackId), t:r.trackName, d:(r.releaseDate || '').slice(0, 10), url:r.episodeUrl, ms:r.trackTimeMillis || 0,
      art:r.artworkUrl160 || r.artworkUrl600 || show.artworkUrl100 || '', desc:r.shortDescription || r.description || '', show:String(id), st:r.collectionName || show.collectionName || ''}));
    eps.sort((a, b) => b.d < a.d ? -1 : 1);
    const sub = S.pods.subs.find(x => x.id == id); if (sub && show.collectionName){ sub.t = show.collectionName; sub.au = show.artistName || sub.au; sub.art = show.artworkUrl100 || sub.art; }
    return POD_CACHE[id] = {show, eps};
  });
}

const POD = {ep:null, playing:false, pos:0, dur:0, el:null, lastSave:0};
window.__podIn = m => { if (!m) return;
  if (m.pos != null){ POD.pos = m.pos; if (m.dur) POD.dur = m.dur; POD.playing = !!m.playing; podProgress(); }
  if (m.ended) podEnded(); podBar(); };
const podNative = () => !!VOX.pod;
function podPlay(ep, from){
  if (typeof narrStop === 'function' && NAR.bar) narrStop(); stopSpeak();
  const p = S.pods.prog[ep.k] || {}, start = from != null ? from : (p.done ? 0 : p.pos || 0);
  POD.ep = ep; POD.pos = start; POD.dur = ep.ms / 1000 || p.dur || 0; POD.playing = true; S.pods.last = ep; save();
  if (podNative()){ try { native().postMessage({type:'podPlay', url:ep.url, start, rate:S.pods.rate, title:ep.t, artist:ep.st}); podBar(); return; } catch(e){} }
  if (!POD.el){ POD.el = new Audio(); POD.el.preload = 'auto';
    POD.el.ontimeupdate = () => { POD.pos = POD.el.currentTime; POD.dur = POD.el.duration || POD.dur; podProgress(); podBarTime(); };
    POD.el.onplay = () => { POD.playing = true; podBar(); }; POD.el.onpause = () => { POD.playing = false; podBar(); };
    POD.el.onended = podEnded; }
  POD.el.src = ep.url; POD.el.playbackRate = S.pods.rate;
  const go = () => { try { if (start > 1) POD.el.currentTime = start; } catch(e){} };
  POD.el.onloadedmetadata = go;
  POD.el.play().then(() => { POD.el.playbackRate = S.pods.rate; }).catch(e => { POD.playing = false; podBar(); toast(e && e.name === 'NotAllowedError' ? L2('دوسي ▶️', 'Tap ▶️') : L2('الحلقة محتاجة نت', 'Needs internet')); });
  podBar();
}
function podToggle(){
  if (!POD.ep) return;

  if (!POD.el || !POD.el.src) return podPlay(POD.ep, POD.pos);
  if (POD.el.paused) POD.el.play().catch(() => {}); else POD.el.pause();
}
function podSeek(by){
  if (!POD.ep) return;
  if (podNative()){ native().postMessage({type:'podSeek', by}); POD.pos = Math.max(0, POD.pos + by); podBarTime(); return; }
  if (POD.el) POD.el.currentTime = Math.max(0, Math.min((POD.el.duration || 1e9) - 1, POD.el.currentTime + by));
}
function podSetRate(r){ S.pods.rate = r; save(); if (podNative()) native().postMessage({type:'podRate', rate:r}); else if (POD.el) POD.el.playbackRate = r; podBar(); }
function podStop(){ if (podNative()) try { native().postMessage({type:'podStop'}); } catch(e){} if (POD.el) POD.el.pause(); POD.playing = false; podProgress(true); POD.ep = null; podBar(); }
function podProgress(force){
  const ep = POD.ep; if (!ep) return;
  const p = S.pods.prog[ep.k] = S.pods.prog[ep.k] || {};
  p.pos = POD.pos; if (POD.dur) p.dur = POD.dur; p.at = todayStr();
  if (!p.done && p.dur && POD.pos / p.dur > 0.92) podMarkDone(ep);

}
function podMarkDone(ep){
  const p = S.pods.prog[ep.k] = S.pods.prog[ep.k] || {}; p.done = todayStr();
  const day = todayStr(), m = S.media[day] = S.media[day] || {}; m.episode = ep.st + ' · ' + ep.t;
  if (S.habits.some(h => h.id === 'listen') && !habitDone('listen', day)) setHabit('listen', day, true);

}
function podEnded(){ if (POD.ep){ POD.pos = POD.dur; podProgress(true); if (!(S.pods.prog[POD.ep.k] || {}).done) podMarkDone(POD.ep); } POD.playing = false; podBar(); }
const tfmt = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + pad(m) : m) + ':' + pad(x); };

/* ---------- home: what to listen to ---------- */
function podHomeEpisodes(){
  const out = [], seen = new Set(), last = S.pods.last, lp = last && S.pods.prog[last.k];
  if (last && lp && !lp.done && lp.pos > 5){ out.push(Object.assign({resume:true}, last)); seen.add(last.k); }
  S.pods.subs.forEach(sub => { const c = POD_CACHE[sub.id]; if (!c) return;
    c.eps.filter(e => !(S.pods.prog[e.k] || {}).done && !seen.has(e.k)).slice(0, 1).forEach(e => { out.push(e); seen.add(e.k); }); });
  return out.slice(0, 3);
}

  if (!S.pods.subs.length && !S.music.length) return '';
  const eps = podHomeEpisodes();
  return '<div class="card podhome"><div class="card-head"><h2>🎧 ' + L2('اسمعي', 'Listen') + '</h2><button class="linkbtn" data-go="grow:listen">' + L2('الكل', 'All') + '</button></div>' +
    '<div class="list" id="podHomeEps">' + (eps.length ? eps.map((e, i) => { const p = S.pods.prog[e.k] || {};
      return '<button class="podep" data-phe="' + i + '"><span class="t" data-notr><b>' + esc(e.t) + '</b><span class="s">' + (e.resume ? '▶️ ' + L2('كمّلي من ', 'Resume at ') + tfmt(p.pos) + ' · ' : L2('جديد · ', 'New · ')) + esc(e.st) + (e.ms ? ' · ' + Math.round(e.ms / 60000) + L2(' د', ' min') : '') + '</span>' + (e.resume && p.dur ? '<i class="pbar"><i style="width:' + Math.min(100, p.pos / p.dur * 100) + '%"></i></i>' : '') + '</span><span class="pp">▶️</span></button>'; }).join('')
      : (S.pods.subs.length ? '<div class="empty">' + L2('بنجيب الحلقات الجديدة…', 'Loading new episodes…') + '</div>' : '')) + '</div>' +
    (S.music.length ? '<h3 style="margin:4px 0 0">🎵 ' + L2('مزيكا (يوتيوب ميوزك)', 'Music (YouTube Music)') + '</h3>' + musicHTML(false) : '') + '</div>';
}
function bindPodHome(el){
  const eps = podHomeEpisodes();
  $$('[data-phe]', el).forEach(b => b.onclick = () => { const e = eps[+b.dataset.phe]; if (e) podPlay(e); });
  $$('.podhome [data-go]', el).forEach(b => b.onclick = () => { const p = b.dataset.go.split(':'); go(p[0], p[1]); });
  bindMusic(el);
}
const _todayPod = VIEWS.today;
VIEWS.today = function(el){
  _todayPod(el);
  const db = $('.daybar', el); if (db) el.appendChild(db); // "log a past day" lives at the very end
  const html = podHomeHTML(); if (!html) return;
  const anchor = $('.readhome', el) || $('.frhome', el);
  if (anchor) anchor.insertAdjacentHTML('afterend', html); else el.insertAdjacentHTML('beforeend', html);
  bindPodHome(el);
  // fetch the latest episodes once, then fill the card in place
  const missing = S.pods.subs.filter(s => !POD_CACHE[s.id]);
  if (missing.length) Promise.all(missing.map(s => podEpisodes(s.id).catch(() => null))).then(() => {
    const card = $('.podhome', el); if (!card || !document.body.contains(card) || nav.tab !== 'today') return;
    const fresh = document.createElement('div'); fresh.innerHTML = podHomeHTML(); card.replaceWith(fresh.firstChild); bindPodHome(el);
  });
};
