<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monmon's Life</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monmon's Life">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fff2f6">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Nunito:wght@400;600;700;800;900&family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: one phone column; six colour-coded sections (Today rose, Food coral, Money mint, Plans lilac, Grow sky, Me berry).
   Each section: segmented sub-menu, then stacked soft cards with a 1.5px tinted border. Tab bar pinned to the bottom. */
:root{
  --bg:#fff4f8; --bg2:#ffe6ef; --surface:#ffffff; --ink:#4b1f33; --muted:#9a6a7e; --line:#f5d6e1;
  --rose:#ff5c8f; --coral:#ff7f5c; --mint:#22b07d; --lilac:#8f6bff; --sky:#3b9cf5; --berry:#d9479a; --gold:#e8a317; --warn:#ff6a3d; --danger:#ef3b5d;
  --rose-soft:#ffd6e3; --coral-soft:#ffe1d6; --mint-soft:#d6f5e8; --lilac-soft:#e8e0ff; --sky-soft:#dcedff; --berry-soft:#fbdcee; --gold-soft:#fff0c9;
  --acc:var(--rose); --acc-soft:var(--rose-soft);
  --shadow:0 12px 28px -18px rgba(150,40,90,.45);
  --r:22px;
  --f-display:"Shrikhand","Georgia",serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Fredoka","Nunito",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#211019; --bg2:#311827; --surface:#2f1a26; --ink:#ffe8f0; --muted:#d2a5b9; --line:#4a2a3b;
  --rose:#ff7aa5; --coral:#ff9a7c; --mint:#4fd8a4; --lilac:#ae94ff; --sky:#6db7ff; --berry:#f06db4; --gold:#ffc542; --warn:#ff8f66; --danger:#ff6380;
  --rose-soft:#55233d; --coral-soft:#55302a; --mint-soft:#1f4637; --lilac-soft:#3a2f5c; --sky-soft:#22394f; --berry-soft:#522540; --gold-soft:#4d3d16;
  --shadow:0 12px 28px -18px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#211019; --bg2:#311827; --surface:#2f1a26; --ink:#ffe8f0; --muted:#d2a5b9; --line:#4a2a3b;
  --rose:#ff7aa5; --coral:#ff9a7c; --mint:#4fd8a4; --lilac:#ae94ff; --sky:#6db7ff; --berry:#f06db4; --gold:#ffc542; --warn:#ff8f66; --danger:#ff6380;
  --rose-soft:#55233d; --coral-soft:#55302a; --mint-soft:#1f4637; --lilac-soft:#3a2f5c; --sky-soft:#22394f; --berry-soft:#522540; --gold-soft:#4d3d16;
  --shadow:0 12px 28px -18px rgba(0,0,0,.7); color-scheme:dark}
body[data-tab="today"]{--acc:var(--rose);--acc-soft:var(--rose-soft)}
body[data-tab="food"]{--acc:var(--coral);--acc-soft:var(--coral-soft)}
body[data-tab="money"]{--acc:var(--mint);--acc-soft:var(--mint-soft)}
body[data-tab="plans"]{--acc:var(--lilac);--acc-soft:var(--lilac-soft)}
body[data-tab="grow"]{--acc:var(--sky);--acc-soft:var(--sky-soft)}
body[data-tab="me"]{--acc:var(--berry);--acc-soft:var(--berry-soft)}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden;transition:background .4s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:12px}

.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(46px);opacity:.55;animation:drift 18s ease-in-out infinite alternate;transition:background .6s}
.blob.a{width:280px;height:280px;background:var(--acc-soft);top:-80px;right:-90px}
.blob.b{width:220px;height:220px;background:var(--gold-soft);bottom:140px;left:-100px;animation-delay:-6s}
.blob.c{width:170px;height:170px;background:var(--lilac-soft);top:42%;right:-70px;animation-delay:-11s}
@keyframes drift{to{transform:translate(30px,40px) scale(1.12)}}

.app{position:relative;z-index:1;max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 130px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{margin:0;font-size:12px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-family:var(--f-display);font-weight:400;font-size:clamp(25px,7.6vw,34px);line-height:1.05;color:var(--rose)}
h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--ink);text-wrap:balance;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc);flex:0 0 auto}
h2.plain::before{display:none}
h3{margin:0;font-size:11.5px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--acc)}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
.iconbtn svg{width:20px;height:20px}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);border:1.5px solid color-mix(in srgb,var(--acc) 16%,var(--line));box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.tint{background:linear-gradient(145deg,var(--surface) 35%,var(--acc-soft))}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pop{animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pop{from{opacity:.0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

/* segmented control */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:0 -2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-size:13px;font-weight:800;color:var(--muted);transition:all .2s}
.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 8px 16px -10px var(--acc)}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 120px}
.card>.field,.sc .field,.grow .field,.sheet-in>.field{flex:0 0 auto}
.field>span{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.in{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;min-width:0;transition:border-color .2s}
.in:focus{border-color:var(--acc)}
textarea.in{resize:vertical;min-height:64px;font-weight:600;line-height:1.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.btn{background:var(--acc);color:#fff;font-weight:900;padding:11px 16px;border-radius:14px;flex:0 0 auto;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.soft{background:var(--acc-soft);color:var(--acc)}
.btn.full{width:100%}
.linkbtn{font-size:12px;font-weight:900;color:var(--acc);padding:6px 11px;border-radius:999px;background:var(--acc-soft);flex:0 0 auto}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);min-width:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .t{font-weight:700;min-width:0;overflow-wrap:anywhere}
.item .s{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.tick{width:26px;height:26px;border-radius:9px;border:2px solid var(--acc-soft);display:grid;place-items:center;transition:all .25s cubic-bezier(.3,1.6,.5,1);flex:0 0 auto}
.tick svg{width:14px;height:14px;stroke:#fff;stroke-width:4;fill:none;opacity:0}
.tick.on{background:var(--mint);border-color:var(--mint);transform:rotate(-6deg)}
.tick.on svg{opacity:1}
.del{color:var(--muted);font-size:20px;line-height:1;min-width:30px;height:30px;border-radius:15px;display:grid;place-items:center;padding:0 6px}
.del.armed{font-size:12px;color:var(--danger);font-weight:900;background:color-mix(in srgb,var(--danger) 12%,transparent)}
.empty{font-size:13px;color:var(--muted);text-align:center;padding:10px 0}
.amt{font-family:var(--f-num);font-weight:600;white-space:nowrap}
.pill{display:inline-block;font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:999px;background:var(--acc-soft);color:var(--acc);margin-right:4px;vertical-align:1px}
.pill.urgent{background:var(--danger);color:#fff}
.pill.high{background:var(--gold-soft);color:#a86d00}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--bg);border:1.5px solid var(--line);font-size:13px;font-weight:800;transition:all .2s}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;transform:translateY(-1px)}
.chip .cnt{font-family:var(--f-num);font-size:11px;opacity:.85}
.hgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.habit{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:16px;background:var(--bg);border:1.5px solid var(--line);text-align:left;font-weight:800;font-size:13.5px;min-width:0;transition:all .25s cubic-bezier(.3,1.5,.5,1)}
.habit .e{font-size:19px}
.habit .hs{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.habit.on{background:var(--mint-soft);border-color:var(--mint);transform:scale(1.02)}
.habit .hl{min-width:0}
.habit .fire{margin-left:auto;font-family:var(--f-num);font-size:12px;color:var(--warn);white-space:nowrap}

/* hero + stats */
.greet{font-family:var(--f-display);font-size:22px;line-height:1.1}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:16px;padding:10px;text-align:center;border:1.5px solid var(--line)}
.stat b{display:block;font-family:var(--f-num);font-size:20px;font-weight:600;color:var(--acc)}
.stat span{font-size:11px;font-weight:800;color:var(--muted)}
.money3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mbox{background:var(--surface);border-radius:20px;padding:12px;border:1.5px solid color-mix(in srgb,var(--acc) 16%,var(--line));box-shadow:var(--shadow);min-width:0}
.mbox b{display:block;font-family:var(--f-num);font-size:18px;font-weight:600;overflow-wrap:anywhere;color:var(--ink)}
.mbox span{font-size:11px;font-weight:800;color:var(--muted)}

/* urgent banner */
.urgent{background:linear-gradient(135deg,var(--danger),var(--warn));color:#fff;border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 14px 28px -14px var(--danger);animation:pulse 2s ease-in-out infinite}
.urgent h2{color:#fff}.urgent h2::before{background:#fff}
.urgent .ur{display:flex;align-items:center;gap:10px;font-weight:800;text-align:left}
.urgent .ur .tick{border-color:rgba(255,255,255,.7)}
@keyframes pulse{0%,100%{box-shadow:0 14px 28px -14px var(--danger)}50%{box-shadow:0 14px 34px -8px var(--danger)}}

/* mood */
.moods{display:flex;justify-content:space-between;gap:6px}
.mood{flex:1;font-size:26px;padding:8px 0;border-radius:16px;background:var(--bg);border:1.5px solid var(--line);transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.mood.on{background:var(--acc-soft);border-color:var(--acc);transform:scale(1.08)}
.mood span{display:block;font-size:10px;font-weight:900;color:var(--muted);margin-top:2px}
.qlab{font-weight:800;font-size:14px;color:var(--ink);text-transform:none!important;letter-spacing:0!important}

/* meals */
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 8px;margin:0 -2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dpill{flex:0 0 52px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;border-radius:18px;background:var(--surface);border:1.5px solid var(--line);font-family:var(--f-num);transition:transform .25s}
.dpill .dn{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dpill .dd{font-size:19px;font-weight:600}
.dpill .dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dpill.done .dot{background:var(--mint)}
.dpill.part .dot{background:var(--gold)}
.dpill.today{border-style:dashed;border-color:var(--acc)}
.dpill.sel{background:var(--acc);border-color:var(--acc);color:#fff;transform:translateY(-3px)}
.dpill.sel .dn{color:#fff}
.ringwrap{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{position:relative;width:124px;height:124px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--acc-soft);stroke-width:12}
.ring .fill{fill:none;stroke:url(#grad);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.3,1.4,.5,1)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-family:var(--f-num);font-size:26px;font-weight:600;line-height:1}
.ring .sm{font-size:11px;color:var(--muted);font-weight:800}
.bar{height:10px;border-radius:999px;background:var(--acc-soft);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--lilac),var(--acc));transition:width .9s cubic-bezier(.3,1.3,.5,1)}
.bar.over>i{background:linear-gradient(90deg,var(--gold),var(--danger))}
.bar.good>i{background:linear-gradient(90deg,var(--sky),var(--mint))}
.statrow{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:800;text-align:left}
.sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .25s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.sw[aria-checked="true"]{background:var(--acc)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.cups{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.cup{aspect-ratio:3/4;max-width:100%;border-radius:10px 10px 14px 14px;border:2px solid var(--sky-soft);position:relative;overflow:hidden}
.cup::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#9fd8ff,#79b8ff);transition:height .45s cubic-bezier(.3,1.4,.5,1)}
.cup.on::after{height:78%}
.cup.on{border-color:#9fd0ff}
.meal{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border-radius:var(--r);padding:13px;border:1.5px solid color-mix(in srgb,var(--acc) 16%,var(--line));box-shadow:var(--shadow);transition:background .3s}
.meal .ic{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.meal .ic svg{width:24px;height:24px}
.meal .txt{min-width:0}
.meal .lbl{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.meal .nm{font-weight:800;font-size:14.5px;line-height:1.3;margin-top:2px}
.meal .mac{font-family:var(--f-num);font-size:12px;color:var(--muted);margin-top:3px}
.meal .swap{font-size:11px;font-weight:900;color:var(--acc);background:var(--acc-soft);padding:3px 9px;border-radius:999px;letter-spacing:0;text-transform:none}
.check{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--acc-soft);display:grid;place-items:center;transition:all .3s cubic-bezier(.3,1.6,.5,1)}
.check svg{width:16px;height:16px;stroke:#fff;stroke-width:3.5;fill:none;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s .1s}
.meal.eaten{background:var(--mint-soft)}
.meal.eaten .check{background:var(--mint);border-color:var(--mint)}
.meal.eaten .check svg{stroke-dashoffset:0}
.meal.eaten .nm{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--mint) 70%,transparent);text-decoration-thickness:2px}
.dish{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);text-align:left;width:100%}
.dish:last-child{border-bottom:0}
.dish .t{font-weight:700;overflow-wrap:anywhere}
.dish .m{font-family:var(--f-num);font-size:12px;color:var(--muted);white-space:nowrap;text-align:right;display:flex;align-items:center;gap:4px;justify-content:flex-end}
.forbid{background:repeating-linear-gradient(-45deg,var(--surface),var(--surface) 12px,color-mix(in srgb,var(--danger) 6%,var(--surface)) 12px,color-mix(in srgb,var(--danger) 6%,var(--surface)) 24px);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.forbid h2::before{background:var(--danger)}
.fitem{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.fitem:last-child{border-bottom:0}
.fitem .fe{font-size:28px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cday{aspect-ratio:1;max-width:100%;border-radius:14px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-num);font-size:12px;position:relative}
.cday .e{font-size:18px;line-height:1}
.cday.today{outline:2px dashed var(--acc);outline-offset:-2px}
.cday.blank{background:transparent}
.cal5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mday{aspect-ratio:1;max-width:100%;border-radius:16px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-num);position:relative}
.mday .n{font-size:16px;font-weight:600}
.mday .k{font-size:9.5px;color:var(--muted)}
.mday svg{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);transform:rotate(-90deg)}
.mday circle{fill:none;stroke-width:3}
.mday .t{stroke:var(--acc-soft)} .mday .p{stroke:var(--mint);stroke-linecap:round}
.mday.today{outline:2px dashed var(--acc);outline-offset:-3px}

/* money */
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav b{font-family:var(--f-display);font-weight:400;font-size:20px;text-align:center}
.monthnav button{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);font-size:18px;font-weight:900;color:var(--acc);flex:0 0 auto}
.catrow{display:flex;flex-direction:column;gap:5px}
.catrow .statrow{color:var(--ink)}
.catrow .statrow span:last-child{color:var(--muted)}
.jar{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:center}
.jarv{width:58px;height:70px;border-radius:14px 14px 18px 18px;border:2.5px solid var(--acc);position:relative;overflow:hidden;background:var(--bg)}

.vgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

.vcard .vact{display:flex;gap:6px;margin-top:auto;align-items:center}

.emopick{display:flex;flex-wrap:wrap;gap:6px}

.emopick button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.grow{display:flex;flex-direction:column;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
