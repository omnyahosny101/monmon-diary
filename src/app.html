<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monmon's Life</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monmon's Life">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fff2f6">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Nunito:wght@400;600;700;800&family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: one phone column. Five tabs (Today, Food, Money, Plans, Me); each tab has a segmented sub-menu and stacked cards. Tab bar pinned to the bottom. */
:root{
  --bg:#fff2f6; --bg2:#ffe3ec; --surface:#ffffff; --ink:#4b1f33; --muted:#9a6a7e;
  --rose:#ff5c8f; --rose-soft:#ffd3e1; --peach:#ffb48f; --mint:#3fbf8f; --lilac:#b9a3ff; --sky:#7cc4ff; --line:#f6d2de; --warn:#ff8a3d;
  --shadow:0 10px 30px -14px rgba(196,62,110,.35);
  --f-display:"Shrikhand","Georgia",serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Fredoka","Nunito",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#24121b; --bg2:#33182a; --surface:#331c28; --ink:#ffe6ef; --muted:#d3a3b8;
  --rose:#ff7aa5; --rose-soft:#5a2440; --peach:#ffad86; --mint:#5fd8aa; --lilac:#c4b2ff; --sky:#8fceff; --line:#4c2a3b; --warn:#ffa36b;
  --shadow:0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#24121b; --bg2:#33182a; --surface:#331c28; --ink:#ffe6ef; --muted:#d3a3b8;
  --rose:#ff7aa5; --rose-soft:#5a2440; --peach:#ffad86; --mint:#5fd8aa; --lilac:#c4b2ff; --sky:#8fceff; --line:#4c2a3b; --warn:#ffa36b;
  --shadow:0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--lilac);outline-offset:2px;border-radius:12px}

.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.5;animation:drift 18s ease-in-out infinite alternate}
.blob.a{width:260px;height:260px;background:var(--rose-soft);top:-60px;right:-80px}
.blob.b{width:220px;height:220px;background:color-mix(in srgb,var(--peach) 45%,transparent);bottom:120px;left:-90px;animation-delay:-6s}
.blob.c{width:160px;height:160px;background:color-mix(in srgb,var(--lilac) 40%,transparent);top:40%;right:-60px;animation-delay:-11s}
@keyframes drift{to{transform:translate(30px,40px) scale(1.1)}}

.app{position:relative;z-index:1;max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 130px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{margin:0;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-family:var(--f-display);font-weight:400;font-size:clamp(25px,7.6vw,34px);line-height:1.05;color:var(--rose)}
h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:21px;color:var(--ink);text-wrap:balance}
h3{margin:0;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--rose)}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
.iconbtn svg{width:20px;height:20px}
.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* segmented control */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:0 -2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;padding:8px 14px;border-radius:999px;background:var(--surface);box-shadow:0 4px 12px -8px rgba(196,62,110,.45);font-size:13px;font-weight:800;color:var(--muted);transition:all .2s}
.seg button[aria-pressed="true"]{background:var(--rose);color:#fff}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 120px}
.card>.field,.sc .field{flex:0 0 auto}
.field span{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.in{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-weight:700;min-width:0}
textarea.in{resize:vertical;min-height:70px;font-weight:600;line-height:1.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.btn{background:var(--rose);color:#fff;font-weight:800;padding:11px 16px;border-radius:14px;flex:0 0 auto}
.btn.soft{background:var(--bg2);color:var(--rose)}
.btn.full{width:100%}
.linkbtn{font-size:12px;font-weight:800;color:var(--rose);padding:6px 10px;border-radius:999px;background:var(--bg2);flex:0 0 auto}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);min-width:0}
.item:last-child{border-bottom:0}
.item .t{font-weight:700;min-width:0;overflow-wrap:anywhere}
.item .s{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.tick{width:26px;height:26px;border-radius:9px;border:2px solid var(--rose-soft);display:grid;place-items:center;transition:all .25s cubic-bezier(.3,1.6,.5,1);flex:0 0 auto}
.tick svg{width:14px;height:14px;stroke:#fff;stroke-width:4;fill:none;opacity:0}
.tick.on{background:var(--mint);border-color:var(--mint);transform:rotate(-6deg)}
.tick.on svg{opacity:1}
.del{color:var(--muted);font-size:20px;line-height:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.del:active{background:var(--bg2)}
.empty{font-size:13px;color:var(--muted);text-align:center;padding:10px 0}
.amt{font-family:var(--f-num);font-weight:600;white-space:nowrap}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border-radius:999px;background:var(--bg);border:2px solid var(--line);font-size:13.5px;font-weight:700;transition:all .2s}
.chip.on{background:var(--rose);border-color:var(--rose);color:#fff;transform:translateY(-1px)}
.chip .cnt{font-family:var(--f-num);font-size:11px;opacity:.85}
.hgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.habit{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:16px;background:var(--bg);border:2px solid var(--line);text-align:left;font-weight:700;font-size:13.5px;min-width:0;transition:all .2s}
.habit .e{font-size:18px}
.habit .hs{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.habit.on{background:color-mix(in srgb,var(--mint) 18%,var(--surface));border-color:var(--mint)}
.habit .hl{min-width:0}

/* hero */
.hero{background:linear-gradient(140deg,var(--surface) 30%,var(--bg2))}
.greet{font-family:var(--f-display);font-size:22px;line-height:1.1}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-num);font-size:20px;font-weight:600;color:var(--rose)}
.stat span{font-size:11px;font-weight:700;color:var(--muted)}

/* mood */
.moods{display:flex;justify-content:space-between;gap:6px}
.mood{flex:1;font-size:26px;padding:8px 0;border-radius:16px;background:var(--bg);border:2px solid var(--line);transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.mood.on{background:var(--rose-soft);border-color:var(--rose);transform:scale(1.08)}
.mood span{display:block;font-size:10px;font-weight:800;color:var(--muted);margin-top:2px}

/* meals (food tab) */
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 8px;margin:0 -2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.dpill{flex:0 0 52px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;border-radius:18px;background:var(--surface);box-shadow:0 4px 12px -8px rgba(196,62,110,.4);font-family:var(--f-num);transition:transform .25s}
.dpill .dn{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dpill .dd{font-size:19px;font-weight:600}
.dpill .dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dpill.done .dot{background:var(--mint)}
.dpill.part .dot{background:var(--peach)}
.dpill.today{outline:2px dashed var(--rose);outline-offset:-4px}
.dpill.sel{background:var(--rose);color:#fff;transform:translateY(-3px)}
.dpill.sel .dn{color:#ffe1ea}
.ringwrap{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{position:relative;width:124px;height:124px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--rose-soft);stroke-width:12}
.ring .fill{fill:none;stroke:url(#grad);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.3,1.4,.5,1)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-family:var(--f-num);font-size:26px;font-weight:600;line-height:1}
.ring .sm{font-size:11px;color:var(--muted);font-weight:700}
.bar{height:10px;border-radius:999px;background:var(--rose-soft);overflow:hidden}
.bar>i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--lilac),var(--rose));transition:width .9s cubic-bezier(.3,1.3,.5,1)}
.bar.over>i{background:linear-gradient(90deg,var(--peach),var(--warn))}
.statrow{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.toggle{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:700;text-align:left}
.sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .25s;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.sw[aria-checked="true"]{background:var(--rose)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.cups{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.cup{aspect-ratio:3/4;max-width:100%;border-radius:10px 10px 14px 14px;border:2px solid var(--rose-soft);position:relative;overflow:hidden}
.cup::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#9fd8ff,#79b8ff);transition:height .45s cubic-bezier(.3,1.4,.5,1)}
.cup.on::after{height:78%}
.cup.on{border-color:#9fd0ff}
.meal{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border-radius:22px;padding:13px;box-shadow:var(--shadow);transition:background .3s}
.meal .ic{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--bg2);color:var(--rose)}
.meal .ic svg{width:24px;height:24px}
.meal .txt{min-width:0}
.meal .lbl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meal .nm{font-weight:700;font-size:14.5px;line-height:1.3;margin-top:2px}
.meal .mac{font-family:var(--f-num);font-size:12px;color:var(--muted);margin-top:3px}
.check{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--rose-soft);display:grid;place-items:center;transition:all .3s cubic-bezier(.3,1.6,.5,1)}
.check svg{width:16px;height:16px;stroke:#fff;stroke-width:3.5;fill:none;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s .1s}
.meal.eaten{background:color-mix(in srgb,var(--mint) 12%,var(--surface))}
.meal.eaten .check{background:var(--mint);border-color:var(--mint)}
.meal.eaten .check svg{stroke-dashoffset:0}
.meal.eaten .nm{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--mint) 70%,transparent);text-decoration-thickness:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cday{aspect-ratio:1;max-width:100%;border-radius:14px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-num);font-size:12px;position:relative}
.cday .e{font-size:18px;line-height:1}
.cday.today{outline:2px dashed var(--rose);outline-offset:-2px}
.cday.blank{background:transparent}
.cal5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.mday{aspect-ratio:1;max-width:100%;border-radius:16px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-num);position:relative}
.mday .n{font-size:16px;font-weight:600}
.mday .k{font-size:9.5px;color:var(--muted)}
.mday svg{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);transform:rotate(-90deg)}
.mday circle{fill:none;stroke-width:3}
.mday .t{stroke:var(--rose-soft)} .mday .p{stroke:var(--mint);stroke-linecap:round}
.mday.today{outline:2px dashed var(--rose);outline-offset:-3px}

/* money */
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav b{font-family:var(--f-display);font-weight:400;font-size:20px}
.monthnav button{width:38px;height:38px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-size:18px;font-weight:800;color:var(--rose)}
.money3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mbox{background:var(--surface);border-radius:20px;padding:12px;box-shadow:var(--shadow);min-width:0}
.mbox b{display:block;font-family:var(--f-num);font-size:18px;font-weight:600;overflow-wrap:anywhere}
.mbox span{font-size:11px;font-weight:800;color:var(--muted)}
.catrow{display:flex;flex-direction:column;gap:5px}
.catrow .statrow{color:var(--ink)}
.catrow .statrow span:last-child{color:var(--muted)}
.store{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--bg2);color:var(--rose);margin-right:4px}

/* self-care & vision */
.sc{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px dashed var(--line)}
.sc:last-child{border-bottom:0}
.sc .em{font-size:26px;line-height:1.2}
.sc .nm{font-weight:800}
.sc .fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.sc .fields .in{padding:8px;font-size:13px;border-radius:12px}
.sc.done .nm::after{content:"  done";font-size:11px;color:var(--mint);font-weight:800}
.vgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.vcard{border-radius:22px;padding:14px;min-height:110px;display:flex;flex-direction:column;gap:6px;position:relative;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.vcard .ve{font-size:30px}
.vcard .vt{font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.vcard .vn{font-size:12px;color:var(--muted);font-weight:600;overflow-wrap:anywhere}
.vcard.got::after{content:"achieved \2665";position:absolute;top:10px;right:-28px;transform:rotate(35deg);background:var(--mint);color:#fff;font-size:10px;font-weight:800;padding:3px 30px}
.vcard .vact{display:flex;gap:6px;margin-top:auto}
.vcard .linkbtn{background:rgba(255,255,255,.75);color:#c2325f}
.emopick{display:flex;flex-wrap:wrap;gap:6px}
.emopick button{font-size:20px;width:38px;height:38px;border-radius:12px;background:var(--bg);border:2px solid var(--line)}
.emopick button[aria-pressed="true"]{border-color:var(--rose);background:var(--rose-soft)}

/* toast + hearts */
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:800;font-size:13px;padding:10px 16px;border-radius:999px;z-index:60;animation:fadeup .3s}
@keyframes fadeup{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.heart{position:fixed;pointer-events:none;z-index:50;font-size:16px;animation:burst 900ms ease-out forwards}
@keyframes burst{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--r));opacity:0}}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:8px;pointer-events:none}
.tabs-in{pointer-events:auto;max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;box-shadow:0 12px 30px -10px rgba(196,62,110,.45);padding:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:18px;font-size:10.5px;font-weight:800;color:var(--muted);transition:all .25s}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{background:var(--rose);color:#fff}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:370px){.hgrid{grid-template-columns:1fr}.ringwrap{grid-template-columns:1fr;justify-items:center}.sc .fields{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="deco" aria-hidden="true"><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9a3ff"/><stop offset=".55" stop-color="#ff5c8f"/><stop offset="1" stop-color="#ffb48f"/></linearGradient></defs></svg>

<main class="app">
  <header class="top">
    <div><p class="eyebrow" id="dateLabel">Today</p><h1>Monmon's Life</h1></div>

</main>

<nav class="tabs" aria-label="Sections"><div class="tabs-in" role="tablist" id="tabs"></div></nav>

<script>
"use strict";
const PLAN = __DATA__;
const GROC = __GROC__;

/* ============ helpers ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_L = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmt = n => Math.round(n).toLocaleString('en-US');
const money = n => fmt(n || 0) + ' EGP';
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const ym = d => d.getFullYear() + '-' + pad(d.getMonth() + 1);
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1); };
const todayStr = () => ymd(new Date());
const nice = s => { const d = parseD(s); return WD[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function weekStart(d){ const x = new Date(d); x.setHours(0,0,0,0); const k = (x.getDay() + 6) % 7; x.setDate(x.getDate() - k); return x; }

/* ============ defaults ============ */
const HABITS = [
  {id:'shower', name:'Shower', e:'\u{1F6BF}', freq:'daily'},
  {id:'vitamins', name:'Vitamins', e:'\u{1F48A}', freq:'daily'},
  {id:'nosugar', name:'No sugar or junk', e:'\u{1F36D}', freq:'daily'},
  {id:'read', name:'Read 5+ pages', e:'\u{1F4D6}', freq:'daily'},
  {id:'listen', name:'Podcast or episode', e:'\u{1F3A7}', freq:'daily'},
  {id:'drybrush', name:'Dry brushing', e:'\u{1FAA5}', freq:'weekly', target:2},
  {id:'hair', name:'Wash hair', e:'\u{1F9F4}', freq:'weekly', target:1},
  {id:'donate', name:'Donation or sadaqa', e:'\u{1F49D}', freq:'weekly', target:1},
];
const DAYLOG = [
  {id:'worked', name:'Worked', e:'\u{1F4BC}'}, {id:'wfh', name:'Worked from home', e:'\u{1F3E0}'},
  {id:'gym', name:'Gym', e:'\u{1F3CB}\u{FE0F}'}, {id:'friends', name:'Out with friends', e:'\u{1F46F}'},
  {id:'fiance', name:'With my fiancé', e:'\u{1F48D}'}, {id:'family', name:'With family', e:'\u{1F3E1}'},
  {id:'pamper', name:'Pampered myself', e:'\u{1F485}'}, {id:'meshwar', name:'Finished a meshwar', e:'\u{1F697}'},
];
const MOODS = [{e:'\u{1F622}',t:'Sad'},{e:'\u{1F615}',t:'Meh'},{e:'\u{1F610}',t:'Okay'},{e:'\u{1F642}',t:'Good'},{e:'\u{1F970}',t:'Amazing'}];
const SELFCARE = [
  {name:'Laser hair removal', e:'✨'}, {name:'Moroccan bath', e:'\u{1F6C1}'}, {name:'Lashes', e:'\u{1F441}\u{FE0F}'},
  {name:'Spider veins removal', e:'\u{1F9B5}'}, {name:'Dermapen session', e:'\u{1FAA1}'}, {name:'Pico laser session', e:'\u{1F48E}'},
  {name:'Filler injection', e:'\u{1F489}'}, {name:'Skin booster session', e:'\u{1F4A7}'},
];
const CATS = [
  {id:'food', name:'Food & groceries', e:'\u{1F96C}'}, {id:'out', name:'Eating out & outings', e:'\u{1F370}'},
  {id:'delivery', name:'Talabat, Noon, Amazon', e:'\u{1F6CD}\u{FE0F}'}, {id:'selfcare', name:'Self-care', e:'\u{1F338}'},
  {id:'pets', name:'Pets', e:'\u{1F431}'}, {id:'subs', name:'Subscriptions', e:'\u{1F4F1}'},
  {id:'gifts', name:'Gifts & occasions', e:'\u{1F381}'}, {id:'transport', name:'Transport', e:'\u{1F695}'},
  {id:'donations', name:'Donations', e:'\u{1F932}'}, {id:'wedding', name:'Wedding', e:'\u{1F470}'},
  {id:'shopping', name:'Clothes & shopping', e:'\u{1F457}'}, {id:'bills', name:'Bills', e:'\u{1F9FE}'}, {id:'other', name:'Other', e:'\u{1F4B8}'},
];
const STORES = ['Talabat','Noon','Amazon','Other'];
const VEMO = ['\u{1F697}','\u{1F3E1}','✈\u{FE0F}','\u{1F48D}','\u{1F4B0}','\u{1F4DA}','\u{1F338}','\u{1F4BB}','\u{1F431}','\u{1F3D6}\u{FE0F}','\u{1F45C}','⭐'];
const VCOL = ['#ffe3ec','#e9e2ff','#ffe6d8','#dff5ec','#e0f0ff','#fff3c9'];

const DEF = () => ({
  v:2, start:'2026-11-01', checks:{}, water:{}, gym:{}, groc:{},
  settings:{invest:0, budgets:{}, rem:{meals:true, water:true, diary:true, money:true, checkin:true, plans:true}},
  hlog:{}, daylog:{}, diary:{}, media:{}, mashawer:[], selfcare:{}, spend:[], salary:{}, investDone:{}, shop:[], tasks:[], vision:[], savedAt:0
});

/* ============ storage ============ */
const LS = 'monmon-life-v2';
let S = DEF();
(function load(){
  let local = null, native = null;
  try { local = JSON.parse(localStorage.getItem(LS) || 'null'); } catch(e){}
  if (!local){ try { const old = JSON.parse(localStorage.getItem('monmon-v1') || 'null'); if (old) local = old; } catch(e){} }
  try { native = window.__NATIVE_STATE__ || null; } catch(e){}
  const pick = (native && (!local || (native.savedAt || 0) >= (local.savedAt || 0))) ? native : local;
  if (pick && typeof pick === 'object') S = merge(DEF(), pick);
})();
function merge(base, src){
  for (const k in src){
    if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) base[k] = merge(base[k], src[k]);
    else base[k] = src[k];
  }
  return base;
}
function native(){ try { return window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.app; } catch(e){ return null; } }
let saveTimer = null;
function save(){
  S.savedAt = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(syncNative, 400);
}
function syncNative(){
  const n = native(); if (!n) return;
  try { n.postMessage({type:'sync', state: JSON.stringify(S), reminders: buildReminders(), start: S.start}); } catch(e){}
}
function toast(t){ document.querySelectorAll('.toast').forEach(x => x.remove()); const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 1800); }
function hearts(x, y){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const g = ['♥','✦','♥','❀'], c = ['var(--rose)','var(--peach)','var(--lilac)','var(--mint)'];
  for (let i = 0; i < 10; i++){
    const h = document.createElement('span'); h.className = 'heart'; h.textContent = g[i % 4];
    const a = Math.random() * Math.PI * 2, r = 40 + Math.random() * 50;
    h.style.left = x + 'px'; h.style.top = y + 'px'; h.style.color = c[i % 4];
    h.style.setProperty('--dx', Math.cos(a) * r + 'px'); h.style.setProperty('--dy', Math.sin(a) * r - 30 + 'px'); h.style.setProperty('--r', (Math.random() * 120 - 60) + 'deg');
    document.body.appendChild(h); setTimeout(() => h.remove(), 950);
  }
}

/* ============ reminders (scheduled by the iPhone app) ============ */
function buildReminders(){
  const R = S.settings.rem, now = new Date(), once = [], repeat = [];
  const at = (d, h, m) => { const x = new Date(d); x.setHours(h, m, 0, 0); return x; };
  const iso = d => ymd(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (R.water) [11,13,16,19].forEach(h => repeat.push({id:'water-'+h, title:'Water break', body:'Have a glass of water and tap it in Monmon’s Life.', hour:h, minute:0}));
  if (R.diary){
    repeat.push({id:'diary-0', title:'Diary time, Monmon ♡', body:'How was today? Write a few lines and pick your mood.', hour:0, minute:0});
    repeat.push({id:'diary-2', title:'Before you sleep ♡', body:'If you haven’t yet, close the day in your diary.', hour:2, minute:0});
  }
  if (R.checkin) repeat.push({id:'checkin', title:'Evening check-in', body:'Tick your habits and log what you did today.', hour:22, minute:0});
  if (R.money){
    const amt = S.settings.invest ? (fmt(S.settings.invest) + ' EGP') : 'your monthly amount';
    repeat.push({id:'invest', title:'New month: invest \u{1F4B0}', body:'Add ' + amt + ' to your investments this month.', day:1, hour:10, minute:0});
    repeat.push({id:'gold', title:'Gold reminder ✨', body:'Buy gold this month.', day:1, hour:10, minute:5});
    repeat.push({id:'scplan', title:'Plan your self-care month \u{1F338}', body:'Open Plans › Self-care and set this month’s sessions and prices.', day:1, hour:10, minute:10});
    repeat.push({id:'salary', title:'Log your salary', body:'Add this month’s salary in Money › Salary.', day:1, hour:12, minute:0});
  }
  if (R.plans){
    S.mashawer.filter(m => !m.done && m.remind !== false && m.date).forEach(m => {
      const t = m.time ? m.time.split(':').map(Number) : [10, 0];
      const when = at(parseD(m.date), t[0], t[1]); when.setDate(when.getDate() - 1);
      if (when > now) once.push({id:'m-'+m.id, title:'Tomorrow: ' + m.name, body:(m.time ? 'At ' + m.time + '. ' : '') + (m.note || 'Your meshwar is tomorrow.'), at: iso(when)});
    });
    Object.values(S.selfcare).forEach(list => list.forEach(s => {
      if (s.done || !s.planned) return;
      const when = at(parseD(s.planned), 20, 0); when.setDate(when.getDate() - 1);
      if (when > now) once.push({id:'s-'+s.id, title:'Tomorrow: ' + s.e + ' ' + s.name, body: s.price ? ('Budget: ' + money(s.price)) : 'Your self-care session is tomorrow.', at: iso(when)});
    }));
    S.tasks.filter(t => !t.done && t.due).forEach(t => {
      const when = at(parseD(t.due), 9, 0);
      if (when > now) once.push({id:'t-'+t.id, title:(t.kind === 'work' ? 'Work task due today' : 'To-do today'), body:t.title, at: iso(when)});
    });
  }
  if (R.meals){
    const slots = [['Breakfast',9,0],['Lunch',14,0],['Snack',17,30],['Dinner',20,30]];
    for (let o = 0; o < 5; o++){
      const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() + o);
      const n = planDayNum(d); if (n < 1 || n > 30) continue;
      PLAN[n-1].meals.forEach((m, i) => { const w = at(d, slots[i][1], slots[i][2]); if (w > now) once.push({id:'meal-'+n+'-'+i, title:slots[i][0] + ' time, Monmon ♡', body:m.name + ' · ' + m.kcal + ' kcal', at: iso(w)}); });
    }
  }
  once.sort((a, b) => a.at < b.at ? -1 : 1);
  return {repeat, once};
}

/* ============ plan helpers ============ */
function planDayNum(date){ const d = new Date(date); d.setHours(0,0,0,0); return Math.round((d - parseD(S.start)) / 864e5) + 1; }
const clampDay = n => Math.min(30, Math.max(1, n));
function planDate(n){ const d = parseD(S.start); d.setDate(d.getDate() + n - 1); return d; }

/* ============ navigation ============ */
const TABS = [
  {id:'today', name:'Today', icon:'<path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4"/>', subs:null},
  {id:'food', name:'Food', icon:'<circle cx="12" cy="13" r="7"/><circle cx="12" cy="13" r="3.5"/><path d="M3 3v6M21 3c-1.5 1-2 3-2 5h2V3zM21 8v13"/>', subs:[['meals','Meals'],['month','Month'],['groc','Groceries'],['tips','Tips']]},
  {id:'money', name:'Money', icon:'<rect x="2.5" y="6" width="19" height="13" rx="3"/><path d="M2.5 10h19M16 15h2"/>', subs:[['overview','Overview'],['spend','Spending'],['receipts','Receipts'],['salary','Salary'],['pets','Pets']]},
  {id:'plans', name:'Plans', icon:'<path d="M12 21s-6-5.3-6-11a6 6 0 0 1 12 0c0 5.7-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/>', subs:[['mashawer','Mashawer'],['selfcare','Self-care'],['tasks','Tasks'],['shop','Shopping'],['vision','Vision board']]},
  {id:'me', name:'Me', icon:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>', subs:[['diary','Diary'],['stats','Habits'],['settings','Settings']]},
];
let nav = {tab:'today', sub:{food:'meals', money:'overview', plans:'mashawer', me:'diary'}};
let ui = {foodDay: null, moneyMonth: ym(new Date()), scMonth: ym(new Date()), diaryMonth: ym(new Date()), vEmo: VEMO[0]};
try { const n = JSON.parse(sessionStorage.getItem('monmon-nav') || 'null'); if (n) nav = n; } catch(e){}

function renderTabs(){
  $('#tabs').innerHTML = TABS.map(t => '<button class="tab" role="tab" data-t="' + t.id + '" aria-selected="' + (nav.tab === t.id) + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + t.icon + '</svg>' + t.name + '</button>').join('');
  $('#tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => go(b.dataset.t));
}
function go(tab, sub){
  nav.tab = tab; if (sub) nav.sub[tab] = sub;
  try { sessionStorage.setItem('monmon-nav', JSON.stringify(nav)); } catch(e){}
  render(); window.scrollTo({top:0});
}
function segHTML(t){
  const T = TABS.find(x => x.id === t); if (!T.subs) return '';
  return '<div class="seg" role="tablist">' + T.subs.map(s => '<button data-sub="' + s[0] + '" aria-pressed="' + (nav.sub[t] === s[0]) + '">' + s[1] + '</button>').join('') + '</div>';
}
function render(){
  const d = new Date();
  $('#dateLabel').textContent = WD[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS_L[d.getMonth()];
  renderTabs();
  const v = $('#views');
  const sub = nav.sub[nav.tab];
  v.innerHTML = '<section class="view">' + segHTML(nav.tab) + '<div class="view" id="body"></div></section>';
  v.querySelectorAll('.seg button').forEach(b => b.onclick = () => go(nav.tab, b.dataset.sub));
  const body = $('#body');
  const R = {
    today: renderToday,
    food: {meals: renderMeals, month: renderMonth, groc: renderGroc, tips: renderTips},
    money: {overview: renderMoney, spend: renderSpend, receipts: renderReceipts, salary: renderSalary, pets: renderPets},
    plans: {mashawer: renderMashawer, selfcare: renderSelfcare, tasks: renderTasks, shop: renderShop, vision: renderVision},
    me: {diary: renderDiary, stats: renderStats, settings: renderSettings},
  }[nav.tab];
  (typeof R === 'function' ? R : R[sub])(body);
}
$('#openSettings').onclick = () => go('me', 'settings');

/* ============ TODAY ============ */
function habitDoneToday(id, day){ return !!(S.hlog[day] && S.hlog[day][id]); }
function weekCount(id, dayStr){
  const ws = weekStart(parseD(dayStr)); let c = 0;
  for (let i = 0; i < 7; i++){ const d = new Date(ws); d.setDate(ws.getDate() + i); if (habitDoneToday(id, ymd(d))) c++; }
  return c;
}
function spentOn(day){ return S.spend.filter(s => s.date === day).reduce((a, s) => a + (+s.amount || 0), 0); }
function renderToday(el){
  const day = todayStr(), h = new Date().getHours();
  const greet = h < 5 ? 'Still up, Monmon?' : h < 12 ? 'Sabah el kheir, Monmon' : h < 18 ? 'Hello, Monmon' : 'Masa2 el kheir, Monmon';
  const n = planDayNum(new Date()), inPlan = n >= 1 && n <= 30;
  let eaten = 0; if (inPlan) for (let i = 0; i < 4; i++) if (S.checks[n + '-' + i]) eaten++;
  const hDone = HABITS.filter(x => habitDoneToday(x.id, day)).length;
  const media = S.media[day] || {};
  const diary = S.diary[day] || {};
  const logs = S.daylog[day] || [];
  const coming = upcoming().slice(0, 4);
  const dayCats = S.spend.filter(s => s.date === day);
  el.innerHTML =
  '<div class="card hero"><div class="greet">' + greet + '</div>' +
    '<div class="stats3"><div class="stat"><b>' + (inPlan ? eaten + '/4' : '–') + '</b><span>meals</span></div><div class="stat"><b>' + hDone + '/' + HABITS.length + '</b><span>habits</span></div><div class="stat"><b>' + fmt(spentOn(day)) + '</b><span>EGP spent</span></div></div></div>' +

  '<div class="card"><div class="card-head"><h2>Today’s habits</h2><span class="small muted">tap to tick</span></div><div class="hgrid">' +
    HABITS.map(x => { const on = habitDoneToday(x.id, day); const sub = x.freq === 'weekly' ? (weekCount(x.id, day) + '/' + x.target + ' this week') : 'daily';
      return '<button class="habit' + (on ? ' on' : '') + '" data-h="' + x.id + '" aria-pressed="' + on + '"><span class="e">' + x.e + '</span><span class="hl">' + x.name + '<span class="hs">' + sub + '</span></span></button>'; }).join('') +
  '</div></div>' +

  '<div class="card"><h2>Reading & listening</h2><div class="row">' +
    '<label class="field" style="flex:2 1 160px"><span>BOOK</span><input class="in" id="mBook" placeholder="What are you reading?" value="' + esc(media.book || S.lastBook || '') + '"></label>' +
    '<label class="field" style="flex:1 1 80px"><span>PAGES TODAY</span><input class="in num" id="mPages" type="number" inputmode="numeric" min="0" value="' + esc(media.pages || '') + '"></label></div>' +
    '<label class="field"><span>PODCAST OR EPISODE</span><input class="in" id="mEp" placeholder="El Da7ee7, El Hadara…" value="' + esc(media.episode || '') + '"></label>' +
    '<p class="small muted" style="margin:0">5 pages or more ticks reading; an episode ticks listening.</p></div>' +

  '<div class="card"><h2>What did I do today?</h2><div class="chips">' +
    DAYLOG.map(x => '<button class="chip' + (logs.includes(x.id) ? ' on' : '') + '" data-l="' + x.id + '">' + x.e + ' ' + x.name + '</button>').join('') +
  '</div></div>' +

  '<div class="card"><div class="card-head"><h2>Dear diary</h2><span class="small muted">' + nice(day) + '</span></div>' +
    '<div class="moods">' + MOODS.map((m, i) => '<button class="mood' + (diary.mood === i + 1 ? ' on' : '') + '" data-mood="' + (i + 1) + '" aria-label="' + m.t + '">' + m.e + '<span>' + m.t + '</span></button>').join('') + '</div>' +
    '<label class="field"><span>WHAT I DID</span><textarea class="in" id="dSum" placeholder="A little summary of my day…">' + esc(diary.summary || '') + '</textarea></label>' +
    '<label class="field"><span>HOW I FELT</span><textarea class="in" id="dFeel" placeholder="My feelings today…">' + esc(diary.feelings || '') + '</textarea></label></div>' +

  '<div class="card"><div class="card-head"><h2>Spent today</h2><span class="amt">' + money(spentOn(day)) + '</span></div>' +
    '<div class="row"><label class="field" style="flex:1 1 90px"><span>AMOUNT</span><input class="in num" id="qAmt" type="number" inputmode="decimal" min="0" placeholder="0"></label>' +
    '<label class="field" style="flex:2 1 150px"><span>CATEGORY</span><select class="in" id="qCat">' + CATS.map(c => '<option value="' + c.id + '">' + c.e + ' ' + c.name + '</option>').join('') + '</select></label></div>' +
    '<div class="row"><label class="field"><span>NOTE</span><input class="in" id="qNote" placeholder="What was it?"></label><button class="btn" id="qAdd">Add</button></div>' +
    '<div class="list">' + (dayCats.length ? dayCats.map(spendRow).join('') : '<div class="empty">Nothing spent yet today.</div>') + '</div></div>' +

  '<div class="card"><div class="card-head"><h2>Coming up</h2><button class="linkbtn" data-go="plans">Plans</button></div><div class="list">' +
    (coming.length ? coming.map(c => '<div class="item"><span style="font-size:20px">' + c.e + '</span><span class="t">' + esc(c.title) + '<span class="s">' + c.when + '</span></span><span></span></div>').join('') : '<div class="empty">No mashawer, sessions or tasks coming up.</div>') +
  '</div></div>' +

  return SELFCARE.map((s, i) => ({id:uid(), name:s.name, e:s.e, price:'', planned:ymd(new Date(first.getFullYear(), first.getMonth(), startDay + i * step)), done:'', spendId:''}));

  const R = S.settings.rem, B = S.settings.budgets || {};
  const sw = (k, label, sub) => '<button class="toggle" data-rem="' + k + '" style="justify-content:space-between;width:100%"><span>' + label + '<span class="s small muted" style="display:block;font-weight:600">' + sub + '</span></span><span class="sw" role="switch" aria-checked="' + !!R[k] + '"></span></button>';
  el.innerHTML = '<div class="card"><h2>Meal plan</h2><label class="field"><span>PLAN START DATE (DAY 1)</span><input class="in" id="stStart" type="date" value="' + esc(S.start) + '"></label></div>' +
    '<div class="card"><h2>Money</h2><label class="field"><span>MONTHLY INVESTMENT AMOUNT (EGP)</span><input class="in num" id="stInv" type="number" inputmode="decimal" min="0" value="' + esc(S.settings.invest || '') + '" placeholder="0"></label>' +
      '<h3 style="margin-top:4px">Monthly budgets</h3>' + CATS.map(c => '<div class="item"><span style="font-size:18px">' + c.e + '</span><span class="t">' + c.name + '</span><input class="in num" data-bud="' + c.id + '" type="number" inputmode="decimal" min="0" placeholder="No limit" value="' + esc(B[c.id] || '') + '" style="width:110px;text-align:right"></div>').join('') + '</div>' +
    '<div class="card"><h2>Reminders</h2>' + (native() ? '' : '<p class="small" style="margin:0;font-weight:700;color:var(--rose)">Reminders work in the iPhone app. In the browser these switches are saved for when you use the app.</p>') +
      sw('meals', 'Meals', '9:00, 14:00, 17:30, 20:30 with that day’s meal') + sw('water', 'Water', '11:00, 13:00, 16:00, 19:00') +
      sw('diary', 'Diary', '12:00 am and 2:00 am') + sw('checkin', 'Evening check-in', '10:00 pm: habits and day log') +
      sw('money', 'Start of the month', 'Invest, buy gold, plan self-care, log salary') + sw('plans', 'Mashawer, self-care and tasks', 'A day before mashawer and sessions; 9:00 on task due dates') + '</div>' +
    '<div class="card"><h2>Backup</h2><p class="small muted" style="margin:0;font-weight:600">Everything is saved on this phone. Copy a backup now and then, and paste it back if you ever reinstall.</p>' +
      '<div class="row"><button class="btn soft" id="bkCopy">Copy backup</button><button class="btn soft" id="bkShow">Restore from backup</button></div>' +
      '<div id="bkBox" hidden><textarea class="in" id="bkText" placeholder="Paste your backup here"></textarea><button class="btn full" id="bkRestore" style="margin-top:8px">Restore</button></div></div>' +
    '<p class="note">Monmon’s Life · made for Omnya ♡</p>';
  $('#stStart', el).onchange = e => { if (e.target.value){ S.start = e.target.value; ui.foodDay = null; save(); toast('Start date saved'); } };
  $('#stInv', el).onchange = e => { S.settings.invest = +e.target.value || 0; save(); toast('Saved'); };
  el.querySelectorAll('[data-bud]').forEach(i => i.onchange = () => { S.settings.budgets = S.settings.budgets || {}; const v = +i.value; if (v > 0) S.settings.budgets[i.dataset.bud] = v; else delete S.settings.budgets[i.dataset.bud]; save(); toast('Budget saved'); });
  el.querySelectorAll('[data-rem]').forEach(b => b.onclick = () => { const k = b.dataset.rem; R[k] = !R[k]; $('.sw', b).setAttribute('aria-checked', R[k]); save(); });
  $('#bkCopy', el).onclick = async () => { const txt = JSON.stringify(S); try { await navigator.clipboard.writeText(txt); toast('Backup copied. Paste it in Notes.'); } catch(e){ $('#bkBox', el).hidden = false; $('#bkText', el).value = txt; $('#bkText', el).select(); toast('Select all and copy'); } };
  $('#bkShow', el).onclick = () => { $('#bkBox', el).hidden = false; $('#bkText', el).value = ''; };
  $('#bkRestore', el).onclick = () => { try { const d = JSON.parse($('#bkText', el).value); if (!d || typeof d !== 'object') throw 0; S = merge(DEF(), d); save(); toast('Restored ♡'); render(); } catch(e){ toast('That backup text isn’t valid'); } };
}

/* ============ boot ============ */
if (!TABS.some(t => t.id === nav.tab)) nav.tab = 'today';
render();
syncNative();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (nav.tab === 'today') render(); syncNative(); } });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
